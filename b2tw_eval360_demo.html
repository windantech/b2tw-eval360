<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>B2THEWORLD · Eval360</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
/* ═══════════════════════════════════════════════════════════════════════════
   1. TOKENS — every colour in the product resolves from here, so rebranding
      is this block and nothing else. Charts read the same values.
   ═══════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#f2f5f7; --bg-card:#ffffff; --bg-muted:#e7edf1;
  --ink:#0f2230; --ink-soft:#3c5162; --ink-mute:#6d8396;
  --line:#ccd9e2; --line-soft:#e3ebf0;
  --brand:#15405c; --brand-deep:#0c2a3e; --brand-soft:#dceaf3;
  --accent:#c9741f; --accent-soft:#faecd9;
  --ok:#1d7a4f; --ok-soft:#dcf0e5;
  --warn:#b9770e; --warn-soft:#fbeed4;
  --bad:#a32828; --bad-soft:#f9e4e2;
  --info:#20627f; --info-soft:#dceef5;
  --radius:12px;
  --shadow:0 1px 2px rgba(15,34,48,.06),0 2px 8px rgba(15,34,48,.05);
  --shadow-lg:0 8px 30px rgba(15,34,48,.16);
  --sidebar-w:242px;
}

/* ═══════════════════════════════════════════════════════════════════════════
   2. BASE
   ═══════════════════════════════════════════════════════════════════════════ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:400 13.5px/1.6 'Inter',system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-family:'Fraunces',Georgia,serif;text-wrap:balance}
a{color:var(--brand)}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
button{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:var(--bg-card);color:var(--ink);border-radius:9px;padding:8px 14px;
  font:600 12.5px/1 'Inter',sans-serif;cursor:pointer;white-space:nowrap;
  transition:border-color .14s,background .14s,color .14s}
.btn:hover{background:var(--bg-muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
.btn-ghost:hover{background:var(--bg-muted)}
.btn-sm{padding:6px 10px;font-size:11.5px}

.chip{display:inline-flex;align-items:center;gap:4px;border-radius:30px;padding:3px 9px;
  font:600 10.5px/1.4 'Inter',sans-serif;white-space:nowrap}
.chip.grey{background:var(--bg-muted);color:var(--ink-soft)}
.chip.brand{background:var(--brand-soft);color:var(--brand)}
.chip.accent{background:var(--accent-soft);color:var(--accent)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.info{background:var(--info-soft);color:var(--info)}

.card{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:13px 16px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.card-head h3{font-size:14.5px;font-weight:600}
.card-body{padding:14px 16px}

.sec-title{font:700 20px/1.25 'Fraunces',serif;margin-bottom:5px}
.sec-sub{font-size:13px;color:var(--ink-soft);margin-bottom:17px;max-width:62em;line-height:1.65}

.kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}
.kpi{background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow)}
.kpi .k-l{font:600 10px/1.3 'Inter',sans-serif;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-mute);margin-bottom:7px}
.kpi .k-v{font:700 25px/1 'Fraunces',serif;font-variant-numeric:tabular-nums}
.kpi .k-s{font-size:11px;color:var(--ink-mute);margin-top:5px;line-height:1.45}

.panel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:18px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:13px}

.tbl-scroll{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
table.dt th{text-align:left;background:var(--bg-muted);color:var(--ink-mute);
  font:700 9.5px/1.3 'Inter',sans-serif;letter-spacing:.09em;text-transform:uppercase;
  padding:9px 12px;border-bottom:1px solid var(--line);position:sticky;top:0}
table.dt td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.dt tr:last-child td{border-bottom:0}
table.dt td.n,table.dt th.n{text-align:right;font-variant-numeric:tabular-nums}
table.dt tr.clickable{cursor:pointer}
table.dt tr.clickable:hover{background:var(--bg-muted)}

.bar{height:7px;border-radius:4px;background:var(--bg-muted);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}

.banner{display:flex;gap:11px;align-items:flex-start;border-radius:var(--radius);
  padding:13px 16px;margin-bottom:17px;font-size:12.5px;line-height:1.6}
.banner i{font-size:15px;margin-top:1px;flex:none}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner strong{color:inherit}

.empty{text-align:center;padding:44px 24px;background:var(--bg-card);border:1px solid var(--line);
  border-radius:var(--radius)}
.empty i{font-size:29px;color:var(--ink-mute);opacity:.6}
.empty h4{margin:12px 0 6px;font-size:15px}
.empty p{margin:0 auto;max-width:50ch;font-size:12.5px;color:var(--ink-soft);line-height:1.65}

.chart-wrap{position:relative;height:232px;padding:5px 10px 10px}

/* ═══════════════════════════════════════════════════════════════════════════
   3. LAYOUT
   ═══════════════════════════════════════════════════════════════════════════ */
.app{display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);min-height:100vh}
.sb{background:var(--brand-deep);color:#dde8ef;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;z-index:40}
.sb-brand{display:flex;gap:10px;align-items:center;padding:16px 15px 14px;
  border-bottom:1px solid rgba(255,255,255,.1)}
.sb-mark{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.15);
  display:grid;place-items:center;font:700 12px 'Fraunces',serif;color:#fff;flex:none;overflow:hidden}
.sb-mark.has-logo{background:#fff;padding:3px}
.sb-mark img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.sb-brand-name{font:600 13.5px/1.2 'Fraunces',serif;color:#fff}
.sb-brand-sub{font-size:9px;letter-spacing:.07em;text-transform:uppercase;
  color:rgba(221,232,239,.58);margin-top:2px}
.sb-scroll{flex:1;overflow-y:auto;padding:9px 0 16px}
.sb-g{padding:12px 15px 4px;font:700 9px/1.3 'Inter',sans-serif;letter-spacing:.12em;
  text-transform:uppercase;color:rgba(221,232,239,.42)}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 15px;font-size:12.5px;
  color:rgba(221,232,239,.84);cursor:pointer;border:0;background:none;width:100%;text-align:left;
  font-family:inherit}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.on{background:rgba(255,255,255,.13);color:#fff;font-weight:600;
  box-shadow:inset 3px 0 0 var(--accent)}
.nav-item i{width:15px;text-align:center;font-size:13px;flex:none}
.nav-item .nb{margin-left:auto;background:var(--accent);color:#fff;border-radius:20px;
  padding:1px 6px;font:700 9.5px 'Inter',sans-serif}
.sb-foot{padding:11px 15px;border-top:1px solid rgba(255,255,255,.1);font-size:10px;
  color:rgba(221,232,239,.5);line-height:1.5}

.content{display:flex;flex-direction:column;min-width:0}
.tb{position:sticky;top:0;z-index:30;background:var(--bg-card);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;
  padding:10px 20px;flex-wrap:wrap}
.tb-title{font:600 15px/1.2 'Fraunces',serif}
.tb-crumb{font-size:10.5px;color:var(--ink-mute);letter-spacing:.06em;text-transform:uppercase}
.tb-spacer{flex:1}
.sel-wrap{display:flex;align-items:center;gap:6px}
.sel-lbl{font-size:10px;color:var(--ink-mute);letter-spacing:.07em;text-transform:uppercase}
.tb select{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:500 12px 'Inter',sans-serif;
  background:var(--bg);color:var(--ink);max-width:210px}
.tb-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);
  border-radius:20px;padding:5px 11px;font:600 11px 'Inter',sans-serif;color:var(--ink-soft);
  background:var(--bg);cursor:pointer}
.tb-avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;
  display:grid;place-items:center;font:700 11px 'Inter',sans-serif}
.tb-hamburger{display:none;border:0;background:none;font-size:19px;color:var(--ink);cursor:pointer}
.main{padding:22px;max-width:1420px;width:100%}
.view{display:none}.view.active{display:block}

#sb-backdrop{display:none}
.modal-overlay{position:fixed;inset:0;background:rgba(12,42,62,.46);z-index:60;
  display:none;align-items:flex-start;justify-content:center;padding:36px 18px;overflow-y:auto}
.modal-overlay.open{display:flex}
.modal{background:var(--bg-card);border-radius:14px;box-shadow:var(--shadow-lg);
  width:100%;max-width:620px;overflow:hidden}
.modal.wide{max-width:980px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:15px 19px;border-bottom:1px solid var(--line-soft)}
.modal-head h3{font-size:15.5px;font-weight:600}
.modal-body{padding:18px 19px;max-height:70vh;overflow-y:auto}
.modal-foot{display:flex;gap:9px;align-items:center;padding:13px 19px;
  border-top:1px solid var(--line-soft);background:var(--bg)}
#toasts{position:fixed;right:18px;bottom:18px;z-index:80;display:flex;flex-direction:column;gap:9px}
.toast{background:var(--bg-card);border:1px solid var(--line);border-left-width:3px;
  border-radius:10px;box-shadow:var(--shadow-lg);padding:11px 15px;font-size:12.5px;
  max-width:400px;line-height:1.55;animation:tin .22s ease}
.toast.ok{border-left-color:var(--ok)} .toast.warn{border-left-color:var(--warn)}
.toast.bad{border-left-color:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ───────────────────────────────────────────────────────────────────────
   3b. STAGE 3 — hero, theory of change, logframe, indicators
   ─────────────────────────────────────────────────────────────────────── */
.hero{background:linear-gradient(125deg,var(--brand-deep) 0%,var(--brand) 62%,#1d5a7e 100%);
  color:#fff;border-radius:var(--radius);padding:22px 24px;margin-bottom:18px;position:relative;
  overflow:hidden}
.hero::after{content:'';position:absolute;right:-70px;top:-70px;width:250px;height:250px;
  border-radius:50%;background:rgba(255,255,255,.055)}
.hero h2{font-size:22px;margin-bottom:6px;position:relative}
.hero .h-vision{font-size:13.5px;color:rgba(255,255,255,.88);max-width:54em;line-height:1.6;
  position:relative}
.hero .h-meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px;position:relative}
.hero .h-pill{background:rgba(255,255,255,.16);border-radius:30px;padding:4px 12px;
  font:600 11px 'Inter',sans-serif}

.cta{display:flex;gap:14px;align-items:flex-start;background:var(--accent-soft);
  border:1px solid var(--accent);border-radius:var(--radius);padding:15px 18px;margin-bottom:18px}
.cta i.big{font-size:21px;color:var(--accent);margin-top:2px}
.cta h4{font-size:15px;margin-bottom:5px}
.cta p{margin:0 0 10px;font-size:12.5px;line-height:1.6;color:var(--ink-soft);max-width:60em}

/* A target with the figures it was chosen over, side by side. */
.dual{border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-card);
  padding:14px 16px}
.dual .d-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.dual .d-l{font:600 10px 'Inter',sans-serif;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-mute)}
.dual .d-v{font:700 23px/1 'Fraunces',serif;font-variant-numeric:tabular-nums}
.dual .d-alt{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;padding-top:10px;
  border-top:1px dashed var(--line)}
.dual .d-a{font-size:11px;color:var(--ink-mute);line-height:1.45}
.dual .d-a b{display:block;color:var(--ink);font-variant-numeric:tabular-nums;font-size:12.5px}

.alert{display:grid;grid-template-columns:30px 1fr auto;gap:11px;align-items:start;
  padding:11px 0;border-bottom:1px solid var(--line-soft)}
.alert:last-child{border-bottom:0}
.alert .a-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:13px}
.alert .a-t{font-size:12.5px;font-weight:600;line-height:1.4}
.alert .a-s{font-size:11.5px;color:var(--ink-mute);line-height:1.5;margin-top:2px}

/* Theory of change — four columns, left to right. */
.toc-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.toc-col h4{font:700 10px 'Inter',sans-serif;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-mute);margin-bottom:9px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.toc-card{background:var(--bg-card);border:1px solid var(--line);border-left:3px solid var(--brand);
  border-radius:10px;padding:12px 13px;margin-bottom:10px}
.toc-card.p{border-left-color:var(--bad)}
.toc-card.oc{border-left-color:var(--ok)}
.toc-card.op{border-left-color:var(--info)}
.toc-card.ac{border-left-color:var(--accent)}
.toc-card .c-code{font:700 10.5px 'JetBrains Mono',monospace;color:var(--ink-mute)}
.toc-card .c-title{font:600 12.5px/1.35 'Inter',sans-serif;margin:3px 0 5px}
.toc-card .c-text{font-size:11.5px;line-height:1.55;color:var(--ink-soft)}
.toc-card .c-ind{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line);font-size:11px;
  color:var(--ink-mute);line-height:1.5}

.as-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:11px}
.as{background:var(--bg-muted);border-radius:10px;padding:12px 13px;font-size:11.5px;line-height:1.55}
.as b{display:block;font:700 10.5px 'JetBrains Mono',monospace;color:var(--brand);margin-bottom:4px}

/* Logframe */
.lf-proj{margin-bottom:16px}
.lf-obj{background:var(--brand-soft);border-radius:10px;padding:13px 15px;font-size:12.5px;
  line-height:1.6;margin-bottom:12px}
.lf-lvl{font:700 10px 'Inter',sans-serif;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-mute);margin:14px 0 7px}
.lf-row{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:9px 0;
  border-bottom:1px solid var(--line-soft);font-size:12.5px;line-height:1.6}
.lf-row:last-child{border-bottom:0}
.lf-row .lf-c{font:600 11px 'JetBrains Mono',monospace;color:var(--ink-mute)}
.lf-row .lf-g{font:700 9.5px 'Inter',sans-serif;letter-spacing:.07em;text-transform:uppercase;
  color:var(--brand);display:block;margin-bottom:2px}
.lf-row.blank{background:var(--bad-soft);border-radius:8px;padding-left:10px;padding-right:10px}
.lf-flag{font-size:11px;color:var(--warn);margin-top:4px;display:flex;gap:5px;align-items:flex-start}

/* Indicators */
.ind-row{display:grid;grid-template-columns:70px 1fr 112px 104px 92px;gap:12px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line-soft)}
.ind-row:last-child{border-bottom:0}
.ind-row .i-t{font-size:12.5px;line-height:1.5}
.ind-row .i-s{font-size:11px;color:var(--ink-mute);margin-top:3px;line-height:1.45}
.ind-v{text-align:right;font:700 16px/1 'Fraunces',serif;font-variant-numeric:tabular-nums}
.ind-v small{display:block;font:400 10.5px 'Inter',sans-serif;color:var(--ink-mute);margin-top:3px}
.ind-row.blocked{background:var(--bad-soft);border-radius:8px;padding-left:11px;padding-right:11px}
.plan-tag{font:700 9px 'Inter',sans-serif;letter-spacing:.08em;text-transform:uppercase;
  border-radius:4px;padding:2px 5px}
.plan-tag.y2024{background:var(--brand-soft);color:var(--brand)}
.plan-tag.pooa5{background:var(--accent-soft);color:var(--accent)}

@media (max-width:1366px){ .toc-flow{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){
  .toc-flow{grid-template-columns:minmax(0,1fr)}
  .ind-row{grid-template-columns:60px 1fr;gap:7px}
  .ind-row .ind-v,.ind-row .i-st{grid-column:2}
  .lf-row{grid-template-columns:minmax(0,1fr)}
}

/* ───────────────────────────────────────────────────────────────────────
   3c. STAGE 4 — reconciliation and mapping
   ─────────────────────────────────────────────────────────────────────── */
.tabs{display:flex;gap:5px;background:var(--bg-muted);padding:4px;border-radius:10px;
  margin-bottom:17px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;cursor:pointer;padding:8px 14px;border-radius:7px;
  font:600 12.5px 'Inter',sans-serif;color:var(--ink-soft)}
.tabs button:hover{background:rgba(0,0,0,.04)}
.tabs button.on{background:var(--bg-card);color:var(--ink);box-shadow:var(--shadow)}
.tabs button .tn{opacity:.6;margin-left:4px}

.rec{background:var(--bg-card);border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:var(--radius);padding:16px 18px;margin-bottom:13px}
.rec.high{border-left-color:var(--bad)}
.rec.medium{border-left-color:var(--warn)}
.rec.low{border-left-color:var(--ink-mute)}
.rec.open{border-left-color:var(--warn);background:var(--warn-soft)}
.rec-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.rec-top h4{font-size:15.5px}
.rec-note{font-size:12px;line-height:1.6;color:var(--ink-soft);margin:7px 0 13px;max-width:64em}
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;
  margin-bottom:13px}
.q{border:1px solid var(--line);border-radius:10px;padding:11px 13px;background:var(--bg);
  position:relative}
.q.chosen{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 0 0 1px var(--ok)}
.q .q-src{font:700 10px 'JetBrains Mono',monospace;color:var(--ink-mute);margin-bottom:5px;
  display:flex;justify-content:space-between;gap:8px;align-items:center}
.q .q-txt{font-size:11.5px;line-height:1.55;color:var(--ink-soft)}
.q .q-val{font:700 19px/1 'Fraunces',serif;margin-top:7px;font-variant-numeric:tabular-nums}
.q.chosen .q-val{color:var(--ok)}
.rec-dec{display:flex;gap:11px;align-items:flex-start;background:var(--bg-muted);
  border-radius:10px;padding:11px 14px;font-size:12px;line-height:1.6;flex-wrap:wrap}
.rec-dec i{color:var(--ok);font-size:14px;margin-top:2px}
.rec-dec .d-main{flex:1;min-width:220px}
.rec-cav{font-size:11.5px;line-height:1.55;color:var(--warn);margin-top:7px;
  display:flex;gap:6px;align-items:flex-start}

.gapc{background:var(--bg-card);border:1px solid var(--line);border-left:3px solid var(--warn);
  border-radius:var(--radius);padding:14px 16px;margin-bottom:11px}
.gapc h4{font-size:14px;margin-bottom:3px}
.gapc .g-where{font:600 10.5px 'JetBrains Mono',monospace;color:var(--ink-mute)}
.gapc .g-detail{font-size:12px;line-height:1.6;color:var(--ink-soft);margin:7px 0 10px}
.gapc .g-q{background:var(--warn-soft);border-radius:9px;padding:10px 13px;font-size:12.5px;
  line-height:1.55}
.gapc .g-q b{display:block;font:700 9.5px 'Inter',sans-serif;letter-spacing:.08em;
  text-transform:uppercase;color:var(--warn);margin-bottom:4px}
.gapc .g-blocks{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}

.maprow{display:grid;grid-template-columns:1fr 46px 1fr;gap:12px;align-items:center;
  padding:12px 0;border-bottom:1px solid var(--line-soft)}
.maprow:last-child{border-bottom:0}
.mapbox{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg-card)}
.mapbox.none{border-style:dashed;background:var(--bg-muted);color:var(--ink-mute)}
.mapbox .m-c{font:700 10.5px 'JetBrains Mono',monospace;color:var(--ink-mute)}
.mapbox .m-t{font-size:12px;line-height:1.5;margin-top:3px}
.maparrow{text-align:center;color:var(--ink-mute);font-size:16px}

@media (max-width:860px){ .maprow{grid-template-columns:minmax(0,1fr)} .maparrow{display:none} }

/* ───────────────────────────────────────────────────────────────────────
   3d. STAGE 5 — countries, schools, enrolment
   ─────────────────────────────────────────────────────────────────────── */
.cty{background:var(--bg-card);border:1px solid var(--line);border-top:3px solid var(--brand);
  border-radius:var(--radius);padding:15px 16px;display:flex;flex-direction:column;gap:10px}
.cty.noschool{border-top-color:var(--warn)}
.cty.cand{border-top-color:var(--ink-mute);background:var(--bg)}
.cty h4{font-size:16px}
.cty .c-sub{font-size:11px;color:var(--ink-mute);line-height:1.5}
.cty .c-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;
  padding:10px 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.cty .c-s{text-align:center}
.cty .c-s b{display:block;font:700 17px/1 'Fraunces',serif;font-variant-numeric:tabular-nums}
.cty .c-s span{font-size:9.5px;color:var(--ink-mute);letter-spacing:.05em;text-transform:uppercase}
.cty .c-q{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:9px 11px;
  font-size:11.5px;line-height:1.5;display:flex;gap:7px;align-items:flex-start}
.cty .c-foot{margin-top:auto;display:flex;gap:7px;flex-wrap:wrap;align-items:center}

.sch-name{font-weight:600}
.sch-name small{display:block;font-weight:400;font-size:10.5px;color:var(--ink-mute);margin-top:2px}
.stage-pill{font:700 9.5px 'Inter',sans-serif;letter-spacing:.06em;text-transform:uppercase;
  border-radius:5px;padding:3px 7px;white-space:nowrap}
.stage-pill.Entry{background:var(--bad-soft);color:var(--bad)}
.stage-pill.Developing{background:var(--warn-soft);color:var(--warn)}
.stage-pill.Intermediate{background:var(--ok-soft);color:var(--ok)}
.stage-pill.Advanced{background:var(--brand-soft);color:var(--brand)}

.dom{display:grid;grid-template-columns:200px 1fr 96px;gap:11px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.dom:last-child{border-bottom:0}
.dom .d-sc{text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--ink-mute)}
.dom .d-sc b{color:var(--ink);font-size:13px}
.twobar{position:relative;height:9px;border-radius:5px;background:var(--bg-muted);overflow:hidden}
.twobar i{position:absolute;inset:0 auto 0 0;height:100%;border-radius:5px}
.twobar i.r1{background:var(--line)}
.twobar i.r2{background:var(--ok)}
.twobar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink-soft);
  text-decoration:none}

.kv{width:100%;border-collapse:collapse;font-size:12.5px}
.kv td{padding:8px 0;border-bottom:1px solid var(--line-soft);vertical-align:top}
.kv td:first-child{color:var(--ink-mute);width:46%}
.kv tr:last-child td{border-bottom:0}

@media (max-width:860px){ .dom{grid-template-columns:minmax(0,1fr)} }

/* ───────────────────────────────────────────────────────────────────────
   3e. STAGE 6 — teachers, leaders, training
   ─────────────────────────────────────────────────────────────────────── */
.funnel{display:flex;gap:9px;flex-wrap:wrap}
.fn{flex:1;min-width:140px;border:1px solid var(--line);border-radius:10px;padding:12px 13px;
  background:var(--bg-card);position:relative}
.fn b{display:block;font:700 23px/1 'Fraunces',serif;font-variant-numeric:tabular-nums}
.fn span{display:block;font-size:11px;color:var(--ink-mute);margin-top:4px;line-height:1.45}
.fn.on{border-color:var(--ok);background:var(--ok-soft)}

.movebar{display:grid;grid-template-columns:150px 1fr 108px;gap:11px;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.movebar:last-child{border-bottom:0}
.movebar .mv{position:relative;height:10px;border-radius:5px;background:var(--bg-muted)}
.movebar .mv i{position:absolute;top:0;bottom:0;border-radius:5px}
.movebar .mv i.a{background:var(--line)}
.movebar .mv i.b{background:var(--ok)}
.movebar .mvn{text-align:right;font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--ink-mute)}
.movebar .mvn b{color:var(--ok);font-size:13px}

.ind4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}
.ind4 .i4{border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;
  background:var(--bg-card)}
.ind4 .i4 b{display:block;font:700 21px/1 'Fraunces',serif}
.ind4 .i4 span{display:block;font-size:11px;color:var(--ink-mute);margin-top:5px;line-height:1.4}

.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.cmp .c{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--bg-card)}
.cmp .c.good{border-color:var(--ok);background:var(--ok-soft)}
.cmp .c h5{font:700 12.5px 'Inter',sans-serif;margin:0 0 9px}
.cmp .c .big{font:700 27px/1 'Fraunces',serif}

@media (max-width:1100px){ .ind4{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){ .movebar{grid-template-columns:minmax(0,1fr)} .cmp{grid-template-columns:minmax(0,1fr)} }

/* ───────────────────────────────────────────────────────────────────────
   3f. STAGE 7 — Fullness of Life, observation, safeguarding
   ─────────────────────────────────────────────────────────────────────── */
.heat{width:100%;border-collapse:separate;border-spacing:2px;font-size:11.5px}
.heat th{font:700 9.5px 'Inter',sans-serif;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink-mute);padding:5px 4px;text-align:center;vertical-align:bottom}
.heat th.sc{text-align:left;padding-left:8px}
.heat td{padding:6px 4px;text-align:center;border-radius:6px;font-variant-numeric:tabular-nums;
  font-weight:600}
.heat td.sc{text-align:left;font-weight:400;background:none;padding-left:8px;white-space:nowrap}
.h1{background:var(--bad-soft);color:var(--bad)}
.h2{background:var(--warn-soft);color:var(--warn)}
.h3{background:var(--ok-soft);color:var(--ok)}
.h4{background:var(--brand-soft);color:var(--brand)}

.rubric{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-top:9px}
.rub{border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:11.5px;
  line-height:1.5;background:var(--bg)}
.rub b{display:block;font:700 10px 'Inter',sans-serif;letter-spacing:.07em;text-transform:uppercase;
  margin-bottom:4px}
.rub.l1 b{color:var(--bad)} .rub.l2 b{color:var(--warn)}
.rub.l3 b{color:var(--ok)}  .rub.l4 b{color:var(--brand)}

.moved{display:flex;gap:9px;align-items:center;padding:9px 0;
  border-bottom:1px solid var(--line-soft);font-size:12.5px}
.moved:last-child{border-bottom:0}
.moved .arrow{color:var(--ink-mute)}

.watch{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:start;padding:12px 0;
  border-bottom:1px solid var(--line-soft)}
.watch:last-child{border-bottom:0}
.watch .w-c{font:700 11px 'JetBrains Mono',monospace;color:var(--brand);
  background:var(--brand-soft);border-radius:7px;padding:5px 0;text-align:center}
.watch .w-t{font-size:12.5px;line-height:1.6}
.watch .w-s{font-size:11.5px;color:var(--ink-mute);line-height:1.5;margin-top:5px}

@media (max-width:1100px){ .rubric{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ───────────────────────────────────────────────────────────────────────
   3g. STAGE 8 — culture, team, funding
   ─────────────────────────────────────────────────────────────────────── */
.val{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:9px}
.val .v{border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:10px;
  padding:12px 13px;background:var(--bg-card);font:600 12.5px/1.4 'Inter',sans-serif}

.prac{display:grid;grid-template-columns:1fr 130px 70px;gap:12px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line-soft)}
.prac:last-child{border-bottom:0}
.prac .p-t{font-size:12.5px;line-height:1.5}
.prac .p-s{font-size:11px;color:var(--ink-mute);margin-top:2px;line-height:1.45}
.prac .p-n{text-align:right;font:700 15px 'Fraunces',serif;font-variant-numeric:tabular-nums}

.staff{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;padding:12px 0;
  border-bottom:1px solid var(--line-soft)}
.staff:last-child{border-bottom:0}
.staff .s-av{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;
  display:grid;place-items:center;font:700 14px 'Inter',sans-serif}
.staff .s-n{font-size:13.5px;font-weight:600}
.staff .s-r{font-size:11.5px;color:var(--ink-mute)}
.staff .s-d{font-size:11.5px;line-height:1.55;color:var(--ink-soft);margin-top:6px}

.moneybar{display:grid;grid-template-columns:130px 1fr 128px;gap:12px;align-items:center;
  padding:11px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.moneybar:last-child{border-bottom:0}
.moneybar .m-n{text-align:right;font-variant-numeric:tabular-nums}
.moneybar .m-n b{font-size:13.5px}

@media (max-width:860px){ .prac,.moneybar{grid-template-columns:minmax(0,1fr)} }

/* ───────────────────────────────────────────────────────────────────────
   3h. STAGE 9 — report centre and the document on screen
   ─────────────────────────────────────────────────────────────────────── */
.rep .r-meta{font-size:11.5px;color:var(--ink-mute);margin-bottom:3px}
.rep .r-src{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:12px;
  min-height:34px}
.rep .r-comp{display:grid;grid-template-columns:1fr 112px;gap:11px;align-items:center;
  margin-bottom:10px}
.rep .r-cn{font-size:11.5px;color:var(--ink-mute);text-align:right}
.rep .r-cn b{font:700 14px 'Fraunces',serif;color:var(--ink)}
.rep .r-blocked,.rep .r-ok{font-size:11.5px;line-height:1.5;border-radius:8px;padding:8px 11px;
  margin-bottom:12px;display:flex;gap:7px}
.rep .r-blocked{background:var(--warn-soft);color:var(--ink)}
.rep .r-blocked i{color:var(--warn);flex-shrink:0;margin-top:1px}
.rep .r-ok{background:var(--ok-soft);color:var(--ink)}
.rep .r-ok i{color:var(--ok);flex-shrink:0;margin-top:1px}
.rep .r-acts{display:flex;gap:8px}
.rep .r-sel{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg-card);font:500 12px 'Inter',sans-serif;color:var(--ink);cursor:pointer}

.r-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
  background:var(--bg-card);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 16px;margin-bottom:16px;position:sticky;top:0;z-index:4}
.r-bar-t{font:600 15px 'Fraunces',serif}
.r-bar-s{font-size:11.5px;color:var(--ink-mute);margin-top:2px}
.r-bar-a{display:flex;gap:7px;flex-wrap:wrap}

/* The document, shown on screen as it will print. Serif, because it is a
   document and not a screen — and the same CSS is written into the export. */
.doc{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:40px 46px 50px;max-width:860px;margin:0 auto;
  font:13px/1.65 Georgia,'Times New Roman',serif;color:#16212a}
.doc h1{font:700 22px/1.3 Georgia,serif;text-align:center;margin:0 0 4px}
.doc .d-sub{text-align:center;color:#55646f;font-size:12px;margin-bottom:22px;
  padding-bottom:14px;border-bottom:2px solid var(--brand)}
.doc h2{font:700 15px/1.4 Georgia,serif;margin:26px 0 8px;padding-bottom:5px;
  border-bottom:1px solid #c9d4dc}
.doc h3{font:700 13px/1.4 Georgia,serif;margin:18px 0 6px;color:var(--brand)}
.doc p{margin:0 0 10px}
.doc table{width:100%;border-collapse:collapse;margin:10px 0 14px;font-size:11.5px}
.doc th,.doc td{border:1px solid #c9d4dc;padding:5px 7px;text-align:left;vertical-align:top}
.doc thead th{background:#eef3f6;font-weight:700}
.doc tfoot th{background:#f7fafb;font-weight:700}
.doc td.n,.doc th.n{text-align:right;font-variant-numeric:tabular-nums}
.doc .d-hdr{margin-bottom:18px}.doc .d-hdr th{width:170px;background:#f7fafb}
.doc .d-kv th{width:220px;background:#f7fafb}
.doc .d-draft{background:#f4f8fa;border-left:3px solid var(--info);padding:10px 13px;
  margin:0 0 12px}
.doc .d-tag{display:block;font:700 8.5px/1 'Inter',sans-serif;letter-spacing:.09em;
  text-transform:uppercase;color:var(--info);margin-bottom:7px}
.doc .d-gap{background:#fdf2f2;border-left:3px solid var(--bad);padding:10px 13px;margin:10px 0;
  font-size:12px;position:relative}
.doc .d-gap b{display:block;color:var(--bad);margin-bottom:3px}
.doc .d-gap .d-q{display:block;margin-top:7px;font-style:italic;color:#6a3030}
.doc .d-gap .d-gid{position:absolute;top:9px;right:11px;
  font:700 9px 'JetBrains Mono',monospace;color:var(--bad);letter-spacing:.06em}
.doc .d-quote{border-left:3px solid var(--accent);padding:2px 0 2px 12px;margin:0 0 9px;
  font-style:italic}
.doc .d-quote span{display:block;font-style:normal;font-size:10.5px;color:var(--ink-mute);
  margin-top:3px}
.doc .d-small{font-size:11.5px;color:#3c5162;margin:8px 0 12px}
.doc .d-src{font-size:10.5px;color:var(--ink-mute);margin:0 0 8px;display:flex;gap:3px}
.doc .d-st{font-weight:700;font-size:10.5px}
.doc .d-st.ok{color:var(--ok)}.doc .d-st.warn{color:var(--warn)}
.doc .d-st.bad{color:var(--bad)}.doc .d-st.grey{color:var(--ink-mute)}
.doc .d-sig{display:flex;gap:40px;margin-top:38px;padding-top:16px;font-size:11.5px}
.doc .d-sig div{flex:1;border-top:1px solid #16212a;padding-top:6px}
.doc .d-sig span{color:var(--ink-mute);font-size:10.5px}
.doc .d-foot{display:flex;justify-content:space-between;gap:14px;margin-top:30px;padding-top:10px;
  border-top:1px solid #c9d4dc;font-size:10px;color:var(--ink-mute)}

@media (max-width:860px){
  .doc{padding:24px 20px 34px}
  .rep .r-comp{grid-template-columns:minmax(0,1fr)}
  .rep .r-cn{text-align:left}
}

/* ───────────────────────────────────────────────────────────────────────
   3i. STAGE 10 — data quality, plan quality, ask
   ─────────────────────────────────────────────────────────────────────── */
/* A cell with nothing in it because nothing was measured — distinct from one
   left blank in a source document, which gets .dq-blank's hatching. */
.na{color:var(--ink-mute);font-style:italic;text-align:center}
.dq-blank{color:var(--ink-mute);font-style:italic;background:repeating-linear-gradient(
  45deg,transparent,transparent 5px,var(--bg-muted) 5px,var(--bg-muted) 10px)}
.dq-reg{display:grid;grid-template-columns:1fr 110px 46px;gap:11px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line-soft)}
.dq-reg:last-child{border-bottom:0}
.dq-reg .dq-rn{font-size:12.5px;font-weight:600}
.dq-reg .dq-rd{font-size:11px;color:var(--ink-mute);margin-top:2px}
.dq-reg .dq-rp{text-align:right;font:700 13px 'Fraunces',serif;font-variant-numeric:tabular-nums}
.dq-mx td.dq-c{font:600 11px 'Inter',sans-serif;text-align:center;cursor:help}
.dq-mx td.dq-c.ok{background:var(--ok-soft);color:var(--ok)}
.dq-mx td.dq-c.warn{background:var(--warn-soft);color:var(--warn)}
.dq-mx td.dq-c.bad{background:var(--bad-soft);color:var(--bad)}
.dq-mx td.dq-c.grey{background:var(--bg-muted);color:var(--ink-mute)}
.dq-w{padding:11px 0;border-bottom:1px solid var(--line-soft)}
.dq-w:last-child{border-bottom:0}
.dq-w .dq-wh{display:flex;gap:8px;align-items:center;margin-bottom:5px}
.dq-w .dq-wh span{font-size:12.5px;font-weight:600}
.dq-w .dq-wn{font-size:12px;line-height:1.6;color:var(--ink-soft)}

.qc-top{display:grid;grid-template-columns:270px 1fr;gap:18px;align-items:start;margin-bottom:18px}
.qc-ring{padding:18px 18px 16px;text-align:center}
.qc-band{font:600 13px 'Fraunces',serif;margin-top:4px}
.qc-band.ok{color:var(--ok)}.qc-band.warn{color:var(--warn)}.qc-band.bad{color:var(--bad)}
.qc-math{font-size:11px;color:var(--ink-mute);line-height:1.55;margin-top:7px}
.qc-split{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--line-soft)}
.qc-split div{text-align:center}
.qc-split b{display:block;font:700 17px 'Fraunces',serif}
.qc-split span{display:block;font-size:10.5px;color:var(--ink-mute);line-height:1.35;margin-top:1px}
.qc-split i{display:block;font-style:normal;font-size:10px;color:var(--ink-mute);margin-top:2px}
.qc-split div:first-child b{color:var(--ok)}
.qc-split div:last-child b{color:var(--bad)}
.qc-sev{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qc-s{border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-align:center}
.qc-s b{display:block;font:700 22px 'Fraunces',serif}
.qc-s span{display:block;font:600 11px 'Inter',sans-serif;margin-top:1px}
.qc-s i{display:block;font-style:normal;font-size:10.5px;color:var(--ink-mute);margin-top:3px}
.qc-s.ok b,.qc-s.ok span{color:var(--ok)}
.qc-s.warn b,.qc-s.warn span{color:var(--warn)}
.qc-s.bad b,.qc-s.bad span{color:var(--bad)}
.qc-s.grey b,.qc-s.grey span{color:var(--ink-mute)}
.qc-sub{font-size:12px;color:var(--ink-mute);line-height:1.6;margin-bottom:13px}

.qf{display:grid;grid-template-columns:1fr 150px;gap:14px;align-items:start;
  border:1px solid var(--line);border-left-width:3px;border-radius:10px;padding:13px 15px;
  margin-bottom:11px;background:var(--bg-card)}
.qf:last-child{margin-bottom:0}
.qf.high{border-left-color:var(--bad)}
.qf.medium{border-left-color:var(--warn)}
.qf.low{border-left-color:var(--ink-mute)}
.qf.done{border-left-color:var(--ok);background:var(--bg-muted)}
.qf-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.qf-loc{font-size:11.5px;color:var(--ink-mute)}
.qf-id{font-size:10.5px;color:var(--ink-mute)}
.qf-i{font-size:13px;line-height:1.55;margin-bottom:8px}
.qf-fix{font-size:12px;line-height:1.6;color:var(--ink-soft);background:var(--bg-muted);
  border-radius:8px;padding:9px 12px}
.qf-fix b{display:block;font:700 9px 'Inter',sans-serif;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-mute);margin-bottom:3px}
.qf-eff{display:flex;gap:6px;font-size:11.5px;color:var(--ink-mute);margin-top:7px}
.qf-act{display:flex;flex-direction:column;gap:7px;align-items:stretch}

/* A report is as finished as its sections. A section counts as complete when
   it has a figure or a narrative behind it, blocked when a gap in the source
   documents stops it being written at all. The percentage is the honest one:
   blocked sections are counted in the denominator, because a reader who opens
   section 7.2 and finds a note instead of a result has not been given it. */
function calcCompleteness(templateId){
  const t = appData.reportTemplates[templateId];
  if (!t) return {pct:0, done:0, blocked:0, total:0, blockedBy:[]};
  const real = t.sections.filter(s => s.block);
  /* A gap someone has answered no longer blocks the section that was holding
     its question. That is the whole point of being able to answer one. */
  const unanswered = s => (s.gaps || [])
    .filter(id => { const g = appData.gaps.find(x => x.id === id); return g && !g.answer; });
  const blocked = real.filter(s => unanswered(s).length);
  const ids = [...new Set(blocked.flatMap(unanswered))];
  return {pct: pct(real.length - blocked.length, real.length),
          done: real.length - blocked.length,
          blocked: blocked.length, total: real.length, blockedBy: ids,
          sections: real.length, headings: t.sections.length - real.length};
}

/* Fullness of Life self-study — two rounds, so movement is visible. Scores
   run 1–4 per domain; a school meets the benchmark at a mean of 3. */
function seedSelfStudy(){
  const rounds = [{id:'R1', label:'Round 1 · Sep 2024', date:'2024-09-20'},
                  {id:'R2', label:'Round 2 · Apr 2025', date:'2025-04-18'}];
  const recs = [];
  appData.schools.forEach(s => {
    /* A starting profile per school, then a modest, uneven improvement. */
    const start = {};
    FOL_DOMAINS.forEach(d => { start[d.key] = 1.3 + Math.round(rand() * 1.6 * 10) / 10; });  // 1.3 – 2.9
    rounds.forEach((r, ri) => {
      const scores = {};
      FOL_DOMAINS.forEach(d => {
        const gain = ri === 0 ? 0 : (0.4 + rand() * 0.95);
        scores[d.key] = Math.min(4, Math.round((start[d.key] + gain) * 10) / 10);
      });
      const mean = Math.round(FOL_DOMAINS.reduce((t,d) => t + scores[d.key], 0)
        / FOL_DOMAINS.length * 100) / 100;
      recs.push({school:s.code, round:r.id, roundLabel:r.label, date:r.date, scores, mean,
                 stage: folStage(mean),
                 priorities: ri === 1 ? folPriorities(scores) : []});
    });
  });
  appData.selfStudy = {rounds, records:recs, domains:FOL_DOMAINS, stages:FOL_STAGES,
                       benchmark:3, benchmarkLabel:'Intermediate'};
}
function folStage(mean){
  return mean >= 3.5 ? 'Advanced' : mean >= 3 ? 'Intermediate' : mean >= 2 ? 'Developing' : 'Entry';
}
function folPriorities(scores){
  return FOL_DOMAINS.slice()
    .sort((a,b) => scores[a.key] - scores[b.key]).slice(0,2)
    .map(d => ({domain:d.key, label:d.label, score:scores[d.key]}));
}

/* Movement between the two self-study rounds, school by school. */
function calcFolMovement(){
  /* Movement needs both rounds. A school with one round, or none, has no
     movement to report — it is left out rather than counted as no change,
     which would be a claim nobody made. */
  return appData.schools.map(s => {
    const a = folFor(s.code,'R1'), b = folFor(s.code,'R2');
    if (!a || !b) return {school:s, assessed:false, from:a ? a.stage : null,
      to:b ? b.stage : null, meanFrom:a ? a.mean : null, meanTo:b ? b.mean : null,
      gain:null, crossed:false, changed:false};
    return {school:s, assessed:true, from:a.stage, to:b.stage,
            meanFrom:a.mean, meanTo:b.mean,
            gain:Math.round((b.mean - a.mean) * 100) / 100,
            crossed: a.mean < appData.selfStudy.benchmark && b.mean >= appData.selfStudy.benchmark,
            changed: a.stage !== b.stage};
  }).filter(m => m.assessed);
}

   prioritised plan per school; this is what they add up to. */
function calcFolPriorities(){
  const by = {};
  appData.selfStudy.domains.forEach(d => by[d.key] = 0);
  appData.selfStudy.records.filter(r => r.round === 'R2')

         usually also distributes, so capability is drawn once and the

         product of four coin flips and reads implausibly low. */
      const capable = rand() < (i === 0 ? 0.64 : 0.52);
      const applied = {};
      LEAD_INDICATORS.forEach(l => { applied[l.key] = rand() < (capable ? 0.89 : 0.22); });

   5. CALCULATORS
   ═══════════════════════════════════════════════════════════════════════════ */
const SCOPE = () => currentUser.country === 'All' ? null : currentUser.country;

function calcSchools(country){
  const list = appData.schools.filter(s => !country || s.country === country);
  const by = {Primary:0, Secondary:0};
  list.forEach(s => by[s.level]++);
  return {list, total:list.length, primary:by.Primary, secondary:by.Secondary};
}

function calcStudents(country){
  const list = appData.schools.filter(s => !country || s.country === country);
  const m = list.reduce((t,s) => t + s.enrolledM, 0);
  const f = list.reduce((t,s) => t + s.enrolledF, 0);
  const cap = list.reduce((t,s) => t + s.capacity, 0);
  const wmean = key => {
    const rel = list.filter(s => s[key] !== null && s[key] !== undefined);
    const pop = rel.reduce((t,s) => t + s.enrolledM + s.enrolledF, 0);
    if (!pop) return null;
    return Math.round(rel.reduce((t,s) => t + s[key] * (s.enrolledM + s.enrolledF), 0) / pop * 10) / 10;
  };
  return {male:m, female:f, total:m + f, capacity:cap,
          femaleShare: pct(f, m + f),
          attendance: wmean('attendance'), retention: wmean('retention'),
          transition: wmean('transition'), graduation: wmean('graduation'),
          university: list.reduce((t,s) => t + (s.university || 0), 0),
          byCountry: appData.countries.map(c => {
            const sc = appData.schools.filter(s => s.country === c.name);
            return {country:c.name, cc:c.code, schools:sc.length,
                    male:sc.reduce((t,s) => t + s.enrolledM, 0),
                    female:sc.reduce((t,s) => t + s.enrolledF, 0)};
          })};
}

function calcFoL(round){
  const r = round || 'R2';
  const recs = appData.selfStudy.records.filter(x => x.round === r);
  const byStage = {};
  FOL_STAGES.forEach(s => byStage[s] = 0);
  recs.forEach(x => byStage[x.stage]++);
  const atBenchmark = recs.filter(x => x.mean >= appData.selfStudy.benchmark).length;
  const domainMean = {};
  FOL_DOMAINS.forEach(d => {
    domainMean[d.key] = Math.round(recs.reduce((t,x) => t + x.scores[d.key], 0) / recs.length * 100) / 100;
  });
  return {round:r, records:recs, byStage, atBenchmark,
          benchmarkPct: pct(atBenchmark, recs.length),
          mean: Math.round(recs.reduce((t,x) => t + x.mean, 0) / recs.length * 100) / 100,
          domainMean};
}

function calcObservation(){
  const t = appData.teachers;
  const before = Math.round(t.reduce((x,y) => x + y.meanBefore, 0) / t.length * 100) / 100;
  const after  = Math.round(t.reduce((x,y) => x + y.meanAfter,  0) / t.length * 100) / 100;
  const dm = {};
  OBS_DOMAINS.forEach(d => {
    dm[d.key] = {
      before: Math.round(t.reduce((x,y) => x + y.obsBefore[d.key], 0) / t.length * 100) / 100,
      after:  Math.round(t.reduce((x,y) => x + y.obsAfter[d.key],  0) / t.length * 100) / 100};
  });
  return {total:t.length, trained:t.filter(x => x.trained).length,
          before, after,
          /* OC1 asks for the percentage increase in quality, so that is what
             is reported — not the raw score, which the outcome never mentions. */
          increase: Math.round((after - before) / before * 1000) / 10,
          /* "Consistently applying" is taken as a mean of 3 or more. */
          consistent: t.filter(x => x.meanAfter >= 3).length,
          consistentPct: pct(t.filter(x => x.meanAfter >= 3).length, t.length),
          domains:dm};
}

/* Did the training change anything? Compare those who had it with those who
   did not, over the same instrument and the same two rounds. */
function calcTrainingEffect(){
  const g = tr => {
    const set = appData.teachers.filter(t => t.trained === tr);
    if (!set.length) return null;
    const b = Math.round(set.reduce((x,y) => x + y.meanBefore, 0) / set.length * 100) / 100;
    const a = Math.round(set.reduce((x,y) => x + y.meanAfter,  0) / set.length * 100) / 100;
    return {n:set.length, before:b, after:a, gain:Math.round((a - b) * 100) / 100,
            increase:Math.round((a - b) / b * 1000) / 10,
            consistent:set.filter(t => t.meanAfter >= 3).length};
  };
  const t = g(true), u = g(false);
  return {trained:t, untrained:u,
          difference: t && u ? Math.round((t.gain - u.gain) * 100) / 100 : null};
}

function calcLeaders(){
  const l = appData.leaders;
  const byInd = {};
  LEAD_INDICATORS.forEach(x => byInd[x.key] = l.filter(y => y.applied[x.key]).length);
  return {total:l.length, trained:l.filter(x => x.trained).length,
          consistent:l.filter(x => x.consistent).length,
          consistentPct: pct(l.filter(x => x.consistent).length, l.length),
          byIndicator:byInd, indicators:LEAD_INDICATORS};
}

function calcTraining(country){
  const list = appData.stakeholders.filter(s => !country || s.country === country);
  const by = k => { const o = {}; list.forEach(s => o[s[k]] = (o[s[k]] || 0) + 1); return o; };
  const inTraining = list.filter(s => s.status === 'Ongoing' || s.status === 'Completed').length;
  return {list, total:list.length, inTraining,
          byType:by('type'), byStatus:by('status'), byCountry:by('country'), bySex:by('sex'),
          certificates:list.filter(s => s.certificate).length,
          mentored:list.filter(s => s.mentored).length};
}

function calcCulture(){
  const s = appData.culture.staff, n = s.length;
  const c = k => s.filter(x => x[k]).length;
  return {staff:n,

          pctAll: pct(s.filter(x => x.trainedCulture && x.ruleOfLife && x.ecoAppDaily).length, n),
          activities:appData.culture.activities};

function calcFinance(){
  const f = appData.finance;
  const rows = appData.countries.map(c => {
    const p = f.perCountry[c.code];
    return {country:c.name, cc:c.code, raised:p.raised, target:p.target,

/* Everything one country holds, summed from the registers. */
function calcCountry(cc){
  const c = appData.countries.find(x => x.cc === cc || x.code === cc);
  if (!c) return null;
  const schools = appData.schools.filter(s => s.cc === c.code);

  const teach = appData.teachers.filter(t => t.cc === c.code);
  const lead  = appData.leaders.filter(l => l.cc === c.code);
  const stake = appData.stakeholders.filter(s => s.cc === c.code);
  const fol = appData.selfStudy.records.filter(r => r.round === 'R2' &&
    schools.some(s => s.code === r.school));
  const money = appData.finance.perCountry[c.code] || {raised:0, target:0};
  return {country:c, schools, students:st, teachers:teach, leaders:lead, stakeholders:stake,
          teachersTrained:teach.filter(t => t.trained).length,
          leadersConsistent:lead.filter(l => l.consistent).length,
          inTraining:stake.filter(s => s.status !== 'Enrolled').length,
          fol, folAtBenchmark:fol.filter(r => r.mean >= appData.selfStudy.benchmark).length,
          folMean: fol.length ? Math.round(fol.reduce((t,r) => t + r.mean, 0) / fol.length * 100) / 100 : null,
          money, moneyPct: pct(money.raised, money.target)};
}
const folFor = (code, round) => appData.selfStudy.records
  .find(r => r.school === code && r.round === (round || 'R2'));

/* A school added to the register has no self-study until somebody runs one.
   folFor() returns nothing for it, and that is correct — inventing a record of
   zeros would make an unassessed school look like the worst one in the
   network. Every consumer therefore has to handle "not assessed", and says
   those words rather than showing a gap in a table. */
const folAssessed = code => !!folFor(code, 'R2');
const NOT_ASSESSED = 'Not assessed';

/* Progress against the resolved target — and against the figures that were
   not chosen, because that comparison is the whole point of the decision. */
function calcTargetProgress(key, actual){
  const t = appData.targets[key];
  const out = {key, actual, target:t.value, source:t.source,
               pct: pct(actual, t.value), met: actual >= t.value, alternatives:[]};
  (t.over || []).forEach(v => {
    if (typeof v === 'number') out.alternatives.push({value:v, pct:pct(actual, v), met:actual >= v});
  });
  return out;
}

function calcIndicator(code){
  const i = appData.indicators.find(x => x.code === code);
  if (!i) return null;
  let value = null, note = '';
  switch (i.computed){
    case 'attendance':            value = calcStudents().attendance; note = 'Enrolment-weighted across all partner schools'; break;
    case 'students':              value = calcStudents().total;      note = 'Summed from school enrolment'; break;
    case 'schools':               value = calcSchools().total;       note = 'The partner school register'; break;
    case 'teachersTrained':       { const o = calcObservation(); value = pct(o.trained, o.total);
                                    note = `${o.trained} of ${o.total} teachers`; break; }
    case 'stakeholdersInTraining':{ const t = calcTraining(); value = t.inTraining;
                                    note = 'Enrolled and ongoing or completed'; break; }
    case 'stakeholderCertified':  { const t = calcTraining(); value = pct(t.certificates, t.total);
                                    note = `${t.certificates} of ${t.total} certificated`; break; }
    case 'cultureAll':            value = calcCulture().pctAll; note = 'Culture training, rule of life and daily ECO App use together'; break;
    case 'obsIncrease':           { const o = calcObservation();
                                    value = o.increase; note = `Mean practice score ${o.before} to ${o.after}`; break; }
    case 'leadersConsistent':     { const l = calcLeaders(); value = l.consistentPct;
                                    note = `${l.consistent} of ${l.total} applying all four indicators`; break; }
    case 'folBenchmark':          { const f = calcFoL(); value = f.benchmarkPct;
                                    note = `${f.atBenchmark} of ${f.records.length} schools at Intermediate or above`; break; }
  }
  const target = indicatorTarget(i);
  const blocked = !i.computed;
  const status = blocked ? {key:'blocked', label:'Cannot be computed', tone:'bad'}
    : target === null ? {key:'nottarget', label:'No target set', tone:'grey'}
    : value >= target ? {key:'met', label:'Met', tone:'ok'}
    : value >= target * 0.85 ? {key:'near', label:'Close', tone:'warn'}
    : {key:'behind', label:'Behind', tone:'bad'};
  return {indicator:i, target, value, note, blocked, status,
          pct: target ? pct(value, target) : null};
}
const calcAllIndicators = () => appData.indicators.map(i => calcIndicator(i.code)).filter(Boolean);

   count:() => num(calcFoL().records.length) + ' schools × ' +

/* The score is deliberately plain: the mean of every verdict, as a percentage
   of the best it could be. It is not weighted, because weighting one measure
   over another is a judgement nobody has made yet. */
function calcDataQuality(){
  const cells = [];
  appData.registers.forEach(r => appData.dqMeasures.forEach(m => {
    let level = r[m.key].level, note = r[m.key].note, moved = false;
    /* Integrity is the one verdict this system can earn rather than assert.
       The seeded figures have no author and no timestamp; anything recorded
       through a form does, so the verdict moves for that register once the log
       has an entry in it — and says what it is based on. */
    if (m.key === 'integrity'){
      const n = entriesFor(r.key).length;
      if (n){
        moved = true;
        level = level === 'weak' ? 'partial' : level === 'partial' ? 'strong' : level;
        note = `${n} change${n === 1 ? '' : 's'} to this register ${
          n === 1 ? 'has' : 'have'} been recorded through a form, with the name of whoever made `
          + `${n === 1 ? 'it' : 'them'} and the time. The figures that arrived with the seed `
          + `still have neither — so this is partly earned, not fixed.`;
      }
    }
    cells.push({register:r, measure:m, level, note, moved,
                score: DQ_LEVELS[level].score});
  }));
  const byLevel = {};
  Object.keys(DQ_LEVELS).forEach(k => byLevel[k] = cells.filter(c => c.level === k).length);
  const total = cells.reduce((t,c) => t + c.score, 0);
  const best  = cells.length * DQ_LEVELS.strong.score;

  const byMeasure = appData.dqMeasures.map(m => {
    const own = cells.filter(c => c.measure.key === m.key);
    return {measure:m, pct: pct(own.reduce((t,c) => t + c.score, 0),
      own.length * DQ_LEVELS.strong.score),
      weak: own.filter(c => /weak|absent/.test(c.level)).length};
  }).sort((a,b) => a.pct - b.pct);

  const byRegister = appData.registers.map(r => {
    const own = cells.filter(c => c.register.key === r.key);
    return {register:r, pct: pct(own.reduce((t,c) => t + c.score, 0),
      own.length * DQ_LEVELS.strong.score),
      weak: own.filter(c => /weak|absent/.test(c.level)).length};
  }).sort((a,b) => a.pct - b.pct);

  return {cells, byLevel, pct: pct(total, best), total, best,
          byMeasure, byRegister,
          weakestMeasure: byMeasure[0], weakestRegister: byRegister[0],
          /* Which indicators have nothing behind them at all. */
          unbacked: calcAllIndicators().filter(r => r.blocked).map(r => r.indicator.code)};
}

/* ── The plan's own quality. Every finding is derived from the reconciliation
      and the gap register, so adding a gap adds a finding and nothing has to
      be kept in step by hand. Severity comes from the source item; it is not
      re-decided here. ── */
const SEV = {high:{label:'High', tone:'bad', weight:12},
             medium:{label:'Medium', tone:'warn', weight:6},
             low:{label:'Low', tone:'grey', weight:2}};

function calcPlanFindings(){
  const out = [];

  /* B row 9 appears in both registers: as reconciliation item R9 and as gap
     G11. It is one fact — an outcome numbered "4" with nothing beside it — and
     counting it twice would inflate every total on this screen and put a
     "Decide" button on something nobody can decide. The gap register wins,
     because a blank is what it actually is. */
  const gapPlaces = appData.gaps.map(g => g.where);
  const dup = r => r.quotes.every(q => gapPlaces.includes(q.src));

  appData.reconciliation.filter(r => !dup(r)).forEach(r => {
    const values = r.quotes.map(q => q.value).filter(v => v !== undefined);
    const resolved = !!r.decision;
    out.push({
      id:r.id, kind:'conflict', severity:r.severity,
      location: r.quotes.map(q => q.src).join(' vs '),
      issue: r.kind === 'number'
        ? `${r.quotes.length} source documents state a different figure for ${
            r.topic.toLowerCase()}${values.length ? ' — ' + values.map(v => num(v)).join(', ') : ''}.`
        : r.kind === 'date'
        ? `The project year ends on two different days depending on which document is open.`
        : r.kind === 'kind'
        ? `${r.topic} differs in kind, not in size, so no rule about figures can settle it.`
        : r.note,
      fix: resolved
        ? `In force: ${String(r.decision.value)} from ${r.decision.source}, decided by ${
            r.decision.by} on ${fmtDate(r.decision.on)}.`
        : r.kind === 'gap'
        ? 'Nothing is missing from the decision — something is missing from the document. '
          + 'Only B2THEWORLD can supply it.'
        : 'No decision has been recorded. The system will not choose one.',
      /* A single-source gap is not a difference to rule on, so it never sits in
         the "no decision recorded" column waiting for someone to choose. */
      state: resolved ? 'decided' : r.kind === 'gap' ? 'needs-client' : 'open',
      route: r.kind === 'gap' && !resolved ? null : 'reconcile',
      routeLabel: r.kind === 'gap' && !resolved
        ? 'Only B2THEWORLD can answer this' : 'Open the reconciliation'
    });
  });

  appData.gaps.forEach(g => {
    /* A blank that holds up more than one document is worse than one that
       holds up a single section. That is the only judgement made here. */
    const sev = g.blocks.length > 1 ? 'high' : /7\.[12]|6\.3/.test(g.where) ? 'high' : 'medium';
    out.push({
      id:g.id, kind:'blank', severity:sev,
      location:g.where,
      issue:`${g.what} — ${g.detail}`,
      fix: g.answer
        ? `Answered by ${g.answer.by} on ${g.answer.on}: “${g.answer.text}”`
        : g.question,
      /* Answered counts as satisfied, and the score moves. A blank nobody has
         answered still routes nowhere, because nothing inside this system can
         close it. */
      state: g.answer ? 'decided' : 'needs-client',
      route: g.answer ? null : null,
      blocks:g.blocks,
      answered: !!g.answer,
      routeLabel: g.answer ? 'Answered — open it to change the answer'
                           : 'Only B2THEWORLD can answer this'
    });
  });

  return out;
}

/* A score out of 100, built as the share of what a plan needs that this plan
   has — not as a hundred with penalties subtracted. Deducting a fixed penalty
   per finding put this plan at 4 out of 100, which is a floor artifact rather
   than a signal: it reads the same whether one blank is filled or ten are, and
   gives nobody a reason to fill the first one.

   So: every finding is a requirement, weighted by its severity. A recorded
   decision satisfies its requirement; a blank does not. The two halves are
   also reported on their own, because that is the actual story here — the
   contradictions have been settled and the blanks have not. */
function calcPlanScore(){
  const f = calcPlanFindings();
  const w = x => SEV[x.severity].weight;
  const met   = f.filter(x => x.state === 'decided');
  const total = f.reduce((t,x) => t + w(x), 0);
  /* A whole number: this is an index out of 100, and a tenth of a point on it
     would imply a precision the weights do not have. Rounded once from the
     ratio, not from pct()'s one decimal place — rounding twice turned 45.45
     into 46 by way of 45.5. */
  const score = total ? Math.round(met.reduce((t,x) => t + w(x), 0) / total * 100) : 0;

  const conf  = f.filter(x => x.kind === 'conflict');
  const blank = f.filter(x => x.kind === 'blank');
  const outstanding = f.filter(x => x.state !== 'decided');

  return {findings:f, score, weightTotal:total,
          weightMet: met.reduce((t,x) => t + w(x), 0),
          decided:met.length,
          open:f.filter(x => x.state === 'open').length,
          needsClient:f.filter(x => x.state === 'needs-client').length,
          /* The two halves, each as its own percentage. */
          conflictsPct: pct(conf.filter(x => x.state === 'decided')
                              .reduce((t,x) => t + w(x), 0),
                            conf.reduce((t,x) => t + w(x), 0)),
          conflictsSettled: conf.filter(x => x.state === 'decided').length,
          conflictsTotal: conf.length,
          blanksPct: pct(blank.filter(x => x.state === 'decided')
                           .reduce((t,x) => t + w(x), 0),
                         blank.reduce((t,x) => t + w(x), 0)),
          blanksTotal: blank.length,
          blanksAnswered: blank.filter(x => x.state === 'decided').length,
          high:outstanding.filter(x => x.severity === 'high').length,
          medium:outstanding.filter(x => x.severity === 'medium').length,
          low:outstanding.filter(x => x.severity === 'low').length,
          /* The middle band names the shape of the problem rather than a
             grade — and the shape changes as blanks get answered, so the label
             is computed from the two halves instead of asserted once. */
          band: (() => {
            const cp = pct(conf.filter(x => x.state === 'decided').reduce((t,x) => t + w(x), 0),
                           conf.reduce((t,x) => t + w(x), 0));
            const bp = pct(blank.filter(x => x.state === 'decided').reduce((t,x) => t + w(x), 0),
                           blank.reduce((t,x) => t + w(x), 0));
            if (score >= 85) return {label:'Sound', tone:'ok'};
            if (score >= 60) return {label:'Usable, with known holes', tone:'warn'};
            if (score >= 35) return {
              label: cp >= 80 && bp < 40
                ? 'Half-settled \u2014 the differences are decided, the blanks mostly are not'
                : bp >= 80 && cp < 40
                ? 'Half-settled \u2014 the blanks are being filled, the differences are not decided'
                : 'Half-settled \u2014 work has started on both halves',
              tone:'warn'};
            return {label:'Not yet a plan you can report against', tone:'bad'};
          })()};
}

/* ═══════════════════════════════════════════════════════════════════════════
   4b. HELPERS
