}

/* ═══════════════════════════════════════════════════════════════════════════
   6x. PLAN QUALITY CHECK — the plan itself, scored
   ═══════════════════════════════════════════════════════════════════════════ */
function renderQualityCheck(){
  const Q = calcPlanScore();
  const r = 52, circ = Math.PI * r;
  const arc = Math.max(0, Math.min(1, Q.score / 100)) * circ;
  const groups = [
    {key:'open',         title:'Differences with no decision recorded',
     sub:'The system will not choose. Someone has to.',
     list:Q.findings.filter(f => f.state === 'open')},
    {key:'needs-client', title:'Blanks only B2THEWORLD can fill',
     sub:'Each is a sentence or a table that exists somewhere in the organisation and is not yet '
       + 'in the plan. Answer one and every report section holding its question prints the '
       + 'answer instead. B row 9 appears in both registers and is counted once, as a blank.',
     list:Q.findings.filter(f => f.state === 'needs-client')},
    {key:'answered',     title:'Blanks that have been answered',
     sub:'Supplied by a person, recorded against a name and a date, and printed in the reports '
       + 'that were holding the question.',
     list:Q.findings.filter(f => f.kind === 'blank' && f.answered)},
    {key:'decided',      title:'Differences with a decision on the record',
     sub:'Settled, dated and attributed — and reversible on one screen.',
     list:Q.findings.filter(f => f.state === 'decided' && f.kind === 'conflict')}
  ];

  return `<div class="sec-title">Plan Quality Check</div>
    <div class="sec-sub">Not a check of the data — a check of the plan the data is reported
      against. Every finding below is read from the reconciliation and the gap register, so this
      screen cannot fall out of step with them.</div>

    <div class="qc-top">
      <div class="card qc-ring">
        <svg viewBox="0 0 130 78" width="100%" height="88">
          <path d="M 13 70 A ${r} ${r} 0 0 1 117 70" fill="none" stroke="var(--line)"
            stroke-width="11" stroke-linecap="round"/>
          <path d="M 13 70 A ${r} ${r} 0 0 1 117 70" fill="none" stroke="var(--${Q.band.tone})"
            stroke-width="11" stroke-linecap="round"
            stroke-dasharray="${arc} ${circ}"/>
          <text x="65" y="58" text-anchor="middle"
            style="font:700 28px 'Fraunces',serif;fill:var(--ink)">${Q.score}</text>
          <text x="65" y="72" text-anchor="middle"
            style="font:600 9px 'Inter',sans-serif;fill:var(--ink-mute);
            letter-spacing:.09em">OUT OF 100</text>
        </svg>
        <div class="qc-band ${Q.band.tone}">${esc(Q.band.label)}</div>
        <div class="qc-math">${Q.findings.length} things a plan needs, weighted by severity ·
          ${Q.decided} satisfied · ${Q.open + Q.needsClient} not</div>
        <div class="qc-split">
          <div><b>${Q.conflictsPct}%</b><span>differences settled</span>
            <i>${Q.conflictsSettled} of ${Q.conflictsTotal}</i></div>
          <div><b>${Q.blanksPct}%</b><span>blanks filled</span>
            <i>${Q.blanksAnswered} of ${Q.blanksTotal}</i></div>
        </div>
      </div>
      <div class="card"><div class="card-head"><h3>How the score is built</h3>
        ${chip('weighted by severity','grey')}</div>
        <div class="card-body">
          <div class="qc-sev">
            ${[['high',Q.high],['medium',Q.medium],['low',Q.low]].map(([k,n]) => `
              <div class="qc-s ${SEV[k].tone}">
                <b>${n}</b><span>${esc(SEV[k].label)}</span>
                <i>${SEV[k].weight} points each</i></div>`).join('')}
          </div>
          <p style="margin:13px 0 0;font-size:12.5px;line-height:1.65;color:var(--ink-soft)">
            The score is the share of what a plan needs that this plan has, weighted by severity —
            not a hundred with penalties taken off it. Penalising each finding put this plan at
            4 out of 100, which reads the same whether one blank is filled or ten are, and so
            gives nobody a reason to fill the first one.</p>
          <p style="margin:9px 0 0;font-size:12.5px;line-height:1.65;color:var(--ink-soft)">
            A recorded decision satisfies its requirement, because a plan with a dated, attributed
            choice in it is as settled as a plan can be — even when the choice was hard. That is
            why the differences score ${Q.conflictsPct}% and the blanks score ${Q.blanksPct}%.
            ${Q.needsClient
              ? `${Q.needsClient} of the ${Q.open + Q.needsClient} outstanding findings are
                 blanks. No amount of work inside this system will close one — but someone from
                 B2THEWORLD can answer it on this screen, and the section of every report that
                 has been printing the question then prints the answer instead.`
              : `Every blank now carries an answer, recorded against a name and a date.`}</p>
        </div></div>
    </div>

    <div class="banner warn"><i class="bi bi-hand-index-thumb-fill"></i>
      <div><strong>This screen has no "fix it" button, and that is deliberate.</strong>
        The source material says plainly: do not invent values for blanks or resolve differing
        targets without approval. So the system shows you the difference, quotes both documents,
        and records what you decide against your name and the date. It does not choose, and it
        does not fill a blank with something plausible.</div></div>

    ${groups.filter(g => g.list.length).map(g => `
      <div class="card" style="margin-bottom:18px">
        <div class="card-head"><h3>${esc(g.title)}</h3>
          ${chip(g.list.length + '', g.key === 'decided' ? 'ok' : 'warn')}</div>
        <div class="card-body">
          <div class="qc-sub">${esc(g.sub)}</div>
          ${g.list.map(f => `<div class="qf ${f.state === 'decided' ? 'done' : f.severity}">
            <div>
              <div class="qf-top">
                ${chip(SEV[f.severity].label, f.state === 'decided' ? 'ok' : SEV[f.severity].tone)}
                <span class="qf-loc">${esc(f.location)}</span>
                <span class="mono qf-id">${esc(f.id)}</span>
                ${f.kind === 'blank' ? chip('blank','grey','bi-dash-square')
                  : chip('conflict','grey','bi-sliders2')}
              </div>
              <div class="qf-i">${esc(f.issue)}</div>
              <div class="qf-fix"><b>${f.state === 'decided' ? 'In force'
                : f.kind === 'blank' ? 'What would close it' : 'What is needed'}</b>${esc(f.fix)}</div>
              ${f.blocks ? `<div class="qf-eff"><i class="bi bi-file-earmark-text"></i>
                Holds up ${f.blocks.map(b => esc(b)).join(', ')}</div>` : ''}
            </div>
            <div class="qf-act">
              ${f.route
                ? `<button class="btn btn-sm ${f.state === 'decided' ? 'btn-ghost' : 'btn-primary'}"
                    data-action="go" data-view="${esc(f.route)}">
                    ${f.state === 'decided' ? 'Review' : 'Decide'}</button>`
                : f.kind === 'blank'
                ? `${entryBtn('gap', f.id, f.answered ? 'Change the answer' : 'Answer it',
                     {primary: !f.answered, icon: f.answered ? 'bi-pencil' : 'bi-pencil-square'})}
                   ${f.answered ? '' : `<div class="qf-noroute">${esc(f.routeLabel)}</div>`}`
                : `<div class="qf-noroute">${esc(f.routeLabel)}</div>`}
            </div></div>`).join('')}
        </div></div>`).join('')}

    <div class="card">
      <div class="card-head"><h3>What a sound plan would have that this one does not</h3></div>
      <div class="card-body">
        <div class="tbl-scroll"><table class="dt">
          <thead><tr><th>What</th><th>Where it would live</th><th>Held?</th></tr></thead>
          <tbody>
            ${[
              ['One figure per target', 'The logframe', false,
               appData.reconciliation.filter(x => x.kind === 'number').length +
               ' targets were stated more than once'],
              ['A baseline per indicator', 'A §6.3', false,
               'Two of ' + calcAllIndicators().length + ' have a prior round; the rest have none'],
              ['An operational definition per indicator', 'A §6.3', false, 'The section is empty'],
              ['A cost per indicator', 'A §6.3', false, 'The column is empty, and no logframe carries a budget line'],
              ['Named owners for the M&E work', 'A §4', false,
               'Reconstructed from A §5.2, which names who reports — not who is accountable'],
              ['A means of verification per row', 'The logframe', 'partial',
               'Projects 1 and 2 carry them on nearly every row; Project 3 does not'],
              ['A data quality plan', 'A §7.1', false, 'All fifteen measures blank'],
              ['Targets against the adopted theory of change', 'POOA v5', false,
               'POOA v5 carries no targets, so the 2024 logframe supplies them'],
              ['A decision on record where documents disagree', 'Anywhere', true,
               calcPlanScore().decided + ' of ' + appData.reconciliation.length + ' recorded, dated and attributed']
            ].map(([what, where, held, note]) => `<tr>
              <td><strong>${esc(what)}</strong>
                <div style="font-size:11px;color:var(--ink-mute)">${esc(note)}</div></td>
              <td>${esc(where)}</td>
              <td>${held === true ? chip('yes','ok','bi-check-lg')
                : held === 'partial' ? chip('partly','warn')
                : chip('no','bad','bi-x-lg')}</td>
            </tr>`).join('')}
          </tbody></table></div>
      </div></div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   6y. ASK EVAL360 — computed answers
   There is no model behind this. Every answer is assembled from the registers
   by a function, which is why each one can show its working and why none of
   them can invent a figure. It receives counts and never records: no answer
   can name a child, because no child's name exists anywhere in the system.
   ═══════════════════════════════════════════════════════════════════════════ */
let askLog = [];
const ASK_CHIPS = [
  'How are we doing against the targets?',
  'What is behind?',
  'Which figures do the documents disagree about?',
  'What is missing from the plan?',
  'Did the teacher training work?',
  'How are the schools doing on the self-study?',
  'How much have we raised?',
  'Tell me about Pakistan',
  'Can I trust these numbers?',
  'What is due now?'
];

/* Each answer returns {html, sources:[]} so the working is always attached. */
function askAnswer(raw){
  const q = String(raw || '').toLowerCase();
  const S = calcStudents(), SC = calcSchools(), O = calcObservation(), L = calcLeaders(),
        TR = calcTraining(), CU = calcCulture(), FI = calcFinance(),
        F1 = calcFoL('R1'), F2 = calcFoL('R2'), RES = appData.config.resolution;
  const A = (html, sources) => ({html, sources:sources || []});
  const ul = items => `<ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>`;

  /* A country by name, before the generic matchers, so "Pakistan" wins over
     "schools" when both appear. */
  const country = appData.countries.find(c => q.includes(c.name.toLowerCase()));
  if (country){
    const k = calcCountry(country.code);
    return A(`<p><b>${esc(country.name)}</b> has been a partner country since
      ${esc(country.joined)}, with ${num(k.schools.length)} partner
      school${k.schools.length === 1 ? '' : 's'} and ${num(k.students.total)} children enrolled.</p>
      ${ul([
        `${num(k.teachers.length)} teachers, ${num(k.teachersTrained)} trained in Why/Play/Lead`,
        `${num(k.leaders.length)} school leaders, ${num(k.leadersConsistent)} applying all four OC2 indicators`,
        `${num(k.stakeholders.length)} stakeholders enrolled, ${num(k.inTraining)} in training`,
        k.fol.length
          ? `${num(k.folAtBenchmark)} of ${num(k.fol.length)} schools at the Intermediate benchmark, mean ${k.folMean}`
          : 'No self-study, because no school is registered here',
        `${usd(k.money.raised)} raised of the ${usd(k.money.target)} envelope (${k.moneyPct}%)`
      ])}
      ${!k.country.coordinator ? `<p class="ask-flag">No coordinator is named for
        ${esc(country.name)} in any source document — and A §5.2 makes the country coordinator the
        person who reports most of these figures.</p>` : ''}
      ${k.country.openQuestion ? `<p class="ask-flag">${esc(k.country.openQuestion)}</p>` : ''}`,
      ['The country, school, teacher, leader, training and finance registers',
       'Context and status from A §2.3 and B rows 1 and 32']);
  }

  if (/how are we doing|overall|progress|summar|against the target/.test(q)){
    const rows = [['students','Children served',S.total],['schools','Partner schools',SC.total],
      ['stakeholders','Stakeholders in training',TR.inTraining],
      ['countries','Partner countries',appData.countries.length]]
      .map(([k,label,actual]) => {
        const p = calcTargetProgress(k, actual);
        return `${esc(label)}: <b>${num(actual)}</b> of ${num(appData.targets[k].value)} —
          <b class="${p.met ? 'ask-ok' : 'ask-warn'}">${p.pct}%</b>`;
      });
    return A(`<p>Against the four headline targets:</p>${ul(rows)}
      <p>Two are met. The two that are not — children and stakeholders — are measured against the
      highest figure any document stated, adopted on ${fmtDate(RES.decidedOn)}. Against the lower
      figures in the other documents they would read
      ${pct(S.total, Math.max(...appData.targets.students.over))}% and
      ${pct(TR.inTraining, Math.max(...appData.targets.stakeholders.over))}%. Same delivery,
      different ruler.</p>`,
      ['The school, enrolment and training registers',
       `Targets as resolved on ${fmtDate(RES.decidedOn)} by ${RES.decidedBy}`]);
  }

  if (/behind|off track|lagging|worst|not met|failing/.test(q)){
    const all = calcAllIndicators();
    const beh = all.filter(x => x.status.key === 'behind');
    const blocked = all.filter(x => x.blocked);
    return A(`<p>${beh.length} indicator${beh.length === 1 ? ' is' : 's are'} behind:</p>
      ${ul(beh.map(x => `<b>${esc(x.indicator.code)}</b> — ${esc(x.indicator.text)}
        <br>${num(x.value)}${x.indicator.unit === 'percent' ? '%' : ''} against a target of
        ${num(x.target)}${x.indicator.unit === 'percent' ? '%' : ''} (${x.pct}%)`))}
      <p>A different problem sits beside it: ${blocked.length} indicators cannot be computed from
      anything this system holds — ${blocked.map(x => esc(x.indicator.code)).join(' and ')}. They
      report nothing rather than zero, which is not the same thing as being behind.</p>`,
      ['The indicator register, both plan generations',
       'Status thresholds: met at target, close within 15%, behind below that']);
  }

  if (/disagree|conflict|differ|which figure|contradict|reconcil/.test(q)){
    const num5 = appData.reconciliation.filter(r => r.kind === 'number');
    return A(`<p>Nine places, across three documents. The five that are figures:</p>
      ${ul(num5.map(r => {
        const vals = r.quotes.map(x => x.value).filter(v => v !== undefined);
        return `<b>${esc(r.topic)}</b> — ${vals.map(v => num(v)).join(' vs ')}; in force
          <b>${esc(String(r.decision ? r.decision.value : 'undecided'))}</b>
          from ${esc(r.decision ? r.decision.source : '—')}`;
      }))}
      <p>Two more differ in kind rather than in size — what the goal is, and which generation of
      strategy applies — so no rule about figures settles them, and all versions are kept. Two are
      blanks rather than disagreements.</p>
      <p>The rule applied on ${fmtDate(RES.decidedOn)} was <b>${esc(RES.rule)}</b>, recorded
      against ${esc(RES.decidedBy)}. It can be changed on the Plan Reconciliation screen, and
      every figure that depends on it moves with it.</p>`,
      ['The reconciliation register — nine items, each with both quotes',
       'The decision log']);
  }

  if (/missing|blank|gap|empty|incomplete|what do you need/.test(q)){
    const byDoc = calcGapsByDocument();
    return A(`<p>${appData.gaps.length} sections of the source documents are empty. They hold up
      sections of ${Object.keys(byDoc).length} documents.</p>
      ${ul(appData.gaps.slice(0,5).map(g =>
        `<b>${esc(g.where)}</b> — ${esc(g.what)}<br><i>${esc(g.question)}</i>`))}
      <p>…and ${appData.gaps.length - 5} more, all on the Plan Quality Check screen with the
      question attached to each. None is filled in with a plausible value. The two that unblock
      most of the rest are A §6.3, the performance evaluation plan, and A §7.1, the data quality
      plan — everything else describes how those two would be reported.</p>`,
      ['The gap register — every blank from the three source documents',
       'Each gap carries the question that would close it']);
  }

  if (/training work|did the training|effect of training|trained vs|worth it/.test(q)){
    const e = calcTrainingEffect();
    return A(`<p>On the evidence held, yes — with a caveat worth stating.</p>
      ${ul([
        `Trained teachers (${num(e.trained.n)}) went from ${e.trained.before} to ${e.trained.after},
         a gain of <b>${e.trained.gain}</b>`,
        `Untrained teachers (${num(e.untrained.n)}) went from ${e.untrained.before} to
         ${e.untrained.after}, a gain of <b>${e.untrained.gain}</b>`,
        `The difference between the two groups is <b>${e.difference}</b> on a 1–4 scale`
      ])}
      <p class="ask-flag">This is the strongest statement the data supports, and it is not a
      controlled trial. The two groups were not assigned at random — the ${num(e.untrained.n)}
      untrained teachers may differ from the trained ones in ways nobody recorded. Observation is
      also the softest data in the system: a judgement, usually by someone who knows the teacher,
      and the system does not record who made it.</p>`,
      ['The classroom observation register — every teacher, two rounds, five domains',
       'Why/Play/Lead training status per teacher']);
  }

  if (/self.?stud|fullness|school quality|benchmark|domain/.test(q)){
    const mv = calcFolMovement();
    const pr = calcFolPriorities();
    return A(`<p>${num(F2.atBenchmark)} of ${num(F2.records.length)} schools
      (<b>${F2.benchmarkPct}%</b>) are at the Intermediate benchmark or above, against
      ${num(F1.atBenchmark)} (${F1.benchmarkPct}%) at the first round. Mean score
      ${F1.mean} to ${F2.mean} out of 4.</p>
      ${ul([
        `${num(mv.filter(m => m.crossed).length)} schools crossed the benchmark during the year`,
        `${num(mv.filter(m => m.changed).length)} changed stage; none went backwards`,
        `The domain the improvement plans land on most is <b>${esc(pr[0].domain.label)}</b>
         (${pr[0].count} schools), mean ${pr[0].mean}`
      ])}
      <p>POOA v5 sets no target against this, so it reports a level rather than progress towards
      one. The four stages are named in POOA v5; the score bands between them are this system's,
      applied the same way to every school.</p>`,
      ['The School Self-Study register — 27 schools, 6 domains, 2 rounds',
       'The Fullness of Life Framework, POOA v5 OC3']);
  }

  if (/money|fund|raise|revenue|budget|financ|cost/.test(q)){
    return A(`<p><b>${usd(FI.revenue.raised)}</b> of a ${usd(FI.revenue.target)} target —
      ${FI.revenuePct}%. ${num(FI.countriesMet)} of ${num(FI.rows.length)} countries met the
      ${usd(appData.targets.perCountry.value)} envelope.</p>
      <p class="ask-flag">There is nothing to compare spending against. Both figures come from
      A §5.2, the data collection plan. No logframe carries a budget line, A §6.1's resources
      section is empty, A §6.3's cost column is empty, and there is no financial indicator at any
      results level. Every figure on the funding screen compares money raised against money
      raised.</p>`,
      ['A §5.2 — the only source in any document for either figure',
       'The per-country and monthly revenue registers']);
  }

  if (/trust|reliab|data quality|accurate|how good is|verif/.test(q)){
    const Q = calcDataQuality();
    return A(`<p>Partly, and the honest answer is register by register.
      ${appData.registers.length} registers assessed against ${appData.dqMeasures.length}
      measures gives ${Q.cells.length} verdicts, scoring <b>${Q.pct}%</b> overall.</p>
      ${ul([
        `Strongest: <b>${esc(Q.byRegister[Q.byRegister.length-1].register.label)}</b>
         at ${Q.byRegister[Q.byRegister.length-1].pct}%`,
        `Weakest: <b>${esc(Q.weakestRegister.register.label)}</b>
         at ${Q.weakestRegister.pct}%`,
        `Weakest measure across everything: <b>${esc(Q.weakestMeasure.measure.label)}</b>
         at ${Q.weakestMeasure.pct}%`
      ])}
      <p class="ask-flag">A §7.1, the data quality plan, is blank — the indicator is unnamed and
      all fifteen measures are empty. So that assessment is this system marking its own homework,
      and it says so on the Data Quality Plan screen.</p>`,
      ['Every register in the system, assessed against A §7.1’s five measures',
       'Gap G6 — A §7.1 is blank']);
  }

  if (/due|deadline|report|when|submit/.test(q)){
    const cards = REPORT_CARDS.filter(c => c.status === 'due');
    const blockedTotal = Object.keys(appData.reportTemplates)
      .reduce((n,k) => n + calcCompleteness(k).blocked, 0);
    return A(`<p>The project year closed on ${fmtDate(appData.config.project.end)}, so the annual
      report is due. ${cards.length} documents are marked due now:</p>
      ${ul(cards.map(c => {
        const t = appData.reportTemplates[c.id], comp = calcCompleteness(c.id);
        return `<b>${esc(t.name)}</b> — ${comp.pct}% of ${comp.total} sections carry a figure${
          comp.blocked ? `, ${comp.blocked} print the question instead` : ''}`;
      }))}
      <p>Across all six documents, ${blockedTotal} sections print a question rather than a figure,
      because the section of the source plan behind them is blank. They are not empty and they do
      not report zero.</p>`,
      ['The reporting calendar and the period register',
       'Report completeness computed from the template and the gap register']);
  }

  if (/culture|prayer|rule of life|eco app|lead with prayer|project 3|faith/.test(q)){
    return A(`<p><b>${CU.pctAll}%</b> of ${num(CU.staff)} employees are doing all three things
      Project 3 asks for together — culture training, a written rule of life and daily prayer
      practice. The objective says <i>all</i> employees, so against a target of 100% this reads
      ${esc(calcIndicator('P3-1').status.label.toLowerCase())}.</p>
      ${ul([
        `Trained in team culture and core values: ${num(CU.trainedCulture)} (${pct(CU.trainedCulture, CU.staff)}%)`,
        `Personal rule of life written: ${num(CU.ruleOfLife)} (${pct(CU.ruleOfLife, CU.staff)}%)`,
        `Completed <i>Lead with Prayer</i>: ${num(CU.readLeadWithPrayer)} (${pct(CU.readLeadWithPrayer, CU.staff)}%)`,
        `Posting on the ECO App daily: ${num(CU.ecoAppDaily)} (${pct(CU.ecoAppDaily, CU.staff)}%)`
      ])}
      <p class="ask-flag">These are observable proxies — a session attended, a book delivered, an
      app account posting. Whether someone is living out a rule of life is not something this or
      any system can see, and B rows 67 and 72 to 79 give no means of verification for most of
      this project.</p>`,
      ['The employee practice register — 38 employees, five practices',
       'B Project 3, as written · gap G10']);
  }

  if (/teacher|observ|why.?play.?lead|instruct/.test(q)){
    return A(`<p>${num(O.trained)} of ${num(O.total)} teachers (${pct(O.trained, O.total)}%) are
      trained in Why/Play/Lead. Observed practice rose from ${O.before} to ${O.after} — a
      <b>${O.increase}%</b> increase, which is the figure OC1 asks for.</p>
      ${ul(OBS_DOMAINS.map(d => `${esc(d.label)}: ${O.domains[d.key].before} →
        ${O.domains[d.key].after}`))}
      <p>${num(O.consistent)} teachers (${O.consistentPct}%) are at a mean of 3 or above, which
      this system takes as consistently applying the framework. That threshold is its own choice,
      not one the source documents state.</p>`,
      ['The classroom observation register — every teacher, twice, five domains',
       'POOA v5 OC1 asks for the percentage increase, so that is what is reported']);
  }

  if (/leader|oc2|head teacher|governance/.test(q)){
    return A(`<p>${num(L.consistent)} of ${num(L.total)} school leaders
      (<b>${L.consistentPct}%</b>) apply all four of OC2's transformational-leadership indicators.
      ${num(L.trained)} have had the training.</p>
      ${ul(L.indicators.map(i => `${esc(i.label)}: ${num(L.byIndicator[i.key])} of ${num(L.total)}
        (${pct(L.byIndicator[i.key], L.total)}%)`))}
      <p>"Consistently implement" is read as all four, not some of them — a choice this system
      made, because POOA v5 does not define it. POOA v5 sets no target here either, so this
      reports a level.</p>`,
      ['The school leader register — 2 per school, four indicators each',
       'POOA v5 OC2']);
  }

  if (/student|child|children|enrol|attend|retention|graduat/.test(q)){
    return A(`<p><b>${num(S.total)}</b> children enrolled across ${num(SC.total)} partner schools
      — ${num(S.male)} boys and ${num(S.female)} girls, ${S.femaleShare}% girls.</p>
      ${ul([
        `Attendance ${S.attendance}% against the goal of ${appData.targets.attendance.value}%`,
        `Retention ${S.retention}%`,
        `Transition to secondary ${S.transition}% (primary schools)`,
        `Graduation ${S.graduation}% (secondary schools)`,
        `Capacity ${num(S.capacity)} places, ${pct(S.total, S.capacity)}% filled`
      ])}
      <p class="ask-flag">A §2.2 asked for every one of these counts split by sex and left all 48
      cells empty. The split above is computed from the enrolment register instead. No child is
      named anywhere in this system, and nothing here is an individual record.</p>`,
      ['The school enrolment register — 27 schools',
       'Gap G1 — A §2.2’s 48 male/female cells are blank']);
  }

  if (/school|how many school|partner school/.test(q)){
    return A(`<p><b>${num(SC.total)}</b> partner schools — ${num(SC.primary)} primary and
      ${num(SC.secondary)} secondary — against a target of
      ${num(appData.targets.schools.value)}. Met.</p>
      ${ul(appData.countries.map(c => `${esc(c.name)}: ${num(c.schools)}`))}
      <p class="ask-flag">The headline 27 is a figure B Output 2 states. Its per-country breakdown
      disagrees with A §2.2, which records 3 primary schools in Pakistan that Output 2 does not
      account for. Taking the highest value cell by cell would give 30 — a figure no document
      states — so 27 is used with Output 2's breakdown, and Pakistan's 3 are carried as an open
      question.</p>`,
      ['The school register', 'B Output 2 · A §2.2 · reconciliation item R4']);
  }

  if (/stakeholder|project 2|certificat|cohort|mentor/.test(q)){
    return A(`<p><b>${num(TR.inTraining)}</b> stakeholders in ongoing training of
      ${num(TR.total)} enrolled, against a target of
      ${num(appData.targets.stakeholders.value)} — ${pct(TR.inTraining, appData.targets.stakeholders.value)}%.</p>
      ${ul([
        ...Object.entries(TR.byType).map(([k,v]) => `${esc(k)}: ${num(v)}`),
        `Certificated: ${num(TR.certificates)} (${pct(TR.certificates, TR.total)}%)`,
        `Receiving post-training mentoring: ${num(TR.mentored)} (${pct(TR.mentored, TR.total)}%)`
      ])}
      <p class="ask-flag">The target of 500 comes from A §5.2. B rows 28 and 38 say 250 and A §2.6
      says 150 — the highest was adopted, so this reads
      ${pct(TR.inTraining, appData.targets.stakeholders.value)}% rather than
      ${pct(TR.inTraining, 250)}%.</p>`,
      ['The training register', 'A §5.2 · B rows 28 and 38 · reconciliation item R5']);
  }

  return A(`<p>I answer from the registers, not from a model, so I can only answer what something
    in this system actually counts. Try one of these:</p>
    ${ul(ASK_CHIPS.slice(0,6).map(c => esc(c)))}
    <p>Or ask about any of the five countries by name, the teachers, the school leaders, the
    stakeholder training, the self-study, team culture, the money, the gaps in the plan, or
    whether the numbers can be trusted.</p>`,
    ['No register matched the question']);
}

function askSend(text){
  const t = String(text || '').trim();
  if (!t) return;
  const a = askAnswer(t);
  askLog.push({who:'me', text:t});
  askLog.push({who:'it', html:a.html, sources:a.sources});
  showView('ai');
  const log = document.getElementById('ask-log');
  if (log) log.scrollTop = log.scrollHeight;
}

function renderAsk(){
  const body = askLog.length
    ? askLog.map(m => m.who === 'me'
        ? `<div class="ask-m me"><div>${esc(m.text)}</div></div>`
        : `<div class="ask-m it">
            <div class="ask-who"><i class="bi bi-stars"></i> Eval360</div>
            <div class="ask-b">${m.html}</div>
            ${m.sources && m.sources.length ? `<div class="ask-src">
              <b>Where this came from</b>
              ${m.sources.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}
          </div>`).join('')
    : `<div class="ask-m it"><div class="ask-who"><i class="bi bi-stars"></i> Eval360</div>
        <div class="ask-b">
          <p>Ask me anything this system counts. I am not a language model — every answer below is
          assembled by a function reading the registers, which is why each one shows its working
          and why none of them can invent a figure.</p>
          <p>Two things I will not do. I will not give you a figure the source documents disagree
          about without telling you they disagree, and I will not give you anything about an
          individual child — I receive counts, never records, and no child's name exists anywhere
          in this system to give.</p>
        </div></div>`;

  return `<div class="sec-title">Ask Eval360</div>
    <div class="sec-sub">Computed answers from ${appData.registers.length} registers. No model,
      no guessing — and the working attached to every one.</div>

    <div class="ask-wrap">
      <div class="card ask-pane">
        <div class="ask-log" id="ask-log">${body}</div>
        <div class="ask-in">
          <input id="ask-q" type="text" placeholder="Ask about the targets, a country, the gaps…"
            autocomplete="off" data-action="ask-key">
          <button class="btn btn-primary" data-action="ask-send">
            <i class="bi bi-send"></i> Ask</button>
          ${askLog.length ? `<button class="btn btn-ghost" data-action="ask-clear"
            title="Start again"><i class="bi bi-arrow-counterclockwise"></i></button>` : ''}
        </div>
      </div>
      <div>
        <div class="card"><div class="card-head"><h3>Try one of these</h3></div>
          <div class="card-body">
            ${ASK_CHIPS.map(c => `<button class="ask-chip" data-action="ask-chip"
              data-q="${esc(c)}">${esc(c)}</button>`).join('')}
          </div></div>
        <div class="card" style="margin-top:16px">
          <div class="card-head"><h3>What it reads</h3>
            ${chip(appData.registers.length + ' registers','grey')}</div>
          <div class="card-body">
            ${appData.registers.map(r => `<div class="ask-reg">
              <div class="ask-rn">${esc(r.label)}</div>
              <div class="ask-rc">${r.count()}</div></div>`).join('')}
            <p style="margin:12px 0 0;font-size:11.5px;line-height:1.6;color:var(--ink-mute)">
              Plus the three source documents, the nine reconciliation items and the
              ${appData.gaps.length} gaps — so it can tell you what is missing as readily as what
              is there.</p>
          </div></div>
      </div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   6z. MY INBOX — what this account, today, is being asked to do
   Derived from the same alerts the dashboard reads, then filtered to what the
   current role can actually open. An item an account cannot act on is not
   shown to it, because an inbox full of other people's work is noise.
   ═══════════════════════════════════════════════════════════════════════════ */
function calcInbox(){
  const items = [];
  const P = calcPlanScore();
  const own = appData.dataPlan.filter(d => d.who === currentUser.name
    || d.who.split(' and ').includes(currentUser.name));

  /* 1. The report that is due. */
  REPORT_CARDS.filter(c => c.status === 'due').forEach(c => {
    const t = appData.reportTemplates[c.id], comp = calcCompleteness(c.id);
    items.push({tone: comp.blocked ? 'warn' : 'bad', icon:'bi-file-earmark-text',
      title:`${t.name} is due`,
      body:`The project year closed on ${fmtDate(appData.config.project.end)}. `
        + `${comp.pct}% of ${comp.total} sections carry a figure`
        + (comp.blocked
          ? `; ${comp.blocked} ${comp.blocked === 1 ? 'prints' : 'print'} the question instead, `
            + `because the section of the plan behind ${comp.blocked === 1 ? 'it' : 'them'} `
            + `is blank.`
          : '.'),
      view:'reports', cta:'Report Centre', who:'Everyone'});
  });

  /* 2. Decisions with nobody's name on them. */
  P.findings.filter(f => f.state === 'open').forEach(f => {
    items.push({tone:'bad', icon:'bi-sliders2',
      title:`${f.id} has no decision on the record`,
      body:f.issue + ' The system will not choose one.',
      view:'reconcile', cta:'Decide', who:'Director or M&E Lead'});
  });

  /* 3. What A §5.2 makes THIS person responsible for. */
  if (own.length) items.push({tone:'info', icon:'bi-person-check',
    title:`A §5.2 makes you responsible for ${own.length} reporting line${
      own.length === 1 ? '' : 's'}`,
    body:own.map(d => `${d.output} (${d.freq.toLowerCase()})`).join(' · '),
    view:'team', cta:'Team', who:currentUser.name});

  /* 4. Countries with no coordinator — only the people who would appoint one. */
  const noCo = appData.countries.filter(c => !c.coordinator);
  if (noCo.length && /Director|MEAL/.test(currentUser.role))
    items.push({tone:'warn', icon:'bi-globe2',
      title:`${noCo.length} countries have no coordinator named`,
      body:`${noCo.map(c => c.name).join(' and ')}. A §5.2 makes the country coordinator the `
        + `person who reports most of a country's figures, so these two report through nobody.`,
      view:'countries', cta:'Countries', who:'Director or M&E Lead'});

  /* 5. Schools below the benchmark, for whoever owns school quality. */
  const f2 = calcFoL();
  const below = f2.records.length - f2.atBenchmark;
  if (below) items.push({tone:'warn', icon:'bi-stars',
    title:`${below} schools are below the Intermediate benchmark`,
    body:`Each has named its own two weakest domains. ${
      calcFolMovement().filter(m => m.crossed).length} schools crossed the benchmark this year `
      + `and none went backwards.`,
    view:'fol', cta:'Fullness of Life', who:'Quality or Programme'});

  /* 6. The blanks, last, because they are nobody's task inside this system. */
  items.push({tone:'info', icon:'bi-question-circle',
    title:`${appData.gaps.length} blanks are waiting on B2THEWORLD, not on this system`,
    body:`They hold up sections of ${Object.keys(calcGapsByDocument()).length} documents. Each is `
      + `carried with the question that would close it. Two — A §6.3 and A §7.1 — unblock most of `
      + `the rest.`,
    view:'quality', cta:'Plan Quality Check', who:'Everyone'});

  return items.filter(i => access(i.view) !== 'none');
}

function renderInbox(){
  const items = calcInbox();
  const urgent = items.filter(i => i.tone === 'bad').length;

  return `<div class="sec-title">My Inbox</div>
    <div class="sec-sub">What this account is being asked to do, as
      ${esc(currentUser.name)} · ${esc(currentUser.title)}. Switch role in the top bar and this
      list changes with it — an item you cannot open is not shown to you.</div>

    <div class="kpi-row">
      ${kpiTile('Waiting on you', String(items.length),
        `of which ${urgent} cannot wait`, urgent ? 'bad' : 'ok')}
      ${kpiTile('The year', 'Closed ' + fmtDate(appData.config.project.end),
        'The annual report is due', 'warn')}
      ${kpiTile('Plan', calcPlanScore().score + ' / 100',
        esc(calcPlanScore().band.label), calcPlanScore().score >= 60 ? 'warn' : 'bad')}
      ${kpiTile('Your scope', currentUser.country === 'All' ? 'All countries'
        : esc(currentUser.country),
        Object.keys(ROLE_ACCESS[currentUser.role] || {}).length
          ? Object.keys(ROLE_ACCESS[currentUser.role]).length + ' screens restricted'
          : 'Nothing restricted')}
    </div>

    ${items.map(i => `<div class="inb ${i.tone}">
      <i class="bi ${i.icon}"></i>
      <div><div class="inb-t">${esc(i.title)}</div>
        <div class="inb-b">${esc(i.body)}</div>
        <div class="inb-w">Usually ${esc(i.who)}</div></div>
      <button class="btn btn-sm ${i.tone === 'bad' ? 'btn-primary' : 'btn-ghost'}"

        nothing, and cannot say a report is due after it has been sent.</div></div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   7c. THE USER GUIDE, GENERATED BY THE SYSTEM ITSELF
   Not a screenshot anywhere. Each figure is a real view, rendered with the
   project's own records and dropped into the document. Change the data and
   the guide changes with it.
   ═══════════════════════════════════════════════════════════════════════════ */
const GUIDE_VERSION = '1.0';
let guideCharts = [];

/* Render a view and collect it, together with the configuration of any chart
   it wanted to draw. The charts are NOT drawn here: the configuration travels
   into the guide and is drawn there, so the guide can be built in a browser or
   from a script with no screen at all and still open with live charts. */
function captureView(view, meta, prefix){
  const r = VIEW_RENDERERS[view];
  if (!r) return '';
  /* Renderers read currentView to decide whether this role may write to the
     screen. The guide calls them directly, so without this a figure of the
     Fullness of Life screen could carry the access level of whatever screen
     the reader happened to be on when they pressed build. */
  const wasView = currentView, wasMeta = currentMeta;
  currentView = view; currentMeta = meta;
  const real = mountChart;
  const seen = [];
  globalThis.mountChart = (id, cfg) => { seen.push({id, cfg: chartConfig(cfg)}); };
  pendingMounts = [];
  let html = '';
  try {
    html = `<section class="view active">${r(meta)}</section>`;
    pendingMounts.forEach(fn => { try { fn(); } catch(e){} });
  } finally {
    globalThis.mountChart = real;
    pendingMounts = [];
    currentView = wasView; currentMeta = wasMeta;
  }
  /* Canvas ids must be unique across the whole document, so each figure gets
     its own prefix — in the markup and in the configuration together. */
  seen.forEach(c => {
    const to = prefix + '-' + c.id;
    html = html.split('id="' + c.id + '"').join('id="' + to + '"');
    guideCharts.push({id: to, cfg: c.cfg});
  });
  return html;
}

/* Chart configurations carry callbacks — axis tick formatting, tooltip labels.
   Those callbacks close over this page: helpers like num(), and variables
   local to the renderer that produced them. Carried into the guide they would
   throw, and a tick callback that throws takes the whole chart with it. They
   are dropped. The plot is identical; an axis shows 100 rather than 100%. */
function guideSerialize(obj){
  return JSON.stringify(obj, (k, v) => (typeof v === 'function' ? undefined : v));
}

/* The chrome around a figure, so a screen is recognisable on the page. */
function guideShot(view, inner, caption, opts){
  opts = opts || {};
  const nav = NAV.flatMap(g => g.items).find(i => i.key === view);
  const det = DETAIL_VIEWS[view];
  const title = opts.title || (nav ? nav.label : (det ? det.title : view));
  const crumb = det ? det.crumb
    : (NAV.find(g => g.items.some(i => i.key === view)) || {}).group || '';
  const side = NAV.map(g => `<div class="ss-g">${esc(g.group)}</div>` +
    g.items.map(i => `<div class="ss-i${
      i.key === (opts.navKey || view) ? ' on' : ''}">${esc(i.label)}</div>`).join('')).join('');
  return `<figure class="fig">
    <div class="shot" style="--h:${opts.h || 560}px">
      <div class="shot-sb">
        <div class="ss-brand">${esc(appData.config.org.short)}
          <span>${esc(appData.config.org.name)}</span></div>
        ${side}
      </div>
      <div class="shot-col">
        <div class="shot-tb"><div><b>${esc(title)}</b><i>${esc(crumb)}</i></div>
          <div class="ss-user">${esc(currentUser.initials)} ${esc(currentUser.title)}</div></div>
        <div class="shot-main"><div class="shot-scale">${inner}</div></div>
      </div>
    </div>
    <figcaption>${esc(caption)}</figcaption>
  </figure>`;
}

      demonstration — a real deployment persists, and the Configuration screen says so where
      somebody might assume otherwise.`]}
   ]};
}

/* The chapters, in order, numbered by position. Nothing carries its own number:
   inserting a chapter used to mean renumbering every one after it and fixing
   every "see chapter 4" by hand, and one of them was always missed. */
function guideAllChapters(){
  const list = guideChapters()
    .concat([guideChapterEntry()])
    .concat(guideChapters2())
    .concat([guideQuickRef()]);
  list.forEach((ch, i) => { ch.no = i + 1; });
  return list;
}
/* "chapter 5", resolved from the title, so a cross-reference cannot go stale. */
function chRef(titleFragment){
  const list = guideAllChapters();
  const ch = list.find(x => x.title.toLowerCase().includes(titleFragment.toLowerCase()));
  return ch ? 'chapter ' + ch.no : 'the relevant chapter';
}

/* ── Assemble the document ───────────────────────────────────────────────── */
function buildGuideDocument(onProgress){
  guideCharts = [];
  const chapters = guideAllChapters();
  const C = appData.config;
  const figs = chapters.reduce((t,ch) => t + ch.body.filter(x => x.fig).length, 0);
  let done = 0;

  const renderBlock = x => {
    if (x.p)    return `<p>${x.p}</p>`;
    if (x.h)    return `<h3>${esc(x.h)}</h3>`;
    if (x.ul)   return `<ul>${x.ul.map(i => `<li>${i}</li>`).join('')}</ul>`;
    if (x.ol)   return `<ol>${x.ol.map(i => `<li>${i}</li>`).join('')}</ol>`;
    if (x.note) return `<div class="g-note"><strong>${esc(x.note[0])}</strong>
      <div>${x.note[1]}</div></div>`;
    if (x.step) return `<div class="g-step"><i>${esc(x.step[0])}</i>
      <div><b>${esc(x.step[1])}</b><span>${esc(x.step[2])}</span></div></div>`;
    if (x.table) return `<table class="g-tbl"><thead><tr>${x.table[0]
      .map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${x.table.slice(1)
      .map(row => `<tr>${row.map((c,i) =>
        `<td${i === 0 ? ' class="k"' : ''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    if (x.fig){
      const view = x.fig[0], caption = x.fig[1], opts = x.fig[2] || {};
      if (!VIEW_RENDERERS[view])
        throw new Error('The guide names a screen that does not exist: ' + view);
      const inner = captureView(view, opts.meta, 'f' + (done + 1));
      done++;
      if (onProgress) onProgress(done, figs, caption);
      return guideShot(view, inner, caption, opts);
    }
    return '';
  };

  const chapterHtml = chapters.map(ch => `<section class="g-ch" id="ch${ch.no}">
    <div class="g-ch-no">Chapter ${ch.no}</div>
    <h2>${esc(ch.title)}</h2>
    ${ch.sub ? `<p class="g-sub">${esc(ch.sub)}</p>` : ''}
    ${ch.body.map(renderBlock).join('\n')}
  </section>`);

  const toc = chapters.map(ch => `<div class="g-toc-r"><b>${ch.no}</b>
    <span>${esc(ch.title)}</span></div>`).join('');

  return `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${esc(C.org.short)} Eval360 — Complete User Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
${guideStylesheet()}
${guideDocCss()}
</style></head>
<body class="g-body">
<div class="g-bar no-print">
  <span>${esc(C.org.short)} Eval360 — Complete User Guide · ${chapters.length} chapters ·
    ${figs} figures</span>
  <button onclick="window.print()">Print / Save as PDF</button>
</div>

<section class="g-cover">
  <div class="g-cover-mark">${esc(C.org.short)}</div>
  <div class="g-cover-kicker">Eval360 · Monitoring, Evaluation and Reporting</div>
  <h1>Complete<br>User Guide</h1>
  <p class="g-cover-lede">How ${esc(C.org.name)} uses Eval360 — from three source documents that
    disagree, to a signed report a partner can rely on. Every figure recorded once, in the
    register it belongs to, and read everywhere it is needed.</p>
  <div class="g-cover-meta">
    <div><b>${esc(C.org.name)}</b><span>${esc(C.project.title)}</span>
      <span>${appData.countries.map(c => esc(c.name)).join(' · ')}</span></div>
    <div><b>Version ${GUIDE_VERSION}</b><span>${fmtDate(C.today)}</span></div>
    <div><b>Audience</b><span>Everyone who records, checks or reports a figure</span></div>
  </div>
</section>

<section class="g-toc">
  <div class="g-ch-no">Contents</div>
  <h2>What is in this guide</h2>
  ${toc}
  <div class="g-note" style="margin-top:22px"><strong>Where to start</strong>
    <div>Chapter 1 explains the problem this system was built for, and ${
    chRef('Plan Reconciliation')} explains almost everything else about how it behaves. Read those
    two and the rest will make sense in any order. ${
    chRef('One page to keep').replace('chapter', 'Chapter')} is a single page to keep beside the
    screen, and ${chRef('Recording what you know')} is the one to read before you type anything
    into it.</div>
  </div>
  <p class="g-gen">Generated by Eval360 on ${fmtDate(C.today)} from the data in the system.
    Nothing in this guide is a screenshot: every figure is the live screen, rendered with the
    project's own records, so the guide cannot describe a version of the system that no longer
    exists.</p>
</section>

${chapterHtml.join('\n')}
<footer class="g-end">${esc(C.org.name)} · Eval360 Complete User Guide ·
  Version ${GUIDE_VERSION} · ${fmtDate(C.today)}</footer>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"><\/script>
<script>
/* The figures carry their own charts. Without a connection a figure keeps its
   caption and the rest of the screen; only the plot is missing. */
var GUIDE_CHARTS = ${guideSerialize(guideCharts)};
window.addEventListener('load', function(){
  if (!window.Chart){
    document.querySelectorAll('.shot canvas').forEach(function(c){
      var d = document.createElement('div');
      d.style.cssText = 'height:190px;display:grid;place-items:center;background:#e7edf1;' +
        'border-radius:9px;font:400 12px Inter,sans-serif;color:#6d8396';
      d.textContent = 'Chart — shown live in the system';
      c.parentNode.replaceChild(d, c);
    });
    return;
  }
  GUIDE_CHARTS.forEach(function(c){
    var el = document.getElementById(c.id);
    if (el){ try { new Chart(el, c.cfg); } catch(e){} }
  });
});
<\/script>
</body></html>`;
}

/* ── The screen that builds it ──────────────────────────────────────────── */
let guideState = {built:null, progress:null};

function guideBuild(){
  guideState.progress = {done:0, total:0, label:'Starting…'};
  showView('guide');
  /* Out of the current frame so the progress line paints before the work. */
  setTimeout(() => {
    try {
      const html = buildGuideDocument((done, total, label) => {
        guideState.progress = {done, total, label};
      });
      guideState.built = {html, at:nowStamp(),
        figures:guideCharts.length, bytes:html.length,
        chapters:guideAllChapters().length};
      guideState.progress = null;
      showView('guide');
      toast(`Guide built — ${guideState.built.chapters} chapters, `
        + `${(guideState.built.bytes / 1024).toFixed(0)} KB. Nothing in it is a screenshot.`, 'ok');
    } catch (e){
      guideState.progress = null;
      showView('guide');
      toast('The guide could not be built: ' + esc(e.message), 'bad');
    }
  }, 30);
}
function guideOpen(){
  if (!guideState.built){ guideBuild(); return; }
  const blob = new Blob([guideState.built.html], {type:'text/html; charset=utf-8'});
  const url = URL.createObjectURL(blob);
  if (!window.open(url, '_blank'))
    toast('Pop-up blocked. Allow pop-ups for this page to open the guide.', 'warn');
}
function guideDownload(){
  if (!guideState.built){ guideBuild(); return; }
  const blob = new Blob([guideState.built.html], {type:'text/html; charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = appData.config.org.short + '_Eval360_User_Guide.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Downloaded. It is a single file and opens in any browser, online or not.', 'ok');
}

function renderComingSoon(key){
  const nav = NAV.flatMap(g => g.items).find(i => i.key === key);
  const stage = STAGE_PLAN[key];
  return `<div class="empty">
    <i class="bi bi-hourglass-split"></i>
    <h4>${esc(nav ? nav.label : key)}</h4>
    <p>Arrives in <strong>stage ${stage || '?'}</strong> of 11. The shell, the navigation and both
      source plans are in place; this screen needs the seed data that stage 2 produces.</p>
    <p style="margin-top:11px"><button class="btn btn-sm" data-action="go" data-view="dashboard">
      Back to the overview</button></p></div>`;
}

const VIEW_RENDERERS = {
  dashboard: renderDashboard,
  toc: renderToc,
  logframe: renderLogframe,
  indicators: renderIndicators,
  reconcile: renderReconcile,
  planmap: renderPlanMap,
  countries: renderCountries,
  'country-detail': renderCountryDetail,
  schools: renderSchools,
  'school-detail': renderSchoolDetail,
  students: renderStudents,
  teachers: renderTeachers,
  leaders: renderLeaders,
  training: renderTraining,
  fol: renderFol,
  observation: renderObservation,
  safeguarding: renderSafeguarding,
  culture: renderCulture,
  team: renderTeam,
  funding: renderFunding,
  reports: renderReports,
  'report-preview': renderReportPreview,
  dataquality: renderDataQuality,
  quality: renderQualityCheck,
  ai: renderAsk,
  inbox: renderInbox,
  users: renderUsers,
  config: renderConfig,
  guide: renderGuide
};

/* ═══════════════════════════════════════════════════════════════════════════
   7. ROUTER AND EVENTS
   ═══════════════════════════════════════════════════════════════════════════ */
let currentView = 'dashboard';
let currentMeta = undefined;

function buildSidebar(){
  const nav = document.getElementById('sb-nav');
  if (!nav) return;
  nav.innerHTML = NAV.map(g => {
    const items = g.items.filter(i => access(i.key) !== 'none');
    if (!items.length) return '';
    return `<div class="sb-g">${esc(g.group)}</div>` + items.map(i =>
      `<button class="nav-item${i.key === currentView ? ' on' : ''}"
        data-action="go" data-view="${esc(i.key)}">
        <i class="bi ${esc(i.icon)}"></i><span>${esc(i.label)}</span></button>`).join('');
  }).join('');
  const foot = document.getElementById('sb-foot');
  if (foot) foot.innerHTML = `${esc(appData.config.yearLabel)}<br>
    <span style="opacity:.75">Demonstration build · figures illustrative</span>`;
}

function showView(name, meta){
  if (!NAV.flatMap(g => g.items).some(i => i.key === name) && !DETAIL_VIEWS[name])
    name = 'dashboard';
  if (access(name) === 'none') name = 'dashboard';
  currentView = name;
  /* Held so a control on the screen can re-render the same subject — a report
     for one country, a school's self-study — instead of falling back to the
     first one in the register. */
  currentMeta = meta;
  destroyCharts();

  const nav = NAV.flatMap(g => g.items).find(i => i.key === name);
  const detail = DETAIL_VIEWS[name];
  const group = NAV.find(g => g.items.some(i => i.key === name));
  document.getElementById('tb-title').textContent = nav ? nav.label : (detail?.title || name);
  document.getElementById('tb-crumb').textContent = detail ? detail.crumb : (group?.group || '');

  pendingMounts = [];
  const r = VIEW_RENDERERS[name];
  document.getElementById('main').innerHTML =
    `<section class="view active" id="view-${name}">${
      r ? r(meta) : renderComingSoon(name)}</section>`;
  pendingMounts.forEach(fn => { try { fn(); } catch(e){ console.warn('chart mount failed', e); } });
  pendingMounts = [];

  buildSidebar();
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sb-backdrop').classList.remove('open');
  window.scrollTo(0,0);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-action]');
  if (!t) return;
  const a = t.dataset.action;
  if (a === 'go')            showView(t.dataset.view, t.dataset.meta);
  if (a === 'close-modal')   closeModal();
  if (a === 'modal-backdrop' && e.target.id === 'modal-root') closeModal();
  if (a === 'open-sidebar'){ document.getElementById('sidebar').classList.add('open');
                             document.getElementById('sb-backdrop').classList.add('open'); }
  if (a === 'close-sidebar'){document.getElementById('sidebar').classList.remove('open');
                             document.getElementById('sb-backdrop').classList.remove('open'); }
  if (a === 'show-checks')   showChecks();
  if (a === 'lf-proj'){      lfOpen = t.dataset.code; showView('logframe'); }
  if (a === 'ind-filter'){   indFilter = t.dataset.k; showView('indicators'); }
  if (a === 'rec-tab'){      recTab = t.dataset.k; showView('reconcile'); }
  if (a === 'rec-change'){   recChangeModal(t.dataset.id); }
  if (a === 'rep-sources'){  reportState.showSources = !reportState.showSources;
                             showView('report-preview', currentMeta); }
  if (a === 'rep-print')     reportPrint();
  if (a === 'rep-doc')       reportDoc();
  if (a === 'rep-csv')       reportCsv();
  if (a === 'ask-chip')      askSend(t.dataset.q);
  if (a === 'ask-send'){
    const el = document.getElementById('ask-q');
    const v = el ? el.value : '';
    if (!String(v).trim()){ toast('Type a question, or pick one from the list.', 'warn'); return; }
    askSend(v);
  }
  if (a === 'ask-clear'){    askLog = []; showView('ai'); }
  if (a === 'brand-reset')   brandReset();
  if (a === 'guide-build')   guideBuild();
  if (a === 'guide-open')    guideOpen();
  if (a === 'guide-download') guideDownload();
  if (a === 'entry-open')    openEntryForm(t.dataset.form, t.dataset.meta);
  if (a === 'entry-submit')  entrySubmit();
  if (a === 'reseed'){
    seedAll();
    appData.checkSnapshot = runConsistencyChecks();
    showView(currentView, currentMeta);
    toast(`Reseeded from ${SEED}. Every figure is identical to the one you just saw — that is `
      + `what a fixed seed is for.`, 'ok');
  }
  if (a === 'rec-apply'){
    const f = document.getElementById('rec-form');
    const sel = f ? f.querySelector('input[name="val"]:checked') : null;
    if (!sel){ toast('Choose one of the figures a document states.', 'warn'); return; }
    const noteEl = f.querySelector('textarea[name="note"]');
    const raw = sel.value;
    const val = /^-?\d+(\.\d+)?$/.test(raw) ? Number(raw) : raw;
    const moved = applyDecision(t.dataset.id, val, sel.dataset.src,
                                noteEl ? noteEl.value.trim() : '');
    closeModal();
    showView('reconcile');
    if (moved && moved.key && typeof moved.to === 'number'){
      const actual = moved.key === 'students' ? calcStudents().total
        : moved.key === 'schools' ? calcSchools().total
        : moved.key === 'stakeholders' ? calcTraining().inTraining
        : appData.countries.length;
      const p = calcTargetProgress(moved.key, actual);
      toast(`${esc(moved.key)} target ${moved.from === null ? 'set to' : num(moved.from) + ' to'} `
        + `<strong>${num(moved.to)}</strong>. Delivery of ${num(actual)} now reads `
        + `<strong>${p.pct}%</strong> instead of ${pct(actual, moved.from)}%.`, 'ok');
    } else {
      toast('Decision recorded against your name.', 'ok');
    }
  }
});
/* The 1–4 and yes/no pills are labels wrapping a radio, so the highlight has
   to follow the checked input rather than a click target. */
document.addEventListener('change', e => {
  if (e.target && e.target.type === 'radio'){
    const group = e.target.closest('.ef-scale, .ef-yn');
    if (group) group.querySelectorAll('label').forEach(l =>
      l.classList.toggle('on', !!l.querySelector('input:checked')));
  }
  const t = e.target.closest('[data-action]');
  if (!t) return;
  if (t.dataset.action === 'sch-filter'){ schFilter[t.dataset.k] = t.value; showView('schools'); }
  if (t.dataset.action === 'tch-filter'){ tchFilter[t.dataset.k] = t.value; showView('teachers'); }
  if (t.dataset.action === 'rep-subject' && t.value)
    showView('report-preview', t.dataset.id + ':' + t.value);
  if (t.dataset.action === 'brand-set') brandSet(t.dataset.v, t.value);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.target && e.target.id === 'ask-q'){
    e.preventDefault();
    askSend(e.target.value);
  }
});

function showChecks(){
  const r = appData.checkSnapshot || runConsistencyChecks();
  openModal({
    wide:true,
    title:`Consistency checks — ${r.passed} of ${r.total} passed`,
    body:`<p style="margin:0 0 12px;color:var(--ink-soft);font-size:12.5px;line-height:1.65">
        These assert that the system did not quietly do something it was told not to: that the two
        plans stayed apart, that every target matches a recorded decision, that nothing blank was
        filled. The checks over seeded figures — attendance against enrolment, trained teachers
        against the register — arrive with the seed data in stage 2.</p>
      <div class="tbl-scroll"><table class="dt"><tbody>${r.results.map(c => `<tr>
        <td style="width:26px">${c.pass
          ? '<i class="bi bi-check-circle-fill" style="color:var(--ok)"></i>'
          : '<i class="bi bi-x-circle-fill" style="color:var(--bad)"></i>'}</td>
        <td>${esc(c.name)}</td></tr>`).join('')}</tbody></table></div>`,
    foot:`<button class="btn" data-action="close-modal">Close</button>`
  });
}

function buildRoleSelector(){
  const sel = document.getElementById('role-sel');
  sel.innerHTML = appData.users.map(u =>
    `<option value="${u.id}">${esc(u.name)} — ${esc(u.title)}</option>`).join('');
  sel.value = currentUser.id;
  sel.addEventListener('change', () => {
    currentUser = appData.users.find(u => u.id === sel.value);
    document.getElementById('tb-avatar').textContent = currentUser.initials;
    showView(access(currentView) === 'none' ? 'dashboard' : currentView);
    toast(`Viewing as ${esc(currentUser.title)}${currentUser.country !== 'All'
      ? ' · ' + esc(currentUser.country) : ''}.`, 'ok');
  });
}
function buildPeriodSelector(){
  const sel = document.getElementById('period-sel');
  sel.innerHTML = appData.periods.map(p =>
    `<option value="${p.id}">${esc(p.label)}${p.state === 'due' ? ' — due' : ''}</option>`).join('');
  sel.value = currentPeriod.id;
  sel.addEventListener('change', () => {
    currentPeriod = appData.periods.find(p => p.id === sel.value);
    showView(currentView);
  });
}

/* ═══════════════════════════════════════════════════════════════════════════
   8. INIT
   ═══════════════════════════════════════════════════════════════════════════ */
(function init(){
  seedAll();
  /* Captured once, before anybody can type anything. A check that wants to
     state a seed figure states it from here; a check that wants to assert a
     rule asserts it against the live registers. Mixing the two is what makes
     a consistency chip go red for no reason the first time someone uses the
     system. */
  appData.seedFacts = captureSeedFacts();
  const r = appData.checkSnapshot = runConsistencyChecks();
  document.getElementById('check-chip-text').textContent =
    r.failures.length ? `${r.failures.length} of ${r.total} checks failed`
                      : `${r.passed} checks passed`;
  if (r.failures.length)
    document.getElementById('check-chip').querySelector('i').className =
      'bi bi-exclamation-triangle-fill';

  document.getElementById('tb-avatar').textContent = currentUser.initials;
  buildRoleSelector();
  buildPeriodSelector();
  buildSidebar();
  showView('dashboard');

  console.log('B2THEWORLD · Eval360 demonstration —',
    appData.plans.y2024.projects.length, 'projects,',
    appData.reconciliation.length, 'reconciliation items,',
    appData.gaps.length, 'gaps.');
})();
</script>
