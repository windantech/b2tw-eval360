              See the gap</button></div>
        </div></div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   6p. SAFEGUARDING & STUDENT CARE
   ═══════════════════════════════════════════════════════════════════════════ */
function renderSafeguarding(){
  const f2 = calcFoL('R2');
  const D = appData.selfStudy.domains;
  const safe = D.find(d => d.key === 'safe'), care = D.find(d => d.key === 'care');
  const assessed = appData.schools.filter(s => folAssessed(s.code));
  const belowSafe = assessed.filter(s => folFor(s.code).scores.safe < 3);
  const belowCare = assessed.filter(s => folFor(s.code).scores.care < 3);
  const unassessed = folUnassessed();
  const AS = appData.plans.pooa5.assumptions;

  return `<div class="sec-title">Safeguarding &amp; Student Care</div>
    <div class="sec-sub">B2THEWORLD works with children affected by armed conflict, persecution
      and displacement. This screen holds what the self-study measures about their safety and
      care — and is explicit about what the source documents do not cover.</div>

    <div class="banner ok"><i class="bi bi-shield-check"></i>
      <div><strong>What this system holds about a child: nothing.</strong> There is no name, no
        date of birth, no identifier and no individual record anywhere in Eval360. Enrolment is
        held per school, by sex. Every figure on every screen is a count. A system that holds no
        child-level data cannot leak one, which is the simplest safeguard available and the reason
        it is built this way.</div></div>

    <div class="kpi-row">
      ${kpiTile('Safe environment', f2.domainMean.safe + ' of 4',
        `${appData.schools.length - belowSafe.length} of ${appData.schools.length} schools at Intermediate or above`,
        f2.domainMean.safe >= 3 ? 'ok' : 'warn')}
      ${kpiTile('Student care', f2.domainMean.care + ' of 4',
        `${appData.schools.length - belowCare.length} of ${appData.schools.length} schools at Intermediate or above`,
        f2.domainMean.care >= 3 ? 'ok' : 'warn')}
      ${kpiTile('Schools needing attention', String(new Set([...belowSafe, ...belowCare]).size),
        'Below the benchmark on safety, care or both', 'warn')}
      ${kpiTile('Child records held', '0',
        'By design — see above', 'ok')}
    </div>

    <div class="banner bad"><i class="bi bi-exclamation-octagon-fill"></i>
      <div><strong>The most important gap in the plan.</strong> None of the three source documents
        describes a child protection policy, a safeguarding incident process, a reporting line, or
        a register of referral partners. POOA v5's <strong>AS3</strong> assumes schools will
        prioritise safeguarding and <strong>AS5</strong> assumes external referral partners are
        available and able to receive referrals — but no document says who they are, or what
        happens when a child discloses something.
        <br><br>This system does not invent that process. For an organisation working with
        war-affected children it is the first thing to write down, and the first thing a donor
        will ask for.</div></div>

    <div class="panel-grid">
      <div class="card"><div class="card-head"><h3>Safety and care, school by school</h3>
        <span style="font-size:11px;color:var(--ink-mute)">round 2 self-study, out of 4</span></div>
        <div class="tbl-scroll" style="max-height:440px"><table class="dt">
          <thead><tr><th>School</th><th>Country</th>
            <th class="n">${esc(safe.label.split(' and ')[0])}</th>
            <th class="n">${esc(care.label.split(' and ')[0])}</th>
            <th>Status</th></tr></thead>
          <tbody>${appData.schools.map(s => {
            const r = folFor(s.code);
            if (!r) return `<tr class="clickable" data-action="go" data-view="school-detail"
              data-meta="${esc(s.code)}">
              <td><div class="sch-name">${esc(s.name || s.code)}</div></td>
              <td>${esc(s.country)}</td>
              <td class="n na">—</td><td class="n na">—</td>
              <td>${chip(NOT_ASSESSED,'grey')}</td></tr>`;
            const low = r.scores.safe < 3 || r.scores.care < 3;
            return `<tr class="clickable" data-action="go" data-view="school-detail"
              data-meta="${esc(s.code)}">
              <td><div class="sch-name">${esc(s.name || s.code)}</div></td>
              <td>${esc(s.country)}</td>
              <td class="n" style="color:var(--${r.scores.safe >= 3 ? 'ok' : 'warn'})">
                <strong>${r.scores.safe}</strong></td>
              <td class="n" style="color:var(--${r.scores.care >= 3 ? 'ok' : 'warn'})">
                <strong>${r.scores.care}</strong></td>
              <td>${low ? chip('Below benchmark','warn') : chip('At benchmark','ok','bi-check')}</td>
            </tr>`;
          }).join('')}</tbody></table></div></div>

      <div class="card"><div class="card-head"><h3>The assumptions this rests on</h3>
        ${chip('POOA v5','accent')}</div>
        <div class="card-body">
          <p style="margin:0 0 12px;font-size:12.5px;color:var(--ink-soft);line-height:1.65">
            POOA v5 lists six assumptions. Three of them are about whether children can actually be
            kept safe and supported. An assumption that is never checked is a risk, so they are
            listed here rather than left at the bottom of the theory of change.</p>
          ${AS.filter(a => ['AS3','AS4','AS5'].includes(a.code)).map(a => `<div class="watch">
            <div class="w-c">${esc(a.code)}</div>
            <div><div class="w-t">${esc(a.text)}</div>
              <div class="w-s">${a.code === 'AS5'
                ? 'No register of referral partners exists in any document. Nothing in this system can tell you whether this assumption holds in a given country.'
                : a.code === 'AS3'
                ? 'Partly checkable — the self-study scores safeguarding within the safe-environment domain.'
                : 'Not checkable from anything this system holds.'}</div></div></div>`).join('')}
          <div style="margin-top:13px">
            <button class="btn btn-sm" data-action="go" data-view="toc">
              All six assumptions <i class="bi bi-arrow-right"></i></button></div>
        </div></div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   6t. REPORT GENERATION — the quantitative blocks
   Every block reads the registers at the moment it is called. None of them
   holds a figure of its own, so a report cannot drift from the screens that
   show the same numbers.
   ═══════════════════════════════════════════════════════════════════════════ */
const reportState = {open:null, ctx:{}, showSources:false, submitted:{}};

/* A gap, rendered where the figure would have gone. This is the whole point of
   the build: section 7.2 does not print zero, it prints the question. */
function gapNote(ids){
  const list = (ids || []).map(id => appData.gaps.find(g => g.id === id)).filter(Boolean);
  if (!list.length) return '';
  return list.map(g => g.answer
    /* Answered by a person, so the section prints the answer — attributed and
       dated, because a reader is entitled to know it was supplied rather than
       found in the source document. */
    ? `<div class="d-ans">
        <b>${esc(g.where)} was blank in the source document. This was supplied.</b>
        ${esc(g.answer.text)}
        <span class="d-by">Answered by ${esc(g.answer.by)} on ${esc(g.answer.on)}${
          g.answer.source ? ' · source: ' + esc(g.answer.source) : ''}</span>
        <span class="d-gid">${esc(g.id)}</span></div>`
    : `<div class="d-gap">
        <b>Not reported — ${esc(g.where)} is blank in the source document.</b>
        ${esc(g.detail)}
        <span class="d-q">${esc(g.question)}</span>
        <span class="d-gid">${esc(g.id)}</span></div>`).join('');
}

const dTable = (head, rows, foot) => `<table class="d-tbl">
  <thead><tr>${head.map((h,i) => `<th${i?' class="n"':''}>${esc(h)}</th>`).join('')}</tr></thead>
  <tbody>${rows.map(r => `<tr>${r.map((c,i) =>
    `<td${i?' class="n"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody>
  ${foot ? `<tfoot><tr>${foot.map((c,i) =>
    `<th${i?' class="n"':''}>${c}</th>`).join('')}</tr></tfoot>` : ''}</table>`;

const dKv = rows => `<table class="d-kv"><tbody>${rows
  .map(([k,v]) => `<tr><th>${esc(k)}</th><td>${v}</td></tr>`).join('')}</tbody></table>`;

/* The four headline targets, each against the figure it was chosen over —
   because the denominator was a decision, and the reader is entitled to it. */
function blockHeadline(){
  const rows = [
    ['students',     'Children served',       calcStudents().total],
    ['schools',      'Partner schools',       calcSchools().total],
    ['stakeholders', 'Stakeholders in training', calcTraining().inTraining],
    ['countries',    'Partner countries',     appData.countries.length]
  ].map(([k, label, actual]) => {
    const p = calcTargetProgress(k, actual);
    const t = appData.targets[k];
    return [esc(label), num(actual), num(t.value), p.pct + '%',
      t.over.length ? `${p.pct}% of ${num(t.value)}; ${pct(actual, Math.max(...t.over))}% of ${
        num(Math.max(...t.over))}` : 'single source',
      esc(t.source)];
  });
  return dTable(['Result','Achieved','Target','Against target','Against the figure not chosen','Target from'], rows);
}

function blockFor(key, c){
  const S = calcStudents(), SC = calcSchools(), O = calcObservation(), L = calcLeaders(),
        TR = calcTraining(), CU = calcCulture(), FI = calcFinance(), F2 = calcFoL('R2'),
        F1 = calcFoL('R1'), RES = appData.config.resolution;

  switch (key){

    /* ── Annual M&E Report ─────────────────────────────────────────────── */
    case 'institution': return dKv([
      ['Institution', esc(appData.config.org.name)],
      ['Vision', esc(appData.config.org.vision)],
      ['Mission', esc(appData.config.org.mission)],
      ['Model', esc(appData.config.org.model)],
      ['Core values', appData.config.org.values.map(v => esc(v)).join(' · ')],
      ['Project', esc(appData.config.project.title) + ' · ' +
        fmtDate(appData.config.project.start) + ' to ' + fmtDate(appData.config.project.end)],
      ['Countries', appData.countries.map(x => esc(x.name)).join(' · ')]
    ]);

    case 'beneficiaries': {
      /* Sex is counted over the same population as the total beside it. The
         training register holds everyone enrolled; only those in training are
         reported here, so the split is taken over that subset and not over the
         whole register — otherwise the row's own three figures do not add up. */
      const inT = TR.list.filter(x => x.status !== 'Enrolled');
      const inTF = inT.filter(x => x.sex === 'F').length;
      const lF = appData.leaders.filter(x => x.sex === 'F').length;
      return dTable(
        ['Group','Total','Male','Female','Female share','Source'],
        [['Students', num(S.total), num(S.male), num(S.female), S.femaleShare + '%', 'School enrolment register'],
         ['Teachers', num(O.total), '—', '—', '—', 'Teacher register — sex not recorded'],
         ['School leaders', num(L.total), num(L.total - lF), num(lF),
          pct(lF, L.total) + '%', 'Leader register'],
         ['Stakeholders in training', num(inT.length),
          num(inT.length - inTF), num(inTF),
          pct(inTF, inT.length) + '%', 'Training register'],
         ['Employees', num(CU.staff), '—', '—', '—',
          'A §5.2 names seven; the register holds ' + CU.staff]])
      + `<p class="d-small">These groups are not added together. A teacher in the training register
         is also a teacher in the school register, and a school leader may appear in both — so a
         single "total reached" would count the same person two or three times. The one figure that
         can be stated without overlap is the ${num(S.total)} children enrolled.</p>`
      + gapNote(['G1']);
    }

    case 'objectives': return appData.plans.y2024.goals.map(g =>
        `<p class="d-quote">${esc(g.text)}<span>${esc(g.source)}</span></p>`).join('')
      + blockHeadline()
      + `<p class="d-small">The three goals above come from three different documents and are not
         versions of one another. The decision of ${fmtDate(RES.decidedOn)} applies to the figures,
         not to the goals: all three are carried, each against its own source.</p>`;

    case 'meteam': return dTable(['Person','Reports on','Frequency','Delivered by'],
      appData.dataPlan.map(d => [esc(d.who), esc(d.output), esc(d.freq),
        d.modeGap ? '<i>blank in the source</i>' : esc(d.mode)]))
      + gapNote(['G2']);

    case 'dataplan': return dTable(['Output','Data collected','Frequency','Packaged as','Who'],
      appData.dataPlan.map(d => [esc(d.output), esc(d.data), esc(d.freq), esc(d.pack), esc(d.who)]));

    case 'resources': return gapNote(['G3'])
      + `<p class="d-small">The only financial figures any source document gives are in A §5.2:
         ${usd(appData.targets.revenue.value)} total revenue and
         ${usd(appData.targets.perCountry.value)} per partner country. Against them,
         ${usd(FI.revenue.raised)} was raised (${FI.revenuePct}%) and
         ${FI.countriesMet} of ${FI.rows.length} country envelopes were met. No resource
         requirement is stated anywhere, so none is reported here.</p>`;

    case 'missing62': return gapNote(['G4']);

    case 'evalplan': return gapNote(['G5','G11'])
      + `<p class="d-small">What this system can supply for the ten empty columns, for every
         indicator that has a register behind it:</p>`
      + dTable(['Indicator','Level','Plan','Definition held?','Source','Baseline held','Target','Value'],
        calcAllIndicators().map(r => [esc(r.indicator.code), esc(r.indicator.level),
          esc(r.indicator.plan === 'y2024' ? '2024' : 'POOA v5'),
          r.indicator.computed ? 'yes — computed' : '<i>no register</i>',
          esc(r.indicator.source),
          /* Only two instruments were run twice, so only two indicators have a
             prior figure that can honestly serve as a baseline. Writing "first
             round" against the rest would be inventing one. */
          r.indicator.computed === 'obsIncrease'  ? O.before + ' (round 1)'
            : r.indicator.computed === 'folBenchmark' ? F1.benchmarkPct + '% (round 1)'
            : '<i>none recorded</i>',
          r.target === null ? '<i>none set</i>' : num(r.target),
          r.value === null ? '—' : num(r.value)]))
      + `<p class="d-small">Two of the thirteen have a prior figure behind them, because the
         classroom observation and the school self-study were each run twice. The other eleven have
         no baseline anywhere in this system or in the source documents, so the change since the
         start of the project cannot be stated for them — only the current level. That is what A
         §6.3 would have fixed.</p>`;

    case 'dataquality': return gapNote(['G6'])
      + `<p class="d-small">A §7.1 asks for three steps against each of validity, reliability,
         timeliness, precision and integrity. All fifteen cells are empty, and the indicator the
         plan covers is not named. The Data Quality Plan screen in this system sets out what each
         measure would have to say about the registers actually held.</p>`;

    case 'results': return dTable(
      ['Indicator','Plan','Target','Achieved','Against target','Status'],
      calcAllIndicators().map(r => [esc(r.indicator.code + ' — ' + r.indicator.text),
        esc(r.indicator.plan === 'y2024' ? '2024' : 'POOA v5'),
        r.target === null ? '<i>none</i>' : num(r.target) + (r.indicator.unit === 'percent' ? '%' : ''),
        r.value === null ? '<i>not computable</i>' : num(r.value) + (r.indicator.unit === 'percent' ? '%' : ''),
        r.pct === null ? '—' : r.pct + '%',
        `<span class="d-st ${r.status.tone}">${esc(r.status.label)}</span>`]))
      + gapNote(['G7']);

    case 'docplan': return gapNote(['G8'])
      + `<p class="d-small">Six documents are produced by this system — ${
         Object.values(appData.reportTemplates).map(t => esc(t.name)).join(', ')
         } — each with a reader and a frequency. A §7.3 would have said who authors and reviews
         them, and by when. It is empty, so this list is what the system does, not what the plan
         committed to.</p>`;

    case 'dissplan': return gapNote(['G9']);

    case 'conclusions': {
      const beh = calcAllIndicators().filter(r => r.status.key === 'behind');
      const blocked = calcAllIndicators().filter(r => r.blocked);
      return dKv([
        ['Reported against', `${calcAllIndicators().length} indicators from two plan generations`],
        ['Met or close', num(calcAllIndicators().filter(r => /met|near/.test(r.status.key)).length)],
        ['Behind', num(beh.length) + (beh.length ? ' — ' + beh.map(r => esc(r.indicator.code)).join(', ') : '')],
        ['Not computable at all', num(blocked.length) + (blocked.length
          ? ' — ' + blocked.map(r => esc(r.indicator.code)).join(', ') : '')],
        ['Sections of this report blocked by a blank',
         num(calcCompleteness('annual').blocked) + ' of ' + num(calcCompleteness('annual').total)],
        ['Gaps outstanding', num(appData.gaps.length) + ' — every one carried with its question']
      ]);
    }

    /* ── Shared project blocks ─────────────────────────────────────────── */
    case 'qSummary': return blockHeadline();

    case 'proj1': return dTable(['Output','Measure','This system holds'],
      [['6,898 children receive transformative education',
        'Enrolment across partner schools',
        `${num(S.total)} enrolled · ${num(S.male)} male, ${num(S.female)} female (${S.femaleShare}% female)`],
       ['Partner with 27 schools', 'The school register',
        `${num(SC.total)} — ${num(SC.primary)} primary, ${num(SC.secondary)} secondary`],
       ['95% daily attendance', 'Enrolment-weighted attendance', S.attendance + '%'],
       ['Retention', 'Enrolment-weighted', S.retention + '%'],
       ['Transition to secondary', 'Primary schools only', S.transition + '%'],
       ['Graduation', 'Secondary schools only', S.graduation + '%'],
       ['Move 2 countries into current partnership', 'The candidate register',
        `${appData.candidates.length} candidates named for 2 places`]]);

    case 'proj2': return dTable(['Output','Measure','This system holds'],
      [['Train 500 stakeholders', 'The training register',
        `${num(TR.inTraining)} in training of ${num(TR.total)} enrolled`],
       ['Teachers trained in Why/Play/Lead', 'The teacher register',
        `${num(O.trained)} of ${num(O.total)} (${pct(O.trained, O.total)}%)`],
       ['Improved instructional practice', 'Classroom observation, two rounds',
        `${O.before} to ${O.after} — a ${O.increase}% increase`],
       ['Transformational leadership', 'OC2, all four indicators',
        `${num(L.consistent)} of ${num(L.total)} leaders (${L.consistentPct}%)`],
       ['Certification', 'The training register',
        `${num(TR.certificates)} of ${num(TR.total)} (${pct(TR.certificates, TR.total)}%)`],
       ['Post-training mentoring', 'The training register',
        `${num(TR.mentored)} of ${num(TR.total)} (${pct(TR.mentored, TR.total)}%)`]]);

    case 'proj3': return dTable(['Practice','Employees','Share'],
      [['Trained in team culture and core values', num(CU.trainedCulture), pct(CU.trainedCulture, CU.staff) + '%'],
       ['Personal rule of life written', num(CU.ruleOfLife), pct(CU.ruleOfLife, CU.staff) + '%'],
       ['Completed Lead with Prayer', num(CU.readLeadWithPrayer), pct(CU.readLeadWithPrayer, CU.staff) + '%'],
       ['Posting on the ECO App daily', num(CU.ecoAppDaily), pct(CU.ecoAppDaily, CU.staff) + '%'],
       ['Prayer map completed', num(CU.prayerMap), pct(CU.prayerMap, CU.staff) + '%'],
       ['<b>All three — culture, rule of life and daily prayer</b>',
        '<b>' + num(Math.round(CU.pctAll * CU.staff / 100)) + '</b>', '<b>' + CU.pctAll + '%</b>']])
      + `<p class="d-small">The objective says <i>all</i> employees, so the target is 100% and this
         reads ${esc(calcIndicator('P3-1').status.label.toLowerCase())}. The practices are what the
         system can observe — attendance, a book delivered, an app account posting. Whether a rule
         of life is being lived is not observable from here.</p>`
      + gapNote(['G10']);

    case 'indMatrix': return dTable(['Code','Indicator','Plan','Target','Value','Status'],
      calcAllIndicators().map(r => [esc(r.indicator.code), esc(r.indicator.text),
        esc(r.indicator.plan === 'y2024' ? '2024' : 'POOA v5'),
        r.target === null ? '<i>none set</i>' : num(r.target),
        r.value === null ? '<i>not computable</i>' : num(r.value),
        `<span class="d-st ${r.status.tone}">${esc(r.status.label)}</span>`]));

    case 'qIssues': return dTable(['Item','What it is','What it holds up'],
      appData.gaps.map(g => [esc(g.id), esc(g.where) + ' — ' + esc(g.what),
        g.blocks.map(b => esc(b)).join('; ')]))
      + `<p class="d-small">Decisions taken: ${appData.decisionLog.length
         ? appData.decisionLog.map(d => esc(d.id)).join(', ')
         : 'the five of ' + fmtDate(RES.decidedOn) + ', recorded against ' + esc(RES.decidedBy)}.</p>`;

    /* ── Country Report ────────────────────────────────────────────────── */
    case 'cContext': return dKv([
      ['Country', esc(c.country.name)],
      ['Partnership status', esc(c.country.status) + ' since ' + esc(c.country.joined)],
      ['Coordinator', c.country.coordinator ? esc(c.country.coordinator)
        : '<i>none named in any source document</i>'],
      ['Context', esc(c.country.context)]
    ]) + (c.country.openQuestion
      ? `<div class="d-gap"><b>An open question about this country.</b>
          ${esc(c.country.openQuestion)}
          <span class="d-q">Which figure is right, and who confirms it?</span></div>` : '');

    case 'cSchools': return c.schools.length
      ? dTable(['School','Level','Enrolled','Teachers','Self-study stage'],
          c.schools.map(s => {
            const f = folFor(s.code);
            return [esc(s.name || s.code), esc(s.level), num(s.enrolledM + s.enrolledF),
              num(s.teachers),
              f ? esc(f.stage) + ' (' + f.mean + ')' : '<i>' + esc(NOT_ASSESSED) + '</i>'];
          }),
          ['Total', '', num(c.students.total), num(c.teachers.length), ''])
      : `<p class="d-small">No partner school is recorded in this country. B row 1 names it a
         current partner country; B Output 2 allocates it no school. Both statements are carried
         as they are.</p>`;

    case 'cStudents': return !c.schools.length
      ? `<p class="d-small">No children are enrolled through this country, because no partner
         school is registered in it. This is a zero with a reason behind it, not a missing
         figure.</p>` + gapNote(['G1'])
      : c.students.total
      ? dKv([
          ['Enrolled', num(c.students.total) + ` — ${num(c.students.male)} male, ${
            num(c.students.female)} female (${c.students.femaleShare}% female)`],
          ['Attendance', c.students.attendance + '%'],
          ['Retention', c.students.retention + '%'],
          ['Capacity', num(c.students.capacity) + ' places · ' +
            pct(c.students.total, c.students.capacity) + '% filled']
        ]) + gapNote(['G1'])
      : gapNote(['G1']);

    case 'cPeople': return dKv([
      ['Teachers', num(c.teachers.length) + ' · ' + num(c.teachersTrained) +
        ' trained in Why/Play/Lead (' + pct(c.teachersTrained, c.teachers.length) + '%)'],
      ['School leaders', num(c.leaders.length) + ' · ' + num(c.leadersConsistent) +
        ' applying all four OC2 indicators'],
      ['Stakeholders', num(c.stakeholders.length) + ' enrolled · ' + num(c.inTraining) + ' in training']
    ]);

    case 'cQuality': return c.fol.length
      ? dKv([
          ['Schools assessed', num(c.fol.length)],
          ['Mean score', c.folMean + ' of 4'],
          ['At the Intermediate benchmark or above', num(c.folAtBenchmark) + ' of ' + num(c.fol.length)],
          ['Most common priority', (() => {
            const by = {};
            c.fol.forEach(r => r.priorities.forEach(p => by[p.label] = (by[p.label]||0)+1));
            const top = Object.entries(by).sort((a,b) => b[1]-a[1])[0];
            return top ? esc(top[0]) + ' (' + top[1] + ' schools)' : '—';
          })()]
        ])
      : '<p class="d-small">No self-study has been run here, because no school is registered.</p>';

    case 'cFunding': return dKv([
      ['Raised', usd(c.money.raised)],
      ['Envelope', usd(c.money.target) + ' — A §5.2'],
      ['Against it', c.moneyPct + '%' + (c.money.raised >= c.money.target ? ' — met' : '')],
      ['Budget', '<i>no logframe carries a budget line for this country, or any other</i>']
    ]);

    case 'cNext': {
      const by = {};
      c.fol.forEach(r => r.priorities.forEach(p => by[p.label] = (by[p.label]||0)+1));
      const rows = Object.entries(by).sort((a,b) => b[1]-a[1])
        .map(([label, n]) => [esc(label), num(n) + ' of ' + num(c.fol.length) + ' schools']);
      return rows.length ? dTable(['Priority from the improvement plans','Schools naming it'], rows)
        : '<p class="d-small">No improvement plan exists here, because no school is registered.</p>';
    }

    /* ── School Self-Study ─────────────────────────────────────────────── */
    case 'sProfile': return dKv([
      ['School', esc(c.school.name || c.school.code)],
      ['Code', '<span class="mono">' + esc(c.school.code) + '</span>'],
      ['Country', esc(c.school.country)],
      ['Level', esc(c.school.level)],
      ['Partnership since', esc(c.school.joined)],
      ['Enrolled', num(c.school.enrolledM + c.school.enrolledF) + ` — ${num(c.school.enrolledM)} male, ${
        num(c.school.enrolledF)} female`],
      ['Capacity', num(c.school.capacity) + ' places'],
      ['Teachers', num(c.school.teachers) + ' · ' + num(c.schoolTeachersTrained) + ' trained'],
      ['Attendance', c.school.attendance + '%'],
      ['Retention', c.school.retention + '%']
    ]) + (c.school.name ? '' : `<p class="d-small">This school has no name in any source document,
      so it is carried by its register code. Six schools are named in A and B; the rest are not.</p>`);

    case 'sDomains': return dTable(['Domain','Round 1','Round 2','Movement','Benchmark'],
      appData.selfStudy.domains.map(d => {
        const a = c.r1.scores[d.key], b = c.r2.scores[d.key];
        const g = Math.round((b - a) * 100) / 100;
        return [esc(d.label), a, b,
          (g > 0 ? '+' : '') + g,
          b >= appData.selfStudy.benchmark ? 'met' : '<i>below</i>'];
      }),
      ['Mean', c.r1.mean, c.r2.mean,
       (c.r2.mean - c.r1.mean > 0 ? '+' : '') + Math.round((c.r2.mean - c.r1.mean) * 100) / 100, '']);

    case 'sStage': return dKv([
      ['Round 1', esc(c.r1.stage) + ' — mean ' + c.r1.mean],
      ['Round 2', esc(c.r2.stage) + ' — mean ' + c.r2.mean],
      ['Movement', c.r1.stage === c.r2.stage
        ? 'No change of stage. The mean moved ' +
          (c.r2.mean - c.r1.mean > 0 ? '+' : '') + Math.round((c.r2.mean - c.r1.mean)*100)/100 + '.'
        : esc(c.r1.stage) + ' to ' + esc(c.r2.stage)],
      ['Benchmark', c.r2.mean >= appData.selfStudy.benchmark
        ? 'At ' + esc(appData.selfStudy.benchmarkLabel) + ' or above'
        : 'Below the ' + esc(appData.selfStudy.benchmarkLabel) + ' benchmark of ' +
          appData.selfStudy.benchmark]
    ]) + `<p class="d-small">The four stages — ${appData.selfStudy.stages.join(', ')} — are named in
      POOA v5. The score bands between them are this system's, applied the same way to every
      school so that movement means the same thing everywhere.</p>`;

    case 'sPriorities': {
      const ranked = appData.selfStudy.domains.slice()
        .sort((a,b) => c.r2.scores[a.key] - c.r2.scores[b.key]);
      const ord = ['lowest','second lowest','third lowest'];
      return dTable(['Priority','Round 1','Round 2','Movement','Why this one'],
        c.r2.priorities.map(p => {
          const i = ranked.findIndex(d => d.key === p.domain);
          const was = c.r1.scores[p.domain];
          const g = Math.round((p.score - was) * 100) / 100;
          return [esc(p.label), was, p.score, (g > 0 ? '+' : '') + g,
            `The ${ord[i] || 'lowest'} of ${appData.selfStudy.domains.length} domains in this
             school's own round 2 assessment, ${Math.round(
               (appData.selfStudy.benchmark - p.score) * 100) / 100} below the benchmark of
             ${appData.selfStudy.benchmark}.`];
        }))
      + `<p class="d-small">AC3 asks each school for a prioritised plan. These two are the
         school's own lowest-scoring domains, taken from its own assessment — not a ranking
         imposed from outside it.</p>`;
    }

    case 'sTeaching': {
      const ts = appData.teachers.filter(t => t.school === c.school.code);
      const mb = Math.round(ts.reduce((x,y) => x + y.meanBefore, 0) / ts.length * 100) / 100;
      const ma = Math.round(ts.reduce((x,y) => x + y.meanAfter, 0) / ts.length * 100) / 100;
      return dKv([
        ['Teachers observed', num(ts.length) + ' — twice each'],
        ['Trained in Why/Play/Lead', num(ts.filter(t => t.trained).length) + ' of ' + num(ts.length)],
        ['Mean practice score', mb + ' to ' + ma +
          ' — a ' + Math.round((ma - mb) / mb * 1000) / 10 + '% increase'],
        ['Consistently applying', num(ts.filter(t => t.meanAfter >= 3).length) + ' of ' + num(ts.length) +
          ' at a mean of 3 or above']
      ]) + dTable(['Observation domain','Before','After'],
        OBS_DOMAINS.map(d => [esc(d.label),
          Math.round(ts.reduce((x,y) => x + y.obsBefore[d.key], 0) / ts.length * 100) / 100,
          Math.round(ts.reduce((x,y) => x + y.obsAfter[d.key], 0) / ts.length * 100) / 100]));
    }

    case 'sAgree': return dKv([
      ['Facilitated by', esc(currentUser.name) + ' · ' + esc(currentUser.title)],
      ['Round', esc(c.r2.round === 'R2' ? appData.selfStudy.rounds[1].label
        : appData.selfStudy.rounds[0].label)],
      ['Next round', 'Not scheduled in any source document']
    ]);

    /* ── Donor update ──────────────────────────────────────────────────── */
    case 'dHeadline': return blockHeadline()
      + `<p class="d-small">Where two source documents gave different targets, the higher was
         adopted on ${fmtDate(RES.decidedOn)} by ${esc(RES.decidedBy)}. Every percentage above is
         measured against that choice, and the figure not chosen is shown beside it so the
         denominator is never hidden.</p>`;

    case 'dNetwork': return dTable(
      ['Country','Schools','Children','Teachers','Raised into this country'],
      appData.countries.map(x => {
        const k = calcCountry(x.code);
        return [esc(x.name), num(k.schools.length), num(k.students.total),
          num(k.teachers.length), usd(k.money.raised)];
      }),
      ['Total', num(SC.total), num(S.total), num(O.total), usd(appData.finance.countryRaised)])
      + `<p class="d-small">The last column is the country envelope A §5.2 asks about —
         ${usd(appData.targets.perCountry.value)} per partner country — and not all revenue.
         ${usd(FI.revenue.raised)} was raised in total, of which
         ${usd(appData.finance.countryRaised)} is accounted for country by country here. Where the
         remaining ${usd(FI.revenue.raised - appData.finance.countryRaised)} was spent is not
         something any source document records.</p>`;

    case 'dClassroom': return dTable(['What was observed','Round 1','Round 2','Change'],
      OBS_DOMAINS.map(d => [esc(d.label), O.domains[d.key].before, O.domains[d.key].after,
        '+' + Math.round((O.domains[d.key].after - O.domains[d.key].before) * 100) / 100]),
      ['Mean across all five', O.before, O.after, '+' + O.increase + '%'])
      + (() => { const e = calcTrainingEffect(); return `<p class="d-small">Teachers who had the
         training gained ${e.trained.gain} on the instrument; those who did not gained
         ${e.untrained.gain} — a difference of ${e.difference}. The comparison is between
         ${num(e.trained.n)} trained and ${num(e.untrained.n)} untrained teachers on the same
         instrument, which is the strongest statement this data supports. It is not a controlled
         trial, and the two groups were not assigned at random.</p>`; })();

    case 'dSchools': return dTable(['Self-study stage','Round 1','Round 2'],
      appData.selfStudy.stages.map(st => [esc(st), num(F1.byStage[st]), num(F2.byStage[st])]),
      ['At the benchmark or above', num(F1.atBenchmark) + ' (' + F1.benchmarkPct + '%)',
       num(F2.atBenchmark) + ' (' + F2.benchmarkPct + '%)'])
      + `<p class="d-small">${num(calcFolMovement().filter(m => m.crossed).length)} schools crossed
         the Intermediate benchmark between the two rounds. None moved backwards.</p>`;

    case 'dFunding': return dKv([
      ['Raised', usd(FI.revenue.raised) + ' of ' + usd(FI.revenue.target) + ` (${FI.revenuePct}%)`],
      ['Into country envelopes', usd(appData.finance.countryRaised) + ' · ' +
        num(FI.countriesMet) + ' of ' + num(FI.rows.length) + ' met their ' +
        usd(appData.targets.perCountry.value)],
      ['Budget', '<i>' + esc(appData.finance.note) + '</i>']
    ]);

    case 'dPhotos': return `<div class="d-gap"><b>This section is deliberately empty.</b>
      These are children affected by armed conflict, persecution and displacement. No photograph
      and no child's story appears in any report this system generates, and no child's name is
      held anywhere in it. Every figure above is a count.
      <span class="d-q">If photographs are to be used, who holds the consent, and from whom?</span>
      </div>`;

    case 'dOpen': return dTable(['What we do not yet know','Where','What it holds up'],
      appData.gaps.map(g => [esc(g.question), esc(g.where), g.blocks.map(b => esc(b)).join('; ')]));

    /* ── Board report ─────────────────────────────────────────────────── */
    case 'bSummary': return blockHeadline() + dKv([
      ['Indicators reported', num(calcAllIndicators().length) + ' across two plan generations'],
      ['Met or close', num(calcAllIndicators().filter(r => /met|near/.test(r.status.key)).length)],
      ['Not computable from anything held', num(calcAllIndicators().filter(r => r.blocked).length)],
      ['School quality', num(F2.atBenchmark) + ' of ' + num(F2.records.length) +
        ' schools at the Intermediate benchmark (' + F2.benchmarkPct + '%)'],
      ['Teaching practice', O.before + ' to ' + O.after + ' — a ' + O.increase + '% increase'],
      ['Funding', usd(FI.revenue.raised) + ' of ' + usd(FI.revenue.target) + ` (${FI.revenuePct}%)`],
      ['Open gaps in the plan', num(appData.gaps.length)]
    ]);

    case 'bPlan': return dTable(['#','What differed','Values found','In force','Decided by'],
      appData.reconciliation.map(r => [esc(r.id), esc(r.topic),
        r.quotes.map(q => esc(String(q.value === undefined ? q.src : q.value))).join(' · '),
        r.decision ? esc(String(r.decision.value)) : '<i>open</i>',
        r.decision ? esc(r.decision.by) + ', ' + fmtDate(r.decision.on) : '—']))
      + `<p class="d-small">The rule applied on ${fmtDate(RES.decidedOn)} was:
         ${esc(RES.rule)}. Taking the highest figure makes every target the most ambitious
         available, so achievement reads lower than it would against the other documents — the same
         delivery against a longer ruler. The board set the denominator when it set the rule.</p>`;

    case 'bFinance': return dKv([
      ['Revenue', usd(FI.revenue.raised) + ' of ' + usd(FI.revenue.target) + ` (${FI.revenuePct}%)`],
      ['Country envelopes', num(FI.countriesMet) + ' of ' + num(FI.rows.length) + ' met'],
      ['Shortfall against target', usd(FI.revenue.target - FI.revenue.raised)]
    ]) + gapNote(['G3']);

    case 'bAsks': return dTable(['The board is asked to','Because','This unblocks'],
      appData.gaps.map(g => [esc(g.question), esc(g.where) + ' is blank',
        g.blocks.map(b => esc(b)).join('; ')]))
      + `<p class="d-small">None of these is a figure this system can supply. Each is a decision or
         a record that only B2THEWORLD holds. Until they arrive the sections they block print this
         question rather than a zero.</p>`;

    default: return '';
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   6u. REPORT GENERATION — narrative, header and the document
   The narrative is drafted from the same figures as the block above it and is
   labelled a draft on the page and in the print. It states nothing the
   registers do not hold, and where a gap blocks the section it says so rather
   than writing around it.
   ═══════════════════════════════════════════════════════════════════════════ */
function draftSection(t, s, c){
  const S = calcStudents(), SC = calcSchools(), O = calcObservation(), L = calcLeaders(),
        TR = calcTraining(), CU = calcCulture(), FI = calcFinance(), F2 = calcFoL('R2'),
        F1 = calcFoL('R1'), RES = appData.config.resolution;
  const P = txt => `<p>${txt}</p>`;

  switch (s.block){
    case 'beneficiaries': return P(`Across ${num(SC.total)} partner schools in
      ${num(appData.countries.filter(x => x.schools).length)} countries, ${num(S.total)} children
      were enrolled over the year — ${S.femaleShare}% of them girls. Attendance ran at
      ${S.attendance}% against the goal of ${appData.targets.attendance.value}%, and retention at
      ${S.retention}%. The sex split above is computed from the enrolment register; it is not the
      one A §2.2 asked for, which was never filled in.`);

    case 'objectives': return P(`Three source documents state three different goals, and they are
      not three sizes of one goal. A §2.5 lists six goals about infrastructure, schools, enrolment,
      university entry and the capacity of teachers and leaders. B §6.1 states one goal about
      attendance and literacy. POOA v5 frames a third about continuity, well-being, resilience and
      opportunity, with no figures at all. All three are carried. Where a goal carries a number the
      most demanding was adopted on ${fmtDate(RES.decidedOn)}, which is why attendance is measured
      against ${appData.targets.attendance.value}% and not against a softer figure.`);

    case 'results': { const beh = calcAllIndicators().filter(r => r.status.key === 'behind');
      return P(`Of ${num(calcAllIndicators().length)} indicators,
      ${num(calcAllIndicators().filter(r => /met|near/.test(r.status.key)).length)} were met or
      close and ${num(beh.length)} were behind${beh.length ? ' — ' +
      beh.map(r => r.indicator.code).join(', ') : ''}.
      ${num(calcAllIndicators().filter(r => r.blocked).length)} cannot be computed from anything
      this system holds and report nothing rather than zero. A §7.2 itself is empty, so the table
      above is the register's answer to a question the plan never wrote down.`); }

    case 'conclusions': return P(`The year's delivery is real and measurable: ${num(S.total)}
      children in ${num(SC.total)} schools, teaching practice up ${O.increase}% on the same
      instrument across two rounds, and ${F2.benchmarkPct}% of schools now at the Intermediate
      benchmark against ${F1.benchmarkPct}% at the first self-study. What is not solid is the plan
      around it. ${num(appData.gaps.length)} sections of the M&E template are blank, including the
      performance evaluation plan, the data quality plan and the performance results report — the
      three places a reader would look to check any of these numbers. The recommendation is
      narrow and practical: fill A §6.3 and §7.1 first, because every other blank is downstream
      of those two.`);

    case 'qSummary': return P(`Against the targets adopted on ${fmtDate(RES.decidedOn)}:
      ${num(S.total)} children of ${num(appData.targets.students.value)},
      ${num(SC.total)} schools of ${num(appData.targets.schools.value)},
      ${num(TR.inTraining)} stakeholders in training of ${num(appData.targets.stakeholders.value)},
      and ${num(appData.countries.length)} partner countries. The school and country targets are
      met; the student and stakeholder targets are not, and would read very differently against the
      lower figures the other documents state — which is exactly why both are shown.`);

    case 'proj1': return P(`Project 1 asks for children in schools. ${num(S.total)} were enrolled
      across ${num(SC.total)} schools — ${num(SC.primary)} primary and ${num(SC.secondary)}
      secondary — against an output written for 6,898. Attendance was ${S.attendance}%, retention
      ${S.retention}%, transition to secondary ${S.transition}% and graduation ${S.graduation}%.
      The two countries to be moved into current partnership have
      ${appData.candidates.length} candidates named between them, which is more names than places.`);

    case 'proj2': return P(`${num(O.trained)} of ${num(O.total)} teachers
      (${pct(O.trained, O.total)}%) have been trained in Why/Play/Lead, and observed practice rose
      from ${O.before} to ${O.after} — a ${O.increase}% increase, which is the figure OC1 asks for.
      ${num(L.consistent)} of ${num(L.total)} school leaders apply all four transformational
      leadership indicators. On the stakeholder count, ${num(TR.inTraining)} are in training of
      ${num(TR.total)} enrolled, with ${num(TR.certificates)} certificated and
      ${num(TR.mentored)} receiving post-training mentoring.`);

    case 'proj3': return P(`${CU.pctAll}% of ${num(CU.staff)} employees are doing all three of the
      things this project asks for together — culture training, a written rule of life and daily
      prayer practice. The individual practices run higher: ${pct(CU.trainedCulture, CU.staff)}%
      trained, ${pct(CU.ruleOfLife, CU.staff)}% with a rule of life written. The objective says
      <i>all</i> employees, so the target is 100% and this reads
      ${calcIndicator('P3-1').status.label.toLowerCase()}. It should be said plainly that these
      are observable proxies — a session attended, a book delivered, an app account posting. B
      rows 67 and 72 to 79 give no means of verification for most of this project, so no stronger
      claim is available.`);

    case 'cContext': return P(`${esc(c.country.name)} has been a partner country since
      ${esc(c.country.joined)} and holds ${num(c.schools.length)} partner
      school${c.schools.length === 1 ? '' : 's'} with ${num(c.students.total)} children enrolled.
      ${c.country.coordinator ? esc(c.country.coordinator) + ' coordinates the country.'
        : 'No coordinator is named for it in any source document, which matters because A §5.2 '
          + 'makes the country coordinator the person who reports most of these figures.'}`);

    case 'cQuality': return c.fol.length
      ? P(`${num(c.folAtBenchmark)} of ${num(c.fol.length)} schools here are at the Intermediate
        benchmark or above, with a mean self-study score of ${c.folMean} out of 4. The priorities
        the schools set for themselves are listed in section 7; they are the lowest two domains in
        each school's own assessment, not a judgement made from outside it.`)
      : null;

    case 'cFunding': return P(`${usd(c.money.raised)} was raised against the
      ${usd(c.money.target)} envelope A §5.2 sets for each partner country — ${c.moneyPct}%.
      There is nothing to compare spending against: no logframe carries a budget line for any
      country, so this figure is money in, not money used.`);

    case 'sStage': return P(`${esc(c.school.name || c.school.code)} scored ${c.r2.mean} out of 4 at
      the second self-study, placing it at ${esc(c.r2.stage)}${
      c.r1.stage === c.r2.stage ? ', the same stage as the first round'
        : `, up from ${esc(c.r1.stage)}`}. ${c.r2.mean >= appData.selfStudy.benchmark
        ? 'It is at or above the Intermediate benchmark POOA v5 sets for a member school.'
        : 'It is below the Intermediate benchmark, which is what section 4 is for.'}`);

    case 'sPriorities': return P(`The school's own two priorities for the coming year are
      ${c.r2.priorities.map(p => esc(p.label.toLowerCase())).join(' and ')}. They are the
      lowest-scoring domains in its own self-study, which is how AC3 asks for a plan to be set —
      by the school, from its own assessment, rather than handed to it.`);

    case 'dHeadline': return P(`Over the project year to ${fmtDate(appData.config.project.end)},
      ${num(S.total)} children were enrolled in ${num(SC.total)} partner schools across
      ${num(appData.countries.length)} countries. ${num(O.trained)} teachers have been trained and
      observed teaching practice rose ${O.increase}%. ${num(F2.atBenchmark)} schools now meet the
      Intermediate benchmark on the Fullness of Life Framework, up from ${num(F1.atBenchmark)}.
      ${usd(FI.revenue.raised)} was raised of a ${usd(FI.revenue.target)} target.`);

    case 'dClassroom': return P(`Every teacher on the register was observed twice on the same
      five-domain instrument, before and after training. The mean rose from ${O.before} to
      ${O.after}. The largest movement was in ${(() => {
        const best = OBS_DOMAINS.slice().sort((a,b) =>
          (O.domains[b.key].after - O.domains[b.key].before) -
          (O.domains[a.key].after - O.domains[a.key].before))[0];
        return esc(best.label.toLowerCase());
      })()}. Observation is the softest data in this report: it is a judgement, recorded by someone
      who knows the teacher, and this system does not record who made it.`);

    case 'dSchools': return P(`${F2.benchmarkPct}% of schools are now at the Intermediate benchmark
      or above, against ${F1.benchmarkPct}% at the first round.
      ${num(calcFolMovement().filter(m => m.crossed).length)} schools crossed it in the year and
      none fell back. These are the schools' own assessments of themselves, scored against the
      Fullness of Life Framework; POOA v5 sets no target against them, so this is a level reported,
      not progress against a plan.`);

    case 'bSummary': return P(`The programme delivered: ${num(S.total)} children,
      ${num(SC.total)} schools, ${num(TR.inTraining)} stakeholders in training, teaching practice
      up ${O.increase}%, and ${F2.benchmarkPct}% of schools at the Intermediate benchmark. The
      board should know two things about how those figures read. First, the targets they are
      measured against were chosen on ${fmtDate(RES.decidedOn)} by taking the highest figure any
      document stated, which makes every percentage lower than it would otherwise be. Second,
      ${num(appData.gaps.length)} sections of the M&E plan are blank, and they hold up sections
      of ${num(Object.keys(calcGapsByDocument()).length)} of this organisation's documents —
      including the performance results report, which is the one a reader turns to first.`);

    case 'bPlan': return P(`Three source documents disagree in nine places and leave eleven
      sections blank. The system does not hide this and does not resolve it in code: every
      difference is quoted from both sides, and the decision taken on ${fmtDate(RES.decidedOn)} is
      recorded against ${esc(RES.decidedBy)} and can be changed on one screen, which moves every
      dependent figure with it. What remains outstanding is not arithmetic — it is
      ${num(appData.gaps.length)} decisions and records only B2THEWORLD holds.`);

    case 'bAsks': return P(`The asks below are not requests for money or for effort. Each is a
      sentence or a table that exists somewhere in the organisation and is not yet in the plan.
      Two of them — the performance evaluation plan at A §6.3 and the data quality plan at A §7.1 —
      unblock most of the rest, because the others describe how those two would be reported.`);

    default: return null;
  }
}

/* Header values are dotted paths into a scope built per report, so a template
   can name any field without a lookup table to keep in step. A path that does
   not resolve prints as a dash, never as its own source. */
function reportHeaderValue(path, c){
  const v = String(path).split('.').reduce((o,k) => (o == null ? undefined : o[k]), c.scope);
  if (v === undefined || v === null || v === '') return '—';
  return /^\d{4}-\d{2}-\d{2}$/.test(String(v)) ? fmtDate(v) : String(v);
}

/* The context a report is generated against: the period, the subject (a
   country or a school, where the report has one) and the scope the header
   resolves its paths in. */
function reportCtx(templateId, periodId, metaCode){
  const t = appData.reportTemplates[templateId];
  const period = appData.periods.find(p => p.id === periodId) || currentPeriod;
  const c = {template:t, period, author:currentUser.name + ' · ' + currentUser.title};

  if (t.scope === 'country'){
    const code = metaCode || appData.countries[0].code;
    Object.assign(c, calcCountry(code));
  }
  if (t.scope === 'school'){
    const code = metaCode || appData.schools[0].code;
    c.school = appData.schools.find(s => s.code === code) || appData.schools[0];
    c.r1 = folFor(c.school.code, 'R1');
    c.r2 = folFor(c.school.code, 'R2');
    /* A school with no self-study has no document to produce. Saying so is the
       report; a template filled with dashes would look like a finished one. */
    c.unassessed = !c.r2;
    c.schoolTeachersTrained = appData.teachers
      .filter(x => x.school === c.school.code && x.trained).length;
  }

  c.scope = {
    org: appData.config.org,
    project: appData.config.project,
    period, author: c.author,
    planLabel: appData.plans.y2024.label + ' for targets · ' +
      appData.plans.pooa5.label + ' as the theory of change',
    countryList: appData.countries.map(x => x.name).join(', '),
    studentsLabel: num(calcStudents().total),
    country: c.country,
    school: c.school ? Object.assign({}, c.school, {
      name: c.school.name || c.school.code,
      studentsLabel: num(c.school.enrolledM + c.school.enrolledF) + ' children'
    }) : null,
    roundLabel: c.r2 ? appData.selfStudy.rounds[1].label : null
  };
  return c;
}

/* generateReport(templateId, periodId, metaCode) → the document body. */
function generateReport(templateId, periodId, metaCode){
  const t = appData.reportTemplates[templateId];
  if (!t) return '<p>Unknown report.</p>';
  const c = reportCtx(templateId, periodId, metaCode);

  const header = `<table class="d-hdr"><tbody>${(t.header || []).map(h =>
    `<tr><th>${esc(h.label)}</th><td>${esc(reportHeaderValue(h.path, c))}</td></tr>`)
    .join('')}</tbody></table>`;

  if (c.unassessed){
    return `<h1>${esc(t.docTitle)}</h1>
      <div class="d-sub">${esc(appData.config.org.name)} · ${esc(c.period.label)}</div>
      ${header}
      <div class="d-gap"><b>There is no self-study to report for
        ${esc(c.school.name || c.school.code)}.</b>
        The school is on the partner register and has an enrolment, teachers and outcome rates —
        but it has never assessed itself against the Fullness of Life Framework, so it has no
        domain scores, no stage and no improvement priorities.
        <span class="d-q">Run the self-study with the school, then generate this again. Nothing
        here can be filled in on its behalf.</span></div>
      <div class="d-foot"><span>${esc(appData.config.org.name)}</span>
        <span>Generated ${fmtDate(appData.config.today)} from Eval360</span></div>`;
  }

  const body = t.sections.map(s => {
    const H = s.no && s.no.includes('.') ? 'h3' : 'h2';
    const block = s.block ? blockFor(s.block, c) : '';
    const narr  = s.block ? draftSection(t, s, c) : null;
    return `<div class="d-sec">
      <${H}>${esc((s.no ? s.no + '. ' : '') + s.title)}</${H}>
      ${reportState.showSources && s.source
        ? `<p class="d-src"><i class="bi bi-link-45deg"></i>${esc(s.source)}</p>` : ''}
      ${narr ? `<div class="d-draft"><span class="d-tag"><i class="bi bi-stars"></i>
          Drafted from the figures — review before submitting</span>${narr}</div>` : ''}
      ${block}
    </div>`;
  }).join('');

  /* The registers hold a position, not a time series: a school's enrolment,
     a teacher's two observation rounds, money raised to date. Nothing is
     stamped with the quarter it happened in. A quarterly document therefore
     carries cumulative figures, and says so at the top rather than implying a
     quarterly split this system cannot produce. */
  const cumNote = t.frequency === 'quarterly'
    ? `<div class="d-gap"><b>These figures are cumulative to the end of the project year, not
        for this quarter alone.</b> The registers behind them record a current position — an
        enrolment, an observation round, money raised to date — and are not stamped with the
        quarter in which each change happened.
        <span class="d-q">Should the registers carry a date per change, so a quarter can be
        reported on its own?</span></div>`
    : '';

  return `<h1>${esc(t.docTitle)}</h1>
    <div class="d-sub">${esc(appData.config.org.name)} · ${esc(c.period.label)}</div>
    ${header}${cumNote}${body}
    <div class="d-sig">
      <div>${esc(currentUser.name)}<br><span>${esc(currentUser.title)} · author</span></div>
      ${(() => {
        /* A document signed off by the person who wrote it has not been
           reviewed, and saying so is more use to a board than printing the
           same name twice. */
        const appr = appData.users.find(u => u.role === 'Director' && u.id !== currentUser.id)
                  || appData.users.find(u => u.role === 'MEAL' && u.id !== currentUser.id);
        return appr
          ? `<div>${esc(appr.name)}<br><span>${esc(appr.title)} · to approve</span></div>`
          : `<div><span style="font-style:italic">Not yet reviewed by anyone other than the
              author — ${esc(currentUser.title)} both prepared and signed this.</span></div>`;
      })()}
    </div>
    <div class="d-foot"><span>${esc(appData.config.org.name)} ·
      ${esc(appData.config.project.title)}</span>
      <span>Generated ${fmtDate(appData.config.today)} from Eval360 ·
      every figure traced to a register</span></div>`;
}

function reportBodyHTML(){

function reportTitle(){
  const o = reportState.open;
  if (!o) return 'Report';
  const t = appData.reportTemplates[o.id];
  let s = t.name;
  if (o.subject){
    const n = appData.countries.find(x => x.code === o.subject)
           || appData.schools.find(x => x.code === o.subject);
    if (n) s += ' — ' + (n.name || n.code);
  }
  return s;
}
function openBlob(html, filename){
  const blob = new Blob([html], {type: filename ? 'application/msword' : 'text/html; charset=utf-8'});
  const url = URL.createObjectURL(blob);
  if (filename){
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  }
  const w = window.open(url, '_blank');
  if (!w){ toast('Pop-up blocked. Allow pop-ups for this page to preview the document.', 'warn');
           return false; }
  return true;
}
function reportPrint(){
  if (openBlob(docHTML(reportTitle(), reportBodyHTML(), false)))
    toast('Opened in a new tab. Use <strong>Print / Save as PDF</strong> there.', 'ok');
}
function reportDoc(){
  const name = reportTitle().replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'');
  openBlob(docHTML(reportTitle(), reportBodyHTML(), true), name + '.doc');
  toast('Downloaded as a Word document — the on-screen controls are stripped out.', 'ok');
}
/* CSV from the tables actually in the document, so the export can never carry
   a column the reader did not see. */
function reportCsv(){
  const el = document.getElementById('doc');
  if (!el){ toast('Nothing to export yet.', 'warn'); return; }
  const q = (sel, root) => Array.prototype.slice.call((root || el).querySelectorAll(sel));
  const lines = [];
  lines.push(['Report', reportTitle()]);
  lines.push(['Organisation', appData.config.org.name]);
  lines.push(['Generated', appData.config.today]);
  lines.push([]);
  q('.d-sec').forEach(sec => {
    const h = sec.querySelector('h2, h3');
    const tables = q('table', sec);
    if (!tables.length) return;
    lines.push([h ? h.textContent.trim() : '']);
    tables.forEach(tb => {
      q('tr', tb).forEach(tr => lines.push(q('th, td', tr).map(c => c.textContent.trim())));
      lines.push([]);
    });
  });
  const csv = lines.map(r => r.map(v =>
    /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g,'""') + '"' : String(v)
  ).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = reportTitle().replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(`Exported ${lines.filter(l => l.length > 1).length} rows of table data.`, 'ok');
}

          backgroundColor:Q.byMeasure.map(m => m.pct >= 70 ? T.ok : m.pct >= 50 ? T.warn : T.bad),
          borderRadius:3}]},
      options:{indexAxis:'y',
        scales:{x:{max:100, grid:{color:T.line},
          ticks:{color:T.mute, font:{size:10}, callback:v => v + '%'}},
          y:{grid:{display:false}, ticks:{color:T.ink, font:{size:10}}}}}});
  });

  return `<div class="sec-title">Data Quality Plan</div>
    <div class="sec-sub">A §7.1 asks for three steps against each of five measures, for one named
      indicator. The indicator is not named and all fifteen cells are empty. This screen is not
      that plan — it is an account of how far each register actually held can be trusted.</div>

      <div><strong>${esc(g6.where)} is blank — gap ${esc(g6.id)}.</strong> ${esc(g6.detail)}

      <div><strong>${Q.cells.filter(c => c.moved).length} verdict${
        Q.cells.filter(c => c.moved).length === 1 ? ' has' : 's have'} moved because the system
        is being used.</strong> Integrity was the weakest measure here because nothing recorded
        who changed a figure or when. ${appData.entryLog.length} change${
        appData.entryLog.length === 1 ? '' : 's'} ${appData.entryLog.length === 1
        ? 'has' : 'have'} now been recorded through a form, each with a name and a time against
        it. The seeded figures still have neither, which is why those registers read

        <button class="btn btn-sm" data-action="go" data-view="users"

    <div class="kpi-row">

        `against ${appData.dqMeasures.length} measures each · ${Q.cells.length} verdicts`)}
      ${kpiTile('Overall', Q.pct + '%', 'Unweighted mean of every verdict',
        Q.pct >= 70 ? 'ok' : Q.pct >= 50 ? 'warn' : 'bad')}
      ${kpiTile('Weakest measure', Q.weakestMeasure.measure.label,
        Q.weakestMeasure.pct + '% · ' + Q.weakestMeasure.weak + ' registers weak on it', 'bad')}
      ${kpiTile('Indicators with nothing behind them',
        String(Q.unbacked.length), Q.unbacked.join(', ') || 'none', 'warn')}
    </div>

    <div class="card" style="margin-bottom:18px">
      <div class="card-head"><h3>A §7.1 as the document leaves it</h3>${chip('blank','bad')}</div>
      <div class="tbl-scroll"><table class="dt">
        <thead><tr><th>Performance indicator</th><th colspan="3">Steps to secure it</th></tr></thead>
        <tbody>
          <tr><td colspan="4" class="dq-blank">
            <i class="bi bi-dash-lg"></i> not named</td></tr>
          ${appData.dqMeasures.map(m => `<tr>
            <td><strong>${esc(m.label)}</strong>
              <div style="font-size:11px;color:var(--ink-mute)">${esc(m.asks)}</div></td>
            <td class="dq-blank">—</td><td class="dq-blank">—</td><td class="dq-blank">—</td>

        </tbody></table></div>
      <div class="card-body" style="padding-top:10px;font-size:11.5px;color:var(--ink-mute);
        line-height:1.6">
        Sixteen empty cells. Nothing is filled in here, and nothing below is presented as though it

    </div>

    <div class="panel-grid">
      <div class="card"><div class="card-head"><h3>Which measure holds up worst</h3>
        <span style="font-size:11px;color:var(--ink-mute)">across all

        <div class="chart-wrap"><canvas id="ch-dqm"></canvas></div>
        <div class="card-body" style="padding-top:0;font-size:11.5px;color:var(--ink-soft);
          line-height:1.6">
          ${esc(Q.weakestMeasure.measure.label)} is weakest at ${Q.weakestMeasure.pct}%.
          ${Q.weakestMeasure.measure.key === 'integrity'
            ? 'Almost nothing in this system records who changed a figure or when, which is the '
            + 'single cheapest thing to fix and the one a verification mission asks about first.'
            : esc(Q.weakestMeasure.measure.asks)}</div></div>

      <div class="card"><div class="card-head"><h3>Register by register</h3>
        ${chip(Q.byRegister.filter(r => r.pct < 60).length + ' below 60%','warn')}</div>
        <div class="card-body">
          ${Q.byRegister.map(r => `<div class="dq-reg">

      <div class="tbl-scroll"><table class="dt dq-mx">
        <thead><tr><th>Register</th>${appData.dqMeasures

          <td><strong>${esc(r.label)}</strong></td>

            return `<td class="dq-c ${L.tone}" title="${esc(r[m.key].note)}">${esc(L.label)}</td>`;
          }).join('')}
        </tr>`).join('')}</tbody></table></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>Every verdict that is weak, in full</h3>
        ${chip(weakCells.length + ' of ' + Q.cells.length,'bad')}</div>
      <div class="card-body">
        ${weakCells.map(c => `<div class="dq-w">
          <div class="dq-wh">${chip(c.measure.label, DQ_LEVELS[c.level].tone)}

      </div>
      <div class="card-body" style="padding-top:0">
