const esc = v => String(v ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => Number(v ?? 0).toLocaleString('en-GB');
const fmtDate = d => new Date(d).toLocaleDateString('en-GB',
  {day:'numeric', month:'short', year:'numeric'});
const pct = (n,d) => d ? Math.round(n/d*1000)/10 : 0;
const usd = n => '$' + num(Math.round(n));

function chip(text, tone='grey', icon){
  return `<span class="chip ${tone}">${icon?`<i class="bi ${icon}"></i>`:''}${esc(text)}</span>`;
}
function kpiTile(label, value, sub, tone){
  return `<div class="kpi"><div class="k-l">${esc(label)}</div>
    <div class="k-v"${tone?` style="color:var(--${tone})"`:''}>${value}</div>
    ${sub?`<div class="k-s">${sub}</div>`:''}</div>`;
}
function progressBar(p, tone){
  const w = Math.max(0, Math.min(100, p || 0));
  return `<div class="bar"><i style="width:${w}%;background:var(--${tone||'brand'})"></i></div>`;
}

const CHART_FALLBACK = {'--ink-soft':'#3c5162','--ink-mute':'#6d8396','--line-soft':'#e3ebf0',
  '--brand':'#15405c','--accent':'#c9741f','--ok':'#1d7a4f','--warn':'#b9770e',
  '--bad':'#a32828','--info':'#20627f'};
function chartTheme(){
  let cs = null;
  try { cs = getComputedStyle(document.documentElement); } catch(e){}
  const t = k => {
    const v = cs ? String(cs.getPropertyValue(k) || '').trim() : '';
    return v || CHART_FALLBACK[k];
  };
  return {ink:t('--ink-soft'), mute:t('--ink-mute'), line:t('--line-soft'), brand:t('--brand'),
          accent:t('--accent'), ok:t('--ok'), warn:t('--warn'), bad:t('--bad'), info:t('--info')};
}
const charts = {};
function destroyCharts(){
  Object.keys(charts).forEach(k => { try{ charts[k].destroy(); }catch(e){} delete charts[k]; });
}
function chartConfig(cfg){
  const T = chartTheme();
  cfg.options = Object.assign({
    responsive:true, maintainAspectRatio:false,
    plugins:{legend:{display:false}, tooltip:{enabled:true}},
    scales:{x:{grid:{display:false}, ticks:{color:T.mute, font:{size:10}}},
            y:{grid:{color:T.line}, ticks:{color:T.mute, font:{size:10}}, beginAtZero:true}}
  }, cfg.options || {});
  return cfg;
}
function mountChart(id, cfg){
  const el = document.getElementById(id);
  if (!el || !window.Chart) return;
  charts[id] = new Chart(el, chartConfig(cfg));
}
let pendingMounts = [];
const afterRender = fn => pendingMounts.push(fn);

function toast(msg, tone='ok'){
  const box = document.getElementById('toasts');
  if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast ' + tone;
  el.innerHTML = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 6200);
}
function openModal({title, body, foot='', wide=false}){
  const root = document.getElementById('modal-root');
  if (!root) return;
  root.innerHTML = `<div class="modal${wide?' wide':''}">
    <div class="modal-head"><h3>${esc(title)}</h3>
      <button class="btn btn-sm btn-ghost" data-action="close-modal" aria-label="Close">
        <i class="bi bi-x-lg"></i></button></div>
    <div class="modal-body">${body}</div>
    ${foot?`<div class="modal-foot">${foot}</div>`:''}</div>`;
  root.classList.add('open');
}
function closeModal(){
  const root = document.getElementById('modal-root');
  if (root){ root.classList.remove('open'); root.innerHTML = ''; }
}

/* ═══════════════════════════════════════════════════════════════════════════
   4c. DATA ENTRY — the form kit, and the log that makes it auditable
   Every figure in this system can be recorded by a person as well as seeded.
   Two rules hold throughout:
     1. A form writes to appData and nothing else. The screens re-derive from
        it, so a recorded figure reaches every table, chart and report that
        uses it in the same instant.
     2. Every write is logged with a name and a timestamp. This is the one
        thing the Data Quality Plan says is missing from the seeded data, and
        the integrity verdicts on that screen move as the log fills up.
   ═══════════════════════════════════════════════════════════════════════════ */
appData.entryLog = [];

/* Registers a form writes to that the Data Quality Plan does not assess —
   because A §7.1's five measures are about the figures an indicator is built
   from, and these two are not. Declared rather than assumed, so a typo in a
   register key is caught by a consistency check instead of silently making a
   write inert. */
const ENTRY_UNASSESSED_REGISTERS = ['countries', 'gaps'];

function logEntry(register, what, detail){
  appData.entryLog.unshift({
    at: new Date().toISOString(),
    stamp: nowStamp(),
    time: new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}),
    by: currentUser.name, role: currentUser.title,
    register, what, detail
  });
  /* The log is the audit trail, not a cache. It is never trimmed, because a
     trimmed audit trail is worse than none — it looks complete and is not. */
  return appData.entryLog[0];
}
const entriesFor = register => appData.entryLog.filter(e => e.register === register);

/* ── Fields ──────────────────────────────────────────────────────────────── */
const FIELD_CSS = `width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg-card);color:var(--ink);font:400 12.5px 'Inter',sans-serif`;

function fieldHTML(f, v){
  const id = 'f-' + f.name;
  const val = v === undefined || v === null ? '' : v;
  const common = `id="${id}" name="${esc(f.name)}"`;
  let input;

  switch (f.type){
    case 'number':
      input = `<input type="number" ${common} value="${esc(String(val))}"
        ${f.min !== undefined ? `min="${f.min}"` : ''}
        ${f.max !== undefined ? `max="${f.max}"` : ''}
        step="${f.step || 1}" style="${FIELD_CSS}"
        ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''}>`;
      break;
    case 'select':
      input = `<select ${common} style="${FIELD_CSS};cursor:pointer">
        ${f.blank ? `<option value="">${esc(f.blank)}</option>` : ''}
        ${f.options.map(o => {
          const ov = Array.isArray(o) ? o[0] : o, ol = Array.isArray(o) ? o[1] : o;
          return `<option value="${esc(String(ov))}"${
            String(ov) === String(val) ? ' selected' : ''}>${esc(String(ol))}</option>`;
        }).join('')}</select>`;
      break;
    case 'textarea':
      input = `<textarea ${common} rows="${f.rows || 3}" style="${FIELD_CSS};resize:vertical"
        ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''}>${esc(String(val))}</textarea>`;
      break;
    case 'date':
      input = `<input type="date" ${common} value="${esc(String(val))}" style="${FIELD_CSS}">`;
      break;
    case 'score':
      /* 1–4, the scale POOA v5 and the observation instrument both use. A
         score is a judgement, so it is chosen from the scale rather than
         typed — you cannot enter 3.7 on a four-point rubric. */
      input = `<div class="ef-scale" data-for="${esc(f.name)}">
        ${[1,2,3,4].map(n => `<label class="${String(n) === String(val) ? 'on' : ''}">
          <input type="radio" name="${esc(f.name)}" value="${n}"
            ${String(n) === String(val) ? 'checked' : ''}><b>${n}</b>
          <span>${esc((f.scale || ['Entry','Developing','Intermediate','Advanced'])[n-1])}</span>
        </label>`).join('')}</div>`;
      break;
    case 'yesno':
      input = `<div class="ef-yn" data-for="${esc(f.name)}">
        ${[['1', f.yes || 'Yes'], ['0', f.no || 'No']].map(([ov, ol]) => `
          <label class="${String(ov) === String(val) ? 'on' : ''}">
            <input type="radio" name="${esc(f.name)}" value="${ov}"
              ${String(ov) === String(val) ? 'checked' : ''}>${esc(ol)}</label>`).join('')}</div>`;
      break;
    case 'static':
      input = `<div class="ef-static">${f.value}</div>`;
      break;
    default:
      input = `<input type="text" ${common} value="${esc(String(val))}" style="${FIELD_CSS}"
        ${f.placeholder ? `placeholder="${esc(f.placeholder)}"` : ''}
        ${f.maxlength ? `maxlength="${f.maxlength}"` : ''}>`;
  }

  return `<div class="ef${f.half ? ' half' : ''}" data-field="${esc(f.name)}">
    <label for="${id}">${esc(f.label)}${f.required ? '<i>required</i>' : ''}</label>
    ${input}
    ${f.hint ? `<div class="ef-hint">${f.hint}</div>` : ''}
    <div class="ef-err" data-err="${esc(f.name)}"></div>
  </div>`;
}

/* Read the form back. Validation is here rather than in each handler, so a
   handler only ever sees values that are the right shape. */
function formRead(fields){
  const values = {}, errors = {};
  fields.forEach(f => {
    if (f.type === 'static' || f.type === 'heading') return;
    let raw;
    if (f.type === 'score' || f.type === 'yesno'){
      const sel = document.querySelector(`input[name="${f.name}"]:checked`);
      raw = sel ? sel.value : '';
    } else {
      const el = document.getElementById('f-' + f.name);
      raw = el ? el.value : '';
    }
    raw = String(raw === undefined || raw === null ? '' : raw).trim();

    if (f.required && raw === ''){
      errors[f.name] = f.requiredMsg || 'This is needed.';
      return;
    }
    if (raw === ''){ values[f.name] = f.type === 'number' ? null : ''; return; }

    if (f.type === 'number' || f.type === 'score' || f.type === 'yesno'){
      const n = Number(raw);
      if (!isFinite(n)){ errors[f.name] = 'A number, please.'; return; }
      /* A score is bounded by the scale it is drawn on, and a yes/no by being
         one or the other, whatever the widget sends. The validator does not
         trust its own input: the only four-point score this will accept is a
         four-point score. */
      const min = f.min !== undefined ? f.min : f.type === 'score' ? 1 : f.type === 'yesno' ? 0 : undefined;
      const max = f.max !== undefined ? f.max : f.type === 'score' ? 4 : f.type === 'yesno' ? 1 : undefined;
      if (min !== undefined && n < min){
        errors[f.name] = `Not below ${min}.`; return; }
      if (max !== undefined && n > max){
        errors[f.name] = `Not above ${num(max)}.`; return; }
      if ((f.type === 'score' || f.type === 'yesno') && !Number.isInteger(n)){
        errors[f.name] = 'Choose one of the options.'; return; }
      if (f.integer && !Number.isInteger(n)){
        errors[f.name] = 'A whole number.'; return; }
      values[f.name] = n;
    } else {
      values[f.name] = raw;
    }
  });
  return {values, errors};
}

function formShowErrors(errors){
  document.querySelectorAll('[data-err]').forEach(el => { el.textContent = ''; });
  document.querySelectorAll('[data-field]').forEach(el => el.classList.remove('bad'));
  Object.keys(errors).forEach(k => {
    const e = document.querySelector(`[data-err="${k}"]`);
    if (e) e.textContent = errors[k];
    const w = document.querySelector(`[data-field="${k}"]`);
    if (w) w.classList.add('bad');
  });
}

/* ── The one form opener every entry point uses ─────────────────────────── */
let entryOpen = null;

function openEntryForm(key, meta){
  const spec = ENTRY_FORMS[key];
  if (!spec) return;
  const built = spec.build(meta);
  if (built.refuse){
    openModal({title:built.title || 'Not possible', body:`<div class="banner warn">
      <i class="bi bi-exclamation-triangle-fill"></i><div>${built.refuse}</div></div>`,
      foot:`<button class="btn" data-action="close-modal">Close</button>`});
    return;
  }
  entryOpen = {key, meta, fields:built.fields};
  openModal({
    wide: built.wide !== false,
    title: built.title,
    body: `${built.intro ? `<p class="ef-intro">${built.intro}</p>` : ''}
      <form id="entry-form" class="ef-grid" onsubmit="return false">
        ${built.fields.map(f => f.type === 'heading'
          ? `<div class="ef-head">${esc(f.label)}${
              f.hint ? `<span>${esc(f.hint)}</span>` : ''}</div>`
          : fieldHTML(f, built.values ? built.values[f.name] : undefined)).join('')}
      </form>
      ${built.after || ''}`,
    foot: `<div class="ef-foot-note">
        <i class="bi bi-person-check"></i> Recorded against
        <strong>${esc(currentUser.name)}</strong> on ${esc(nowStamp())}${
        built.footNote ? ' · ' + built.footNote : ''}</div>
      <button class="btn" data-action="close-modal">Cancel</button>
      <button class="btn btn-primary" data-action="entry-submit">
        <i class="bi bi-check2"></i> ${esc(built.submit || 'Save')}</button>`
  });
}

function entrySubmit(){
  if (!entryOpen) return;
  const spec = ENTRY_FORMS[entryOpen.key];
  const {values, errors} = formRead(entryOpen.fields);
  if (Object.keys(errors).length){
    formShowErrors(errors);
    toast('Some of that needs fixing before it can be saved.', 'warn');
    return;
  }
  let out;
  try { out = spec.save(values, entryOpen.meta); }
  catch (e){ toast('That could not be saved: ' + esc(e.message), 'bad'); return; }

  if (out && out.errors && Object.keys(out.errors).length){
    formShowErrors(out.errors);
    toast(out.message || 'Some of that needs fixing.', 'warn');
    return;
  }
  const key = entryOpen.key, meta = entryOpen.meta;
  entryOpen = null;
  closeModal();
  /* Re-render whatever the user is looking at, so the figure they just typed
     appears everywhere it belongs without a reload. */
  appData.checkSnapshot = runConsistencyChecks();
  showView((out && out.view) || currentView, (out && out.meta !== undefined)
    ? out.meta : currentMeta);
  toast((out && out.message) || 'Saved.', (out && out.tone) || 'ok');
}

/* The button that appears on every register that can be written to. */
function entryBtn(key, meta, label, opts){
  opts = opts || {};
  if (access(currentView) === 'read')
    return `<span class="chip warn"><i class="bi bi-lock"></i>read-only for your role</span>`;
  return `<button class="btn btn-sm ${opts.primary ? 'btn-primary' : ''}"
    data-action="entry-open" data-form="${esc(key)}"
    ${meta !== undefined && meta !== null ? `data-meta="${esc(String(meta))}"` : ''}
    ${opts.title ? `title="${esc(opts.title)}"` : ''}>
    <i class="bi ${opts.icon || 'bi-plus-lg'}"></i> ${esc(label)}</button>`;
}
/* A small pencil, for editing a row in place. */
function editBtn(key, meta, title){
  if (access(currentView) === 'read') return '';
  return `<button class="ef-pencil" data-action="entry-open" data-form="${esc(key)}"
    data-meta="${esc(String(meta))}" title="${esc(title || 'Edit')}">
    <i class="bi bi-pencil"></i></button>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   4d. THE FORMS
   One entry per register. `build` returns the fields and any current values;
   `save` writes to appData, logs the write, and says what moved. Neither ever
   fills a blank in a source document or resolves a documented difference —
   those have their own screen, where a person does it and is named for it.
   ═══════════════════════════════════════════════════════════════════════════ */
const COUNTRY_OPTS = () => appData.countries.map(c => [c.code, c.name]);

const ENTRY_FORMS = {

/* ── A partner school ──────────────────────────────────────────────────── */
'school': {
  build(code){
    const s = code ? appData.schools.find(x => x.code === code) : null;
    return {
      title: s ? `${s.name || s.code} — edit` : 'Add a partner school',
      submit: s ? 'Save the school' : 'Add the school',
      intro: s
        ? `Changing enrolment here moves the student total, the attendance average, every
           country figure and every report that uses them — immediately, because they all read
           this register rather than holding their own copy.`
        : `A new school joins the register with no self-study and no observed teachers. Both are
           recorded separately, so the school appears as unassessed rather than as zero.`,
      values: s ? Object.assign({}, s, {
        cc: s.cc, name: s.name || '', teachers: s.teachers
      }) : {joined: String(new Date(appData.config.today).getFullYear())},
      fields: [
        {type:'heading', label:'The school'},
        {name:'cc', label:'Country', type:'select', options:COUNTRY_OPTS(),
         required:true, half:true},
        {name:'level', label:'Level', type:'select', options:['Primary','Secondary'],
         required:true, half:true},
        {name:'name', label:'Name', type:'text', half:true,
         placeholder:'Leave empty if it has none on record',
         hint:'Six schools are named in the source documents. Leaving this empty carries the '
            + 'school by its register code, which is better than inventing a name.'},
        {name:'joined', label:'Partnership since', type:'number', min:2010, max:2030,
         integer:true, half:true},
        {type:'heading', label:'Enrolment', hint:'Counts only — no child is recorded individually'},
        {name:'enrolledM', label:'Boys enrolled', type:'number', min:0, max:5000,
         integer:true, required:true, half:true},
        {name:'enrolledF', label:'Girls enrolled', type:'number', min:0, max:5000,
         integer:true, required:true, half:true},
        {name:'capacity', label:'Places', type:'number', min:0, max:10000, integer:true,
         required:true, half:true,
         hint:'The system flags a school enrolled above its capacity rather than hiding it.'},
        {name:'teachers', label:'Teachers', type:'number', min:1, max:400, integer:true,
         required:true, half:true},
        {type:'heading', label:'Rates', hint:'Per cent, as the school reports them'},
        {name:'attendance', label:'Attendance', type:'number', min:0, max:100, step:0.1,
         required:true, half:true,
         hint:`The goal is ${appData.targets.attendance.value}% daily attendance (B §6.1).`},
        {name:'retention', label:'Retention', type:'number', min:0, max:100, step:0.1,
         required:true, half:true},
        {name:'transition', label:'Transition to secondary', type:'number', min:0, max:100,
         step:0.1, half:true, hint:'Primary schools only — leave empty for a secondary school.'},
        {name:'graduation', label:'Graduation', type:'number', min:0, max:100, step:0.1,
         half:true, hint:'Secondary schools only.'}
      ]
    };
  },
  save(v, code){
    const errors = {};
    if (v.enrolledM + v.enrolledF === 0) errors.enrolledM = 'A school with no children on the '
      + 'register is not a partner school yet.';
    if (v.capacity && v.enrolledM + v.enrolledF > v.capacity * 3)
      errors.capacity = 'Three times capacity looks like a typo. Check the figure.';
    if (v.level === 'Primary' && v.graduation !== null)
      errors.graduation = 'A primary school has no graduation figure. Use transition.';
    if (v.level === 'Secondary' && v.transition !== null)
      errors.transition = 'A secondary school has no transition figure. Use graduation.';
    if (Object.keys(errors).length) return {errors};

    const c = appData.countries.find(x => x.code === v.cc);
    const total = v.enrolledM + v.enrolledF;
    const row = {
      country:c.name, cc:c.code, level:v.level,
      name: v.name || null, joined:String(v.joined || c.joined),
      enrolledM:v.enrolledM, enrolledF:v.enrolledF, capacity:v.capacity,
      teachers:v.teachers, leaders:2,
      attendance:v.attendance, retention:v.retention,
      transition: v.level === 'Primary' ? v.transition : null,
      graduation: v.level === 'Secondary' ? v.graduation : null,
      university: v.level === 'Secondary' ? 0 : null
    };

    if (code){
      const s = appData.schools.find(x => x.code === code);
      const was = s.enrolledM + s.enrolledF;
      Object.assign(s, row);
      logEntry('enrolment', `${s.name || s.code} updated`,
        `Enrolment ${num(was)} → ${num(total)}, attendance ${v.attendance}%`);
      return {message:`${esc(s.name || s.code)} saved. Enrolment ${num(was)} → `
        + `<strong>${num(total)}</strong>; the network now holds `
        + `<strong>${num(calcStudents().total)}</strong> children.`};
    }

    /* A new code, in the same shape the seed uses, numbered after the highest
       already there so it cannot collide with one the seed produced. */
    const lv = v.level === 'Primary' ? 'P' : 'S';
    const nextNum = appData.schools
      .filter(x => x.cc === c.code && x.level === v.level)
      .reduce((m, x) => Math.max(m, parseInt(x.code.slice(-2), 10) || 0), 0) + 1;
    row.code = `${c.code}-${lv}-${String(nextNum).padStart(2,'0')}`;
    appData.schools.push(row);
    c.schools = appData.schools.filter(x => x.cc === c.code).length;
    if (v.level === 'Primary') c.pri = (c.pri || 0) + 1; else c.sec = (c.sec || 0) + 1;

    logEntry('enrolment', `${row.name || row.code} added`,
      `${c.name} · ${v.level} · ${num(total)} children, ${v.teachers} teachers`);
    const p = calcTargetProgress('schools', calcSchools().total);
    return {view:'school-detail', meta:row.code,
      message:`${esc(row.name || row.code)} added. ${num(calcSchools().total)} partner schools `
        + `now — <strong>${p.pct}%</strong> of the target of `
        + `${num(appData.targets.schools.value)}. It has no self-study yet, so it shows as `
        + `unassessed rather than as zero.`};
  }
},

/* ── A self-study round ────────────────────────────────────────────────── */
'selfstudy': {
  build(metaStr){
    const parts = String(metaStr || '').split(':');
    const code = parts[0], round = parts[1] || 'R2';
    const s = appData.schools.find(x => x.code === code);
    if (!s) return {refuse:'That school is not in the register.'};
    const rec = folFor(code, round);
    const rd = appData.selfStudy.rounds.find(r => r.id === round);
    return {
      title: `${s.name || s.code} — ${rd.label}`,
      submit: rec ? 'Save the scores' : 'Record the round',
      intro: `The school scores itself against each of the
        ${appData.selfStudy.domains.length} Fullness of Life domains, 1 to 4. The mean places it
        at a stage, and the two lowest domains become its improvement priorities — so the
        priorities are the school's own assessment of itself, not a ranking imposed on it.`,
      values: rec ? Object.assign({round}, rec.scores) : {round},
      fields: [
        {name:'round', label:'Round', type:'select',
         options:appData.selfStudy.rounds.map(r => [r.id, r.label]), required:true},
        {type:'heading', label:'Domain scores',
         hint:`${appData.selfStudy.benchmark} or above meets the `
            + `${appData.selfStudy.benchmarkLabel} benchmark`},
        ...appData.selfStudy.domains.map(d => ({
          name:d.key, label:d.label, type:'score', required:true
        }))
      ],
      after: rec ? `<div class="banner warn" style="margin:14px 0 0">
        <i class="bi bi-clock-history"></i>
        <div>This round already has scores. Saving replaces them — the other round is untouched,
          so the movement between the two stays computable.</div></div>` : ''
    };
  },
  save(v, metaStr){
    const code = String(metaStr || '').split(':')[0];
    const s = appData.schools.find(x => x.code === code);
    const scores = {};
    appData.selfStudy.domains.forEach(d => { scores[d.key] = v[d.key]; });
    const mean = Math.round(appData.selfStudy.domains
      .reduce((t,d) => t + scores[d.key], 0) / appData.selfStudy.domains.length * 100) / 100;
    const stage = folStage(mean);

    let rec = appData.selfStudy.records.find(r => r.school === code && r.round === v.round);
    const was = rec ? {mean:rec.mean, stage:rec.stage} : null;
    if (!rec){
      rec = {school:code, round:v.round};
      appData.selfStudy.records.push(rec);
    }
    Object.assign(rec, {scores, mean, stage, priorities:folPriorities(scores)});

    logEntry('selfstudy', `${s.name || s.code} · ${v.round}`,
      was ? `Mean ${was.mean} → ${mean}, ${was.stage} → ${stage}`
          : `Mean ${mean}, ${stage}`);

    const f = calcFoL('R2');
    const crossed = mean >= appData.selfStudy.benchmark;
    return {view:'school-detail', meta:code,
      message:`${esc(s.name || s.code)} scores <strong>${mean}</strong> — ${esc(stage)}`
        + (crossed ? `, at or above the ${esc(appData.selfStudy.benchmarkLabel)} benchmark`
                   : `, below the benchmark of ${appData.selfStudy.benchmark}`)
        + `. Across the network ${f.benchmarkPct}% of schools now meet it. Priorities: `
        + rec.priorities.map(p => esc(p.label.toLowerCase())).join(' and ') + '.'};
  }
},

        date: appData.config.today, trained: t.trained ? 1 : 0}, cur || {}),
      fields: [
        {type:'static', label:'Teacher', value:`<span class="mono">${esc(tcode)}</span> ·
          ${esc(s ? (s.name || s.code) : '')} · ${esc(s ? s.country : '')}`},
        {name:'round', label:'Round', type:'select',
         options:[['before','Round 1 — before training'],['after','Round 2 — after training']],
         required:true, half:true},
        {name:'trained', label:'Trained in Why/Play/Lead', type:'yesno', required:true,
         half:true},
        {name:'observer', label:'Observed by', type:'text', required:true, half:true,
         hint:'Recorded so a score can be traced to the person who gave it.'},
        {name:'date', label:'Date observed', type:'date', required:true, half:true},
        {type:'heading', label:'Practice observed',
         hint:'3 or above is taken as consistently applying the framework'},
        ...OBS_DOMAINS.map(d => ({
          name:d.key, label:d.label, type:'score', required:true,
          scale:['Not seen','Emerging','Consistent','Embedded']
        }))
      ]
    };
  },
  save(v, metaStr){
    const tcode = String(metaStr || '').split(':')[0];
    const t = appData.teachers.find(x => x.code === tcode);
    const scores = {};
    OBS_DOMAINS.forEach(d => { scores[d.key] = v[d.key]; });
    const mean = obsMean(scores);

    if (v.round === 'before'){ t.obsBefore = scores; t.meanBefore = mean; }
    else { t.obsAfter = scores; t.meanAfter = mean; }
    t.trained = v.trained === 1;
    t.observers = t.observers || {};
    t.observers[v.round] = {by:v.observer, on:v.date};

    const o = calcObservation();
    logEntry('observation', `${tcode} · ${v.round === 'before' ? 'round 1' : 'round 2'}`,
      `Mean ${mean}, observed by ${v.observer} on ${v.date}`);
    return {message:`Recorded. ${esc(tcode)} scores <strong>${mean}</strong> on this round. `
      + `Across the register practice now reads ${o.before} → ${o.after}, a `
      + `<strong>${o.increase}%</strong> increase — the figure OC1 asks for.`};
  }
},

/* ── A school leader against OC2 ───────────────────────────────────────── */
'leader': {

        does not define it, and one it states on the screen.`,
      values: vals,
      fields: [
        {type:'static', label:'Leader',
         value:`<span class="mono">${esc(code)}</span> · ${esc(l.role)} · ${esc(l.country)}`},
        {name:'sex', label:'Sex', type:'select', options:[['M','Male'],['F','Female']],
         required:true, half:true},
        {name:'trained', label:'Has had the training', type:'yesno', required:true, half:true},
        {type:'heading', label:'The four indicators',
         hint:'All four is "consistently implements"'},
        ...LEAD_INDICATORS.map(i => ({
          name:i.key, label:i.label, type:'yesno', required:true,
          yes:'Applying', no:'Not yet'
        }))
      ]
    };

  save(v, code){
    const l = appData.leaders.find(x => x.code === code);

/* ── A stakeholder in training ─────────────────────────────────────────── */

  build(code){

      cohort:v.cohort, sessions:v.sessions,
      certificate:v.certificate === 1, mentored:v.mentored === 1};

    if (code){
      const st = appData.stakeholders.find(x => x.code === code);

        country's figures. Naming one here closes that, and is logged against your name.`,
      values: {status:c.status, coordinator:c.coordinator || '', context:c.context,
        joined:Number(c.joined)},
      fields: [
        {type:'static', label:'Country',
         value:`${esc(c.name)} · <span class="mono">${esc(c.code)}</span> ·
           ${num(appData.schools.filter(s => s.cc === c.code).length)} schools`},
        {name:'status', label:'Partnership status', type:'select',
         options:[['current','Current partner'],['developing','Developing'],

/* ── Money ─────────────────────────────────────────────────────────────── */
'finance': {

    return {
      title: 'Record money raised',
      submit: 'Record it',
      wide:false,
      intro: `Two figures exist in the source documents, both in A §5.2:

        ${usd(appData.targets.perCountry.value)} per partner country. There is no budget line
        anywhere, so this records money in — not money planned or spent.`,
      values: {month: appData.finance.monthly[appData.finance.monthly.length - 1].month},
      fields: [
        {name:'cc', label:'Country envelope', type:'select', options:COUNTRY_OPTS(),
         blank:'General revenue — not a country envelope', half:true,
         hint:`Only ${f.countriesMet} of ${f.rows.length} envelopes are met.`},
        {name:'month', label:'Month', type:'select', required:true, half:true,

    let run = 0;

      message:`${usd(v.amount)} recorded against ${esc(where)}. Total raised `
        + `<strong>${usd(F.revenue.raised)}</strong> — ${F.revenuePct}% of `
        + `${usd(F.revenue.target)}, with ${F.countriesMet} of ${F.rows.length} envelopes met.`};
  }
},

/* ── A blank in a source document, answered by a person ────────────────── */
'gap': {
  build(id){
    const g = appData.gaps.find(x => x.id === id);
    if (!g) return {refuse:'That is not a gap on the register.'};
    return {
      title: `${esc(g.id)} — ${esc(g.where)}`,
      submit: g.answer ? 'Replace the answer' : 'Record the answer',
      intro: `<strong>${esc(g.what)}.</strong> ${esc(g.detail)} This system has never filled this
        in and never will on its own — but you can, and it will be recorded against your name,
        with the date, and printed in every report section that has been holding the question.`,
      values: g.answer ? {answer:g.answer.text, source:g.answer.source} : {},
      fields: [
        {type:'static', label:'The question', value:`<em>${esc(g.question)}</em>`},
        {type:'static', label:'What it holds up',
         value:g.blocks.map(b => `<span class="chip grey">${esc(b)}</span>`).join(' ')},
        {name:'answer', label:'The answer', type:'textarea', rows:5, required:true,
         requiredMsg:'An empty answer leaves the gap exactly where it was.',
         placeholder:'In B2THEWORLD’s own words. This is printed in the report, as written.',
         hint:'Write what is true, not what fills the space. A short honest answer beats a long '
            + 'plausible one, and the report prints whichever you give it.'},
        {name:'source', label:'Where this comes from', type:'text',
         placeholder:'A document, a meeting, a decision — whatever a reader could check',
         hint:'Optional, but it is the difference between an answer and an assertion.'}
      ],
      after: g.answer ? `<div class="banner warn" style="margin:14px 0 0">
        <i class="bi bi-clock-history"></i>
        <div>Answered by ${esc(g.answer.by)} on ${esc(g.answer.on)}. Saving replaces that, and
          the replacement is logged too — the old answer is not erased from the log.</div>
        </div>` : ''
    };
  },
  save(v, id){
    const g = appData.gaps.find(x => x.id === id);
    const was = g.answer;
    g.answer = {text:v.answer, source:v.source || '', by:currentUser.name, on:nowStamp()};
    logEntry('gaps', `${g.id} answered`,
      (was ? 'Replaced a previous answer. ' : '') + v.answer.slice(0, 110)
      + (v.answer.length > 110 ? '…' : ''));

    const P = calcPlanScore();
    const left = appData.gaps.filter(x => !x.answer).length;
    return {view:'quality',
      message:`${esc(g.id)} answered. It no longer blocks `
        + `${g.blocks.map(b => esc(b)).join(' or ')} — ${
          g.blocks.length === 1 ? 'that section' : 'those sections'} now `
        + `${g.blocks.length === 1 ? 'prints' : 'print'} your answer instead of the question. `
        + `The plan scores <strong>${P.score}</strong> of 100, with ${left} `
        + `${left === 1 ? 'blank' : 'blanks'} left.`};
  }
}
};

/* ═══════════════════════════════════════════════════════════════════════════
   5. CONSISTENCY CHECKS — stage 2 fills these in. The chip reports pending
   rather than a green pass it has not earned.
   ═══════════════════════════════════════════════════════════════════════════ */
/* What a check is for, since it is easy to get wrong: it asserts an INVARIANT —
   something that must hold however the data changes — not the seed. A check
   that says "27 schools" turns red the moment somebody adds a 28th, which
   teaches everyone to ignore the chip. Where the seed figure itself is worth
   stating, it is stated against appData.seedFacts, captured at load, and
   labelled as a seed figure rather than a rule. */
function captureSeedFacts(){
  const st = calcStudents(), sc = calcSchools(), f2 = calcFoL('R2');
  return {
    students: st.total, seedSchools: sc.total,
    schoolsByCountry: appData.countries
      .map(c => c.code + ':' + appData.schools.filter(x => x.cc === c.code).length)
      .join(' \u00b7 '),
    teachersWorse: appData.teachers.filter(t => t.meanAfter < t.meanBefore).length,
    schoolsWorse: calcFolMovement().filter(m => m.gain < 0).length,
    atBenchmark: f2.atBenchmark,
    revenue: calcFinance().revenue.raised,
    studentsPct: calcTargetProgress('students', st.total).pct,
    studentsAltPct: pct(st.total, Math.max(...appData.targets.students.over))
  };
}

function runConsistencyChecks(){
  const results = [];
  /* Captured at load, before anybody can type anything. If it is somehow
     missing, capture it now rather than throwing — a check that cannot run is
     better than a chip that crashes the page. */
  const SF = appData.seedFacts || (appData.seedFacts = captureSeedFacts());
  const check = (name, got, want, note) =>
    results.push({name, pass:JSON.stringify(got) === JSON.stringify(want), got, want, note});

  /* ── The plans, the decision and the gaps ─────────────────────────────── */
  check('Both plans are loaded and separate',
        [!!appData.plans.y2024, !!appData.plans.pooa5,
         appData.plans.y2024 !== appData.plans.pooa5], [true,true,true]);
  check('POOA v5 carries no targets',
        Object.keys(appData.plans.pooa5).filter(k => /target/i.test(k)), []);
  check('Three projects in the 2024 plan', appData.plans.y2024.projects.length, 3);
  check('POOA v5 has 3 problems, 3 outcomes, 3 outputs, 6 assumptions',
        [appData.plans.pooa5.problems.length, appData.plans.pooa5.outcomes.length,
         appData.plans.pooa5.outputs.length, appData.plans.pooa5.assumptions.length], [3,3,3,6]);
  check('Nine differences recorded', appData.reconciliation.length, 9);
  check('Every resolved target matches its reconciliation decision',
        ['students','schools','stakeholders','countries'].map(k => appData.targets[k].value),
        [10000, 27, 500, 5]);
  check('Each decision names who made it and when',
        appData.reconciliation.filter(r => r.decision)
          .every(r => r.decision.by && r.decision.on), true);
  check('The unwritten outcome is left undecided',
        appData.reconciliation.find(r => r.id === 'R9').decision, null);
  check('Eleven gaps, none of them carrying a value',
        [appData.gaps.length, appData.gaps.every(g => g.value === undefined)], [11, true]);

  /* ── The register adds up to the plan ─────────────────────────────────── */
  const sc = calcSchools(), st = calcStudents();
  check('Every school is primary or secondary, and the two add to the total',
        [sc.primary + sc.secondary, sc.total,
         appData.schools.filter(x => !/^(Primary|Secondary)$/.test(x.level)).length],
        [sc.total, sc.total, 0]);
  check('Every school sits in a country that is in the register',
        appData.schools.filter(x => !appData.countries.some(c => c.code === x.cc))
          .map(x => x.code), []);
  check('Every school code is unique',
        appData.schools.length, new Set(appData.schools.map(x => x.code)).size);
  check('Each country\u2019s school count is the register, not a stored copy',
        appData.countries.map(c => c.schools),
        appData.countries.map(c => appData.schools.filter(x => x.cc === c.code).length));
  check(`Seed figure: B Output 2\u2019s breakdown was ${SF.schoolsByCountry}`,
        SF.schoolsByCountry, 'SSD:13 · CMR:7 · PAK:5 · RWA:2 · IRQ:0');
  check('Every country\u2019s status is one the register defines',
        appData.countries.filter(c => !/^(current|developing|candidate)$/.test(c.status))
          .map(c => c.code), []);
  check('Seed figure: Iraq opened as a partner country with no partner school',
        /IRQ:0/.test(SF.schoolsByCountry), true);
  check('The student total is summed from the register, never stored',
        st.total, appData.schools.reduce((t,x) => t + x.enrolledM + x.enrolledF, 0));
  check(`Seed figure: the register opened with ${num(SF.students)} children`,
        SF.students, 7963);
  check('Male and female add to the total', st.male + st.female, st.total);
  check('No school is enrolled beyond its capacity',
        appData.schools.filter(s => s.enrolledM + s.enrolledF > s.capacity).map(s => s.code), []);
  check('Six schools carry a name from a source document; the rest carry codes',
        appData.schools.filter(s => s.name).length, 6);

  /* ── People ───────────────────────────────────────────────────────────── */
  const ob = calcObservation(), ld = calcLeaders(), tr = calcTraining();
  check('Every teacher record belongs to a school in the register',
        appData.teachers.filter(t => !appData.schools.some(x => x.code === t.school))
          .map(t => t.code), []);
  /* A school reports a teacher count; the teacher register holds the ones that
     have actually been observed. They are allowed to differ — a school added
     today reports nine teachers and has none observed — so this reports the
     gap rather than asserting it away. */
  check('The observed register never exceeds the teachers schools report',
        ob.total <= appData.schools.reduce((t,s) => t + s.teachers, 0), true);
  check('Every leader record belongs to a school in the register',
        appData.leaders.filter(l => !appData.schools.some(x => x.code === l.school))
          .map(l => l.code), []);
  check('No school holds more than two leader records',
        appData.schools.filter(x =>
          appData.leaders.filter(l => l.school === x.code).length > 2).map(x => x.code), []);
  check('Every observed mean is inside the instrument\u2019s own 1\u20134 scale',
        appData.teachers.filter(t =>
          t.meanBefore < 1 || t.meanBefore > 4 || t.meanAfter < 1 || t.meanAfter > 4)
          .map(t => t.code), []);
  check(`Seed figure: no teacher went backwards between the two rounds`,
        SF.teachersWorse, 0);
  check('"Consistently" means all four leadership indicators, not some',
        appData.leaders.filter(l => l.consistent && l.appliedCount !== 4).length, 0);
  check('Stakeholders in training cannot exceed those enrolled',
        tr.inTraining <= tr.total, true);
  check('Stakeholder countries include Iraq, which has no school',
        tr.byCountry['Iraq'] > 0, true);

  /* ── Fullness of Life ─────────────────────────────────────────────────── */
  const f1 = calcFoL('R1'), f2 = calcFoL('R2');
  check('Every self-study record belongs to a school in the register',
        appData.selfStudy.records
          .filter(r => !appData.schools.some(x => x.code === r.school))
          .map(r => r.school + '/' + r.round), []);
  check('No school holds two records for the same round',
        appData.selfStudy.records.length,
        new Set(appData.selfStudy.records.map(r => r.school + '/' + r.round)).size);
  check('A school with no self-study is reported as unassessed, not as zero',
        folUnassessed().filter(x => folFor(x.code)).map(x => x.code), []);
  check('Movement is only reported where both rounds exist',
        calcFolMovement().filter(m => m.meanFrom === null || m.meanTo === null).length, 0);
  check(`Seed figure: no school went backwards between the two rounds`,
        SF.schoolsWorse, 0);
  check('The benchmark count is the records that meet it, counted',
        f2.atBenchmark,
        f2.records.filter(r => r.mean >= appData.selfStudy.benchmark).length);
  check(`Seed figure: ${SF.atBenchmark} of ${SF.seedSchools} schools met the benchmark`,
        [SF.atBenchmark, SF.seedSchools], [10, 27]);
  check('Every stage count adds to the schools that were assessed',
        Object.values(f2.byStage).reduce((a,b) => a + b, 0), f2.records.length);

  /* ── Money ────────────────────────────────────────────────────────────── */
  const fin = calcFinance();
  check('The monthly run-rate ends at the revenue total, whatever it is',
        fin.monthly[fin.monthly.length - 1].cumulative, fin.revenue.raised);
  check(`Seed figure: the year opened at ${usd(SF.revenue)} raised`, SF.revenue, 847300);
  check('Country envelopes sum to the country total',
        fin.rows.reduce((t,r) => t + r.raised, 0), appData.finance.countryRaised);
  check('Revenue against target is derived, not stored',
        fin.revenuePct, pct(fin.revenue.raised, fin.revenue.target));

  /* ── What the decision cost, asserted rather than claimed ─────────────── */
  const tpS = calcTargetProgress('students', st.total);
  check('Every target still carries the figures it was chosen over',
        ['students','schools','stakeholders','countries']
          .filter(k => !Array.isArray(appData.targets[k].over)), []);
  check(`Seed figure: ${num(SF.students)} children read as ${SF.studentsPct}% of the `
        + `resolved target and ${SF.studentsAltPct}% of the next highest`,
        [SF.studentsPct, SF.studentsAltPct], [79.6, 115.4]);
  check('Progress against a target is computed from the register and the decision',
        calcTargetProgress('schools', sc.total).pct, pct(sc.total, appData.targets.schools.value));

  /* ── Indicators ───────────────────────────────────────────────────────── */
  const inds = calcAllIndicators();
  check('Every indicator resolves to a value or says why it cannot',
        inds.filter(i => i.value === null && !i.blocked).map(i => i.indicator.code), []);
  check('The two indicators with no baseline are marked uncomputable, not zero',
        inds.filter(i => i.blocked).map(i => i.indicator.code), ['G-2','OC1-b']);
  check('Both of those name the gap that blocks them',
        inds.filter(i => i.blocked).every(i => i.indicator.blockedBy && i.indicator.blockedNote), true);
  check('No indicator holds a copy of a reconciled target',
        appData.indicators.filter(i => i.targetKey && i.target !== undefined).map(i => i.code), []);
  check('Indicators read the live target, so a changed decision carries through',
        ['P1-O','P1-3','P2-O'].map(c => calcIndicator(c).target),
        [appData.targets.students.value, appData.targets.schools.value,
         appData.targets.stakeholders.value]);
  /* A form that logs to a register nothing recognises is inert: the audit
     trail shows the write, and no data-quality verdict ever moves for it.
     Silent and wrong, so it is checked. */
  check('Every register a form writes to is one the system knows',
        [...new Set(appData.entryLog.map(e => e.register))]
          .filter(k => !appData.registers.some(r => r.key === k)
                    && !ENTRY_UNASSESSED_REGISTERS.includes(k)), []);
  check('Indicators are drawn from both plans',
        [inds.filter(i => i.indicator.plan === 'y2024').length > 0,
         inds.filter(i => i.indicator.plan === 'pooa5').length > 0], [true, true]);

  const failures = results.filter(r => !r.pass);
  return {passed:results.length - failures.length, total:results.length, failures, results,
          pending:false};
}

function dualTile(label, actual, key, unit){
  const p = calcTargetProgress(key, actual);
  const tone = p.met ? 'ok' : p.pct >= 85 ? 'warn' : 'bad';
  return `<div class="dual">
    <div class="d-top">
      <div><div class="d-l">${esc(label)}</div>
        <div class="d-v" style="color:var(--${tone})">${num(p.actual)}</div></div>
      <div style="text-align:right">
        <div class="d-l">of ${num(p.target)}</div>
        <div style="font:700 15px 'Fraunces',serif;color:var(--${tone})">${p.pct}%</div></div>
    </div>
    ${progressBar(p.pct, tone)}
    <div style="font-size:10.5px;color:var(--ink-mute);margin-top:6px">
      Target from ${esc(p.source)}${unit ? ' · ' + esc(unit) : ''}</div>
    ${p.alternatives.length ? `<div class="d-alt">
      ${p.alternatives.map(a => `<div class="d-a">against ${num(a.value)}
        <b style="color:var(--${a.met ? 'ok' : 'bad'})">${a.pct}%</b></div>`).join('')}
      </div>` : ''}
  </div>`;
}

function dashboardAlerts(){
  const out = [];
  const inds = calcAllIndicators();
  const blocked = inds.filter(i => i.blocked);
  const behind = inds.filter(i => !i.blocked && i.status.key === 'behind');
  const openQ = appData.countries.filter(c => c.openQuestion);
  const gapsOnReports = calcGapImpact();

  if (blocked.length) out.push({tone:'bad', icon:'bi-slash-circle',
    title:`${blocked.length} indicators cannot be computed at all`,
    sub:`${blocked.map(i => i.indicator.code).join(' and ')} measure a change from a baseline that `
      + `was never recorded. They report nothing rather than zero.`,
    view:'indicators', cta:'Indicators'});
  if (behind.length) out.push({tone:'warn', icon:'bi-graph-down-arrow',
    title:`${behind.length} indicators are behind target`,
    sub:behind.map(i => `${i.indicator.code} at ${fmtVal(i.value, i.indicator.unit)} against `
      + `${fmtVal(i.target, i.indicator.unit)}`).join(' · '),
    view:'indicators', cta:'Indicators'});
  out.push({tone:'warn', icon:'bi-question-circle',
    title:`${appData.gaps.length} sections of the plan were never filled in`,
    sub:`They hold up ${Object.keys(gapsOnReports).length} reports. Each one is carried with the `
      + `question that would close it, and none is filled with an invented figure.`,
    view:'reconcile', cta:'Plan Reconciliation'});
  if (openQ.length) out.push({tone:'info', icon:'bi-globe2',
    title:`${openQ.length} countries carry an unresolved question`,
    sub:openQ.map(c => `${c.name}: ${c.openQuestion}`).join(' '),
    view:'countries', cta:'Countries'});
  const fol = calcFoL();
  out.push({tone:'info', icon:'bi-stars',
    title:`${fol.records.length - fol.atBenchmark} schools are below the Intermediate benchmark`,
    sub:`Each has an improvement plan naming its two weakest domains from the self-study.`,
    view:'fol', cta:'Fullness of Life'});
  return out;
}

/* ═══════════════════════════════════════════════════════════════════════════
   6e. INDICATORS — from both plans, in one list
   ═══════════════════════════════════════════════════════════════════════════ */
let indFilter = 'all';

function renderIndicators(){
  let rows = calcAllIndicators();
  if (indFilter === 'y2024' || indFilter === 'pooa5')
    rows = rows.filter(r => r.indicator.plan === indFilter);
  if (indFilter === 'blocked') rows = rows.filter(r => r.blocked);
  if (indFilter === 'behind')  rows = rows.filter(r => r.status.key === 'behind' || r.status.key === 'near');

  const all = calcAllIndicators();
  const counts = {all:all.length,
    y2024:all.filter(r => r.indicator.plan === 'y2024').length,
    pooa5:all.filter(r => r.indicator.plan === 'pooa5').length,
    blocked:all.filter(r => r.blocked).length,
    behind:all.filter(r => r.status.key === 'behind' || r.status.key === 'near').length};
  const F = [['all','All'],['y2024','2024 logframe'],['pooa5','POOA v5'],
             ['behind','Behind or close'],['blocked','Cannot compute']];

  const byLevel = {};
  rows.forEach(r => (byLevel[r.indicator.level] = byLevel[r.indicator.level] || []).push(r));
  const order = ['Goal','Objective','Outcome','Output'];

  return `<div class="sec-title">Indicators</div>
    <div class="sec-sub">Every indicator both plans carry, with the register that drives it.
      An indicator with no register and no baseline reports nothing — it does not report zero.</div>

    <div class="kpi-row">
      ${kpiTile('Indicators', String(counts.all), 'Across both plans')}
      ${kpiTile('Computed live', String(counts.all - counts.blocked),
        'Driven by a register that updates as records change', 'ok')}
      ${kpiTile('Cannot be computed', String(counts.blocked),
        'No baseline was ever recorded', counts.blocked ? 'bad' : 'ok')}
      ${kpiTile('Behind or close', String(counts.behind),
        'Against a target the plan actually sets', counts.behind ? 'warn' : 'ok')}
    </div>

    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px">
      ${F.map(([k,l]) => `<button class="btn btn-sm${indFilter === k ? ' btn-primary' : ''}"
        data-action="ind-filter" data-k="${k}">${esc(l)}
        <span style="opacity:.7">${counts[k]}</span></button>`).join('')}
    </div>

    ${order.filter(l => byLevel[l]).map(l => `
      <div class="card" style="margin-bottom:14px">
        <div class="card-head"><h3>${esc(l)}</h3>
          <span style="font-size:11px;color:var(--ink-mute)">${byLevel[l].length}</span></div>
        <div class="card-body" style="padding-top:4px">

        </div></div>`).join('')}

    ${rows.length ? '' : `<div class="empty"><i class="bi bi-funnel"></i>
      <h4>Nothing matches that filter</h4><p>Choose another above.</p></div>`}`;
}

function indicatorRow(r){
  const i = r.indicator;
  return `<div class="ind-row${r.blocked ? ' blocked' : ''}">
    <div><span class="mono" style="font-size:11.5px;font-weight:600">${esc(i.code)}</span>
      <div style="margin-top:4px"><span class="plan-tag ${esc(i.plan)}">${
        esc(i.plan === 'y2024' ? '2024' : 'POOA')}</span></div></div>
    <div><div class="i-t">${esc(i.text)}</div>
      <div class="i-s">${esc(i.source)}${r.note ? ' · ' + esc(r.note) : ''}</div>
      ${r.blocked ? `<div class="lf-flag" style="color:var(--bad)">

          style="padding:2px 6px">gap ${esc(i.blockedBy)}</button></span></div>` : ''}</div>
    <div class="ind-v">${r.blocked ? '<span style="color:var(--bad);font-size:13px">—</span>'
      : fmtVal(r.value, i.unit)}
      <small>${r.target !== null ? 'target ' + fmtVal(r.target, i.unit)
        : 'no target set'}</small></div>
    <div>${r.pct !== null ? progressBar(r.pct, r.status.tone) +
      `<div style="font-size:10.5px;color:var(--ink-mute);margin-top:4px">${r.pct}% of target</div>`
      : '<span style="font-size:11px;color:var(--ink-mute)">—</span>'}</div>
    <div class="i-st">${chip(r.status.label, r.status.tone)}</div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   6f. PLAN RECONCILIATION
   The system presents what the documents say. A person decides. The decision
   is recorded with a name and a date, and changing it moves every figure that
   depends on it — which is the point: a target is a choice, not a reading.
   ═══════════════════════════════════════════════════════════════════════════ */
let recTab = 'diff';

/* Apply a decision and carry it through to the target it drives. */
function applyDecision(id, value, source, note){
  const r = appData.reconciliation.find(x => x.id === id);
  if (!r) return null;
  const before = r.decision ? r.decision.value : null;
  r.decision = {value, source, by:currentUser.name, on:appData.config.today,
                rule:'changed by hand', note:note || ''};

  const key = REC_TARGET[id];
  let moved = null;
  if (key && typeof value === 'number'){
    const t = appData.targets[key];
    /* Whatever is no longer chosen becomes an alternative, so the comparison
       the screen offers never loses a figure. */
    const all = r.quotes.map(q => q.value).filter(v => typeof v === 'number');
    t.value = value;
    t.source = source;
    t.over = all.filter(v => v !== value);
    moved = {key, from:before, to:value};
  }
  if (id === 'R2' && typeof value === 'string'){
    appData.config.project.end = value;
    moved = {key:'project end', from:before, to:value};
  }
  appData.decisionLog.unshift({at:nowStamp(), id, topic:r.topic, from:before, to:value,
                               source, by:currentUser.name, note:note || ''});
  return moved;
}
function nowStamp(){
  const d = new Date(appData.config.today);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}

function renderReconcile(){

  const res = appData.config.resolution;
  const open = R.filter(r => !r.decision).length;
  const TABS = [['diff','Differences',R.length],['gaps','Gaps',G.length],
                ['log','Decision log',L.length]];

  const head = `<div class="sec-title">Plan Reconciliation</div>
    <div class="sec-sub">Three documents describe this project, and they do not agree. Eval360
      shows what each one says and records what was decided. It does not choose, and it does not
      average.</div>

    <div class="kpi-row">
      ${kpiTile('Differences found', String(R.length), 'Across the three source documents', 'bad')}
      ${kpiTile('Decided', String(R.length - open),
        `Rule: ${esc(res.rule)} · ${fmtDate(res.decidedOn)}`, 'ok')}
      ${kpiTile('Left open', String(open),
        open ? 'A blank is not a contradiction and is not filled' : 'Nothing outstanding',
        open ? 'warn' : 'ok')}
      ${kpiTile('Sections never filled in', String(G.length),
        'Each carries the question that would close it', 'warn')}
    </div>

    <div class="tabs">${TABS.map(([k,l,n]) =>
      `<button class="${recTab === k ? 'on' : ''}" data-action="rec-tab" data-k="${k}">

  return head + `
    <div class="banner info"><i class="bi bi-sliders2"></i>

}

function recCard(r){
  const d = r.decision;
  const key = REC_TARGET[r.id];
  const live = key ? calcTargetProgress(key,
      key === 'students' ? calcStudents().total
    : key === 'schools' ? calcSchools().total
    : key === 'stakeholders' ? calcTraining().inTraining
    : appData.countries.length) : null;

  return `<div class="rec ${d ? r.severity : 'open'}">
    <div class="rec-top">
      <span class="mono" style="font-weight:600">${esc(r.id)}</span>
      <h4>${esc(r.topic)}</h4>
      ${chip(r.severity === 'high' ? 'High' : r.severity === 'medium' ? 'Medium' : 'Low',
        r.severity === 'high' ? 'bad' : r.severity === 'medium' ? 'warn' : 'grey')}
      ${d ? chip('Decided','ok','bi-check-circle-fill') : chip('Left open','warn','bi-dash-circle')}
      <div style="flex:1"></div>
      <button class="btn btn-sm" data-action="rec-change" data-id="${esc(r.id)}">
        <i class="bi bi-pencil"></i> ${d ? 'Change' : 'Decide'}</button>
    </div>

    <div class="quotes">
      ${r.quotes.map(q => {
        const chosen = d && String(q.value) === String(d.value);
        return `<div class="q${chosen ? ' chosen' : ''}">
          <div class="q-src"><span>${esc(q.src)}</span>
            ${chosen ? '<i class="bi bi-check-circle-fill" style="color:var(--ok)"></i>' : ''}</div>
          <div class="q-txt">&ldquo;${esc(q.text)}&rdquo;</div>
          ${q.value !== null && q.value !== undefined
            ? `<div class="q-val">${typeof q.value === 'number' ? num(q.value) : esc(String(q.value))}</div>`
            : ''}</div>`;
      }).join('')}
    </div>

    ${r.note ? `<div class="rec-note">${esc(r.note)}</div>` : ''}

    ${d ? `<div class="rec-dec"><i class="bi bi-check-circle-fill"></i>
      <div class="d-main">
        <strong>Using ${typeof d.value === 'number' ? num(d.value) : esc(String(d.value))}</strong>,
        from ${esc(d.source)}. Decided by ${esc(d.by)} on ${fmtDate(d.on)} — ${esc(d.rule)}.
        ${d.note ? `<br><em>${esc(d.note)}</em>` : ''}
        ${d.caveat ? `<div class="rec-cav"><i class="bi bi-exclamation-triangle-fill"></i>
          <span>${esc(d.caveat)}</span></div>` : ''}
      </div>
      ${live ? `<div style="text-align:right;min-width:140px">
        <div style="font:600 10px 'Inter',sans-serif;letter-spacing:.08em;text-transform:uppercase;
          color:var(--ink-mute)">Delivered</div>
        <div style="font:700 19px 'Fraunces',serif;color:var(--${live.met ? 'ok' : 'warn'})">
          ${num(live.actual)}</div>
        <div style="font-size:11px;color:var(--ink-mute)">${live.pct}% of this target</div>
        ${live.alternatives.map(a => `<div style="font-size:10.5px;color:var(--ink-mute)">
          ${a.pct}% of ${num(a.value)}</div>`).join('')}
      </div>` : ''}
      </div>`
    : `<div class="rec-dec" style="background:var(--warn-soft)">
        <i class="bi bi-dash-circle" style="color:var(--warn)"></i>
        <div class="d-main"><strong>Left open on purpose.</strong> ${esc(r.note || '')}
          Nothing is filled in on this system's own authority.</div></div>`}
  </div>`;
}

      ${kpiTile('Teachers trained', `${num(x.teachersTrained)} of ${num(x.teachers.length)}`,
        x.teachers.length ? pct(x.teachersTrained, x.teachers.length) + '% of the country’s teachers' : '—')}
      ${kpiTile('Stakeholders in training', num(x.inTraining),
        `of ${num(x.stakeholders.length)} enrolled`)}
      ${kpiTile('Funds raised', usd(x.money.raised),
        `${x.moneyPct}% of the ${usd(x.money.target)} envelope`,
        x.moneyPct >= 100 ? 'ok' : 'warn')}

    ${x.schools.length ? `<div class="card" style="margin-bottom:18px">

        <h4>No partner school is recorded here</h4>
        <p>B row 1 names ${esc(c.name)} a partner country and B row 32 describes work with children

          stakeholder training.</p></div>`}

    <div class="panel-grid">
      <div class="card"><div class="card-head"><h3>Stakeholder training</h3>
        ${chip(num(x.stakeholders.length) + ' enrolled','grey')}</div>

          ${(() => {
            const by = {};
            x.stakeholders.forEach(s => by[s.type] = (by[s.type] || 0) + 1);
            const n = x.stakeholders.length || 1;
            return Object.entries(by).map(([k,v]) => `
              <div style="margin-bottom:11px">
                <div style="display:flex;justify-content:space-between;font-size:12.5px;
                  margin-bottom:4px"><span>${esc(k)}</span><strong>${v}</strong></div>
                ${progressBar(pct(v,n),'brand')}</div>`).join('');
          })()}
        </div></div>

      <div class="card"><div class="card-head"><h3>School quality</h3>
        ${x.fol.length ? chip(x.folAtBenchmark + ' of ' + x.fol.length + ' at Intermediate',
          x.folAtBenchmark ? 'ok' : 'warn') : chip('no schools','grey')}</div>
        <div class="card-body">
          ${x.fol.length ? `
            <div style="font:700 26px 'Fraunces',serif;margin-bottom:3px">${x.folMean}</div>
            <div style="font-size:11.5px;color:var(--ink-mute);margin-bottom:13px">
              mean self-study score out of 4, round 2</div>
            ${appData.selfStudy.stages.map(sg => {
              const n = x.fol.filter(r => r.stage === sg).length;
              return `<div style="display:flex;justify-content:space-between;font-size:12.5px;
                padding:5px 0"><span class="stage-pill ${sg}">${sg}</span>
                <strong>${n}</strong></div>`;
            }).join('')}`
          : `<p style="margin:0;font-size:12.5px;color:var(--ink-mute);line-height:1.6">
              The Fullness of Life self-study runs on partner schools. There are none recorded
              here.</p>`}
        </div></div>
    </div>`;
}

   6i. PARTNER SCHOOLS

let schFilter = {country:'', level:'', stage:''};

function schoolTable(list){
  return `<table class="dt">
    <thead><tr><th>School</th><th>Country</th><th>Level</th><th class="n">Students</th>
      <th class="n">Capacity</th><th class="n">Attendance</th><th class="n">Teachers</th>
      <th>Fullness of Life</th></tr></thead>
    <tbody>${list.map(s => {
      const f = folFor(s.code);
      const tot = s.enrolledM + s.enrolledF;
      return `<tr class="clickable" data-action="go" data-view="school-detail"
        data-meta="${esc(s.code)}">
        <td><div class="sch-name">${esc(s.name || s.code)}
          ${s.name ? `<small class="mono">${esc(s.code)}</small>`
                   : '<small>name not given in any source document</small>'}</div></td>
        <td>${esc(s.country)}</td>
        <td>${chip(s.level, s.level === 'Primary' ? 'info' : 'brand')}</td>
        <td class="n"><strong>${num(tot)}</strong>
          <div style="font-size:10.5px;color:var(--ink-mute)">${num(s.enrolledM)}m · ${num(s.enrolledF)}f</div></td>
        <td class="n">${num(s.capacity)}
          <div style="font-size:10.5px;color:var(--ink-mute)">${pct(tot, s.capacity)}% full</div></td>
        <td class="n">${s.attendance}%</td>
        <td class="n">${s.teachers}</td>
        <td>${f ? `<span class="stage-pill ${f.stage}">${f.stage}</span>
            <div style="font-size:10.5px;color:var(--ink-mute);margin-top:3px">${
              f.mean} of 4</div>`
          : `<span class="chip grey">${esc(NOT_ASSESSED)}</span>
            <div style="font-size:10.5px;color:var(--ink-mute);margin-top:3px">no self-study
              yet</div>`}</td>
      </tr>`;
    }).join('')}</tbody></table>`;
}

function renderSchools(){
  let list = appData.schools.slice();
  const scope = SCOPE();
  if (scope) list = list.filter(s => s.country === scope);
  if (schFilter.country) list = list.filter(s => s.country === schFilter.country);
  if (schFilter.level)   list = list.filter(s => s.level === schFilter.level);
  if (schFilter.stage)   list = list.filter(s => {
    const f = folFor(s.code);
    return schFilter.stage === NOT_ASSESSED ? !f : (f && f.stage === schFilter.stage);
  });

  const all = scope ? appData.schools.filter(s => s.country === scope) : appData.schools;
  const sel = (key, label, opts) => `<select data-action="sch-filter" data-k="${key}"
    style="border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:500 12px 'Inter',sans-serif;
    background:var(--bg-card);color:var(--ink)">
    <option value="">${esc(label)}</option>
    ${opts.map(o => `<option value="${esc(o)}"${schFilter[key] === o ? ' selected' : ''}>
      ${esc(o)}</option>`).join('')}</select>`;

  return `<div class="ent-bar">
      <div><div class="sec-title">Partner Schools</div></div>
      <div>${entryBtn('school', null, 'Add a school', {primary:true, icon:'bi-building-add'})}</div>
    </div>
    <div class="sec-sub">The register behind the 27-school target. Six carry a name because a
      source document gives one; the rest carry a code, because inventing a school name in South
      Sudan is not this system's job. ${scope ? `Showing ${esc(scope)} only — your role is scoped
      to that country.` : ''}</div>

    <div class="kpi-row">
      ${kpiTile('Partner schools', num(all.length),
        `Target ${num(appData.targets.schools.value)} · ${esc(appData.targets.schools.source)}`,
        all.length >= appData.targets.schools.value ? 'ok' : 'warn')}
      ${kpiTile('Primary', num(all.filter(s => s.level === 'Primary').length), 'B Output 2: 14')}
      ${kpiTile('Secondary', num(all.filter(s => s.level === 'Secondary').length), 'B Output 2: 13')}
      ${kpiTile('Named in a document', num(all.filter(s => s.name).length),
        `of ${num(all.length)} · the rest await B2THEWORLD's register`, 'warn')}
    </div>

    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:15px;align-items:center">
      ${sel('country','All countries', appData.countries.filter(c => c.schools).map(c => c.name))}
      ${sel('level','Both levels', ['Primary','Secondary'])}
      ${sel('stage','Any stage', folUnassessed().length
        ? appData.selfStudy.stages.concat([NOT_ASSESSED]) : appData.selfStudy.stages)}
      <span style="font-size:12px;color:var(--ink-mute)">${list.length} of ${all.length}</span>
    </div>

    ${list.length ? `<div class="card"><div class="tbl-scroll">${schoolTable(list)}</div></div>`
      : `<div class="empty"><i class="bi bi-funnel"></i><h4>Nothing matches</h4>
         <p>Change the filters above.</p></div>`}`;
}

        <div style="display:flex;gap:8px;align-items:center">
          <span class="stage-pill ${r2.stage}">${r2.stage}</span>
          ${entryBtn('school', s.code, 'Edit', {icon:'bi-pencil'})}

        </div></div>
      <div class="card-body">
        <div class="kpi-row" style="margin-bottom:0">

          ${kpiTile('Capacity', num(s.capacity), `${pct(tot, s.capacity)}% full`)}
          ${kpiTile('Attendance', s.attendance + '%',

            `${teach.filter(t => t.trained).length} trained on Why/Play/Lead`)}
        </div>
      </div></div>

    ${!r2 ? `<div class="card" style="margin-bottom:18px">
      <div class="card-head"><h3>Fullness of Life self-study</h3>
        ${chip(NOT_ASSESSED,'grey')}</div>
      <div class="card-body"><div class="empty" style="padding:22px 0">
        <i class="bi bi-stars"></i><h4>No self-study has been run here</h4>
        <p>This school is on the register but has not assessed itself yet, so it has no stage, no
          mean and no improvement priorities. It is counted in the ${num(calcSchools().total)}
          partner schools and left out of the ${calcFoL('R2').records.length} assessed — rather
          than scored zero, which would make an unassessed school read as the worst in the
          network.</p>
        <div style="margin-top:14px">${entryBtn('selfstudy', s.code + ':R2',
          'Run the first self-study', {primary:true, icon:'bi-stars'})}</div>
      </div></div></div>` : `
    <div class="panel-grid">
      <div class="card"><div class="card-head"><h3>Fullness of Life self-study</h3>
        <span style="font-size:11px;color:var(--ink-mute)">${
          r1 ? esc(r1.roundLabel) + ' \u2192 ' : ''}${esc(r2.roundLabel)}</span></div>
        <div class="card-body">
          ${D.map(d => {
            const b = r2.scores[d.key], a = r1 ? r1.scores[d.key] : null;
            return `<div class="dom">
              <div>${esc(d.label)}</div>
              <div class="twobar">
                <i class="r2" style="width:${b/4*100}%"></i>
                <i class="r1" style="width:${a === null ? 0 : a/4*100}%"></i>
                <u style="left:${appData.selfStudy.benchmark/4*100}%"
                  title="Intermediate benchmark"></u></div>
              <div class="d-sc">${a === null ? '' : a + ' \u2192 '}<b>${b}</b></div></div>`;

          <div style="display:flex;justify-content:space-between;align-items:center;

              ${appData.selfStudy.benchmark}.0 benchmark</div>
            <div style="font:700 20px 'Fraunces',serif;color:var(--${
              r2.mean >= appData.selfStudy.benchmark ? 'ok' : 'warn'})">${

          <div style="font-size:11px;color:var(--ink-mute);margin-top:7px">

            <td><strong>${s.graduation}%</strong></td></tr>` : ''}
          ${s.university !== null ? `<tr><td>Entered university</td>
            <td><strong>${num(s.university)}</strong></td></tr>` : ''}

            ${lead.filter(l => l.consistent).length} applying all four leadership indicators</td></tr>

        <div style="font-size:11px;color:var(--ink-mute);margin-top:9px;line-height:1.55">

/* ═══════════════════════════════════════════════════════════════════════════
   6j. STUDENTS & ENROLMENT
   ═══════════════════════════════════════════════════════════════════════════ */
function renderStudents(){
  const st = calcStudents(), sc = calcSchools();
  const p = calcTargetProgress('students', st.total);
  const byLevel = ['Primary','Secondary'].map(lv => {
    const l = appData.schools.filter(s => s.level === lv);
    return {level:lv, schools:l.length,
            male:l.reduce((t,s) => t + s.enrolledM, 0),
            female:l.reduce((t,s) => t + s.enrolledF, 0)};
  });

  afterRender(() => {
    const T = chartTheme();
    mountChart('ch-lvl', {type:'bar',
      data:{labels:byLevel.map(b => b.level), datasets:[
        {label:'Male', data:byLevel.map(b => b.male), backgroundColor:T.brand, borderRadius:3},
        {label:'Female', data:byLevel.map(b => b.female), backgroundColor:T.accent, borderRadius:3}]},
      options:{plugins:{legend:{display:true, labels:{color:T.ink, font:{size:10}, boxWidth:10}}},
        scales:{x:{stacked:true, grid:{display:false}, ticks:{color:T.mute, font:{size:10}}},
                y:{stacked:true, grid:{color:T.line}, ticks:{color:T.mute, font:{size:10}}}}}});
    mountChart('ch-out', {type:'bar',
      data:{labels:['Attendance','Retention','Transition','Graduation'], datasets:[
        {data:[st.attendance, st.retention, st.transition, st.graduation],
         backgroundColor:[st.attendance >= 95 ? T.ok : T.warn, T.ok, T.info, T.brand],
         borderRadius:3}]},
      options:{scales:{y:{max:100, grid:{color:T.line},
        ticks:{color:T.mute, font:{size:10}, callback:v => v + '%'}}}}});
  });

  return `<div class="ent-bar">
      <div><div class="sec-title">Students &amp; Enrolment</div></div>
      <div>${entryBtn('school', null, 'Add a school', {icon:'bi-building-add'})}</div>
    </div>
    <div class="sec-sub">Enrolment is held per school, by sex. <strong>No child-level record exists
      anywhere in this system</strong> — there is no name, no date of birth and no identifier to
      hold, which is the simplest way to be safe with data about children in conflict zones.</div>

    <div class="kpi-row">
      ${dualTile('Students served', st.total, 'students')}
      ${kpiTile('Female share', st.femaleShare + '%',
        `${num(st.female)} of ${num(st.total)}`, st.femaleShare >= 48 ? 'ok' : 'warn')}
      ${kpiTile('Places filled', pct(st.total, st.capacity) + '%',
        `${num(st.total)} of ${num(st.capacity)} across ${sc.total} schools`)}
      ${kpiTile('Entered university', num(st.university),
        'From the secondary schools this year')}
    </div>

    <div class="banner ${p.met ? 'ok' : 'warn'}">
      <i class="bi bi-${p.met ? 'check-circle-fill' : 'info-circle-fill'}"></i>
      <div><strong>${num(st.total)} students against a target of ${num(p.target)} — ${p.pct}%.</strong>
        ${p.alternatives.length ? `The same ${num(st.total)} reads
        ${p.alternatives.map(a => `<strong>${a.pct}%</strong> against the ${num(a.value)} in
        ${a.value === 6898 ? 'B Output 1' : 'B row 1'}`).join(' and ')}.
        The target in use was chosen on ${fmtDate(appData.config.resolution.decidedOn)};
        <button class="btn btn-sm" data-action="go" data-view="reconcile"
          style="margin-left:5px">see all three</button>` : ''}</div></div>

    <div class="panel-grid">
      <div class="card"><div class="card-head"><h3>Enrolment by level and sex</h3>
        <span style="font-size:11px;color:var(--ink-mute)">${sc.primary} primary ·
          ${sc.secondary} secondary</span></div>
        <div class="chart-wrap"><canvas id="ch-lvl"></canvas></div></div>
      <div class="card"><div class="card-head"><h3>Outcomes</h3>
        <span style="font-size:11px;color:var(--ink-mute)">enrolment-weighted across all schools</span></div>
        <div class="chart-wrap"><canvas id="ch-out"></canvas></div>
        <div class="card-body" style="padding-top:0;font-size:11px;color:var(--ink-mute)">
          Transition is measured on primary schools only, graduation on secondary only.</div></div>
    </div>

    <div class="card">
      <div class="card-head"><h3>By country</h3>
        <button class="btn btn-sm btn-ghost" data-action="go" data-view="countries">
          Countries <i class="bi bi-arrow-right"></i></button></div>
      <div class="tbl-scroll"><table class="dt">
        <thead><tr><th>Country</th><th class="n">Schools</th><th class="n">Male</th>
          <th class="n">Female</th><th class="n">Total</th><th class="n">Female share</th>
          <th>Share of all students</th></tr></thead>
        <tbody>${st.byCountry.map(c => `<tr class="clickable" data-action="go"
          data-view="country-detail" data-meta="${esc(c.cc)}">
          <td><strong>${esc(c.country)}</strong></td>
          <td class="n">${c.schools}</td>
          <td class="n">${num(c.male)}</td><td class="n">${num(c.female)}</td>
          <td class="n"><strong>${num(c.male + c.female)}</strong></td>
          <td class="n">${c.male + c.female ? pct(c.female, c.male + c.female) + '%' : '—'}</td>
          <td style="min-width:120px">${progressBar(pct(c.male + c.female, st.total), 'brand')}
            <div style="font-size:10.5px;color:var(--ink-mute);margin-top:3px">
              ${pct(c.male + c.female, st.total)}%</div></td></tr>`).join('')}
        </tbody>
        <tfoot><tr style="background:var(--bg-muted);font-weight:700">
          <td>Total</td><td class="n">${sc.total}</td><td class="n">${num(st.male)}</td>
          <td class="n">${num(st.female)}</td><td class="n">${num(st.total)}</td>
          <td class="n">${st.femaleShare}%</td><td></td></tr></tfoot>
      </table></div>
      <div class="card-body" style="padding-top:10px;font-size:11.5px;color:var(--ink-mute)">
        A §2.2 asks for these figures split by sex for students, teachers, school leaders, steering
        committee members and owners. All 48 of its cells are empty in the source document — gap G1.
        What is shown here is what the school register holds.</div>
    </div>`;
}

/* ═══════════════════════════════════════════════════════════════════════════
   6k. TEACHERS — the instrument behind OC1
   ═══════════════════════════════════════════════════════════════════════════ */
let tchFilter = {country:'', trained:''};

function renderTeachers(){
  const ob = calcObservation(), eff = calcTrainingEffect();
  const oc1 = calcIndicator('OC1-a');
  const scope = SCOPE();
  let list = appData.teachers.filter(t => !scope || t.country === scope);
  if (tchFilter.country) list = list.filter(t => t.country === tchFilter.country);
  if (tchFilter.trained) list = list.filter(t =>
    tchFilter.trained === 'yes' ? t.trained : !t.trained);

  const bySchool = {};
  list.forEach(t => (bySchool[t.school] = bySchool[t.school] || []).push(t));

  afterRender(() => {
    const T = chartTheme();
    mountChart('ch-tdom', {type:'bar',
      data:{labels:OBS_DOMAINS.map(d => d.label.split(' — ')[0]), datasets:[
        {label:'Round 1', data:OBS_DOMAINS.map(d => ob.domains[d.key].before),
         backgroundColor:T.line, borderRadius:3},
        {label:'Round 2', data:OBS_DOMAINS.map(d => ob.domains[d.key].after),
         backgroundColor:T.ok, borderRadius:3}]},
      options:{plugins:{legend:{display:true, labels:{color:T.ink, font:{size:10}, boxWidth:10}}},
        scales:{y:{max:4, grid:{color:T.line}, ticks:{color:T.mute, font:{size:10}}}}}});
  });

  const sel = (key, label, opts) => `<select data-action="tch-filter" data-k="${key}"
    style="border:1px solid var(--line);border-radius:8px;padding:7px 10px;

/* ═══════════════════════════════════════════════════════════════════════════
   6o. CLASSROOM OBSERVATION — the instrument, and how far it can be trusted
   ═══════════════════════════════════════════════════════════════════════════ */
function renderObservation(){
  const ob = calcObservation();
  const dq = appData.gaps.find(g => g.id === 'G6');
  const dist = [1,2,3,4].map(band => ({band,
    n: appData.teachers.filter(t => Math.round(t.meanAfter) === band).length}));

  afterRender(() => {
    const T = chartTheme();
    mountChart('ch-dist', {type:'bar',
      data:{labels:['Entry (1)','Developing (2)','Intermediate (3)','Advanced (4)'],
        datasets:[{data:dist.map(d => d.n),
          backgroundColor:[T.bad, T.warn, T.ok, T.brand], borderRadius:3}]},
      options:{scales:{y:{grid:{color:T.line},
        ticks:{color:T.mute, font:{size:10}, precision:0}}}}});
  });

  return `<div class="sec-title">Classroom Observation</div>
    <div class="sec-sub">The instrument behind OC1. Five domains, scored 1 to 4, used on every
      teacher twice — once before the training cycle and once after.</div>

    <div class="kpi-row">
      ${kpiTile('Observations recorded', num(ob.total * 2),
        `${num(ob.total)} teachers × 2 rounds`)}
      ${kpiTile('Coverage', '100%', 'Every teacher on the register was observed twice', 'ok')}
      ${kpiTile('At 3 or above', num(ob.consistent),
        `${ob.consistentPct}% after the second round`, ob.consistentPct >= 50 ? 'ok' : 'warn')}
      ${kpiTile('Mean movement', `+${Math.round((ob.after - ob.before) * 100) / 100}`,
        `${ob.before} → ${ob.after} · OC1-a reads +${ob.increase}%`, 'ok')}
    </div>

    <div class="card" style="margin-bottom:18px">
      <div class="card-head"><h3>The five domains</h3>
        ${chip('Why · Play · Lead, plus two','brand')}</div>
      <div class="card-body">
        ${OBS_DOMAINS.map(d => {
          const b = ob.domains[d.key];
          return `<div class="movebar">
            <div><strong>${esc(d.label.split(' — ')[0])}</strong>
              <div style="font-size:11px;color:var(--ink-mute)">${esc(d.label.split(' — ')[1] || '')}</div></div>
            <div class="mv"><i class="b" style="width:${b.after/4*100}%"></i>
              <i class="a" style="width:${b.before/4*100}%"></i></div>
            <div class="mvn">${b.before} → <b>${b.after}</b></div></div>`;
        }).join('')}
        <div style="font-size:11.5px;color:var(--ink-soft);line-height:1.6;margin-top:13px">
          The first three are B2THEWORLD's own pillars. <em>Adaptive</em> and <em>positive</em>
          come from POOA v5's OC1, which asks for "adaptive, positive, active, play-based and
          level-appropriate" practice — so the instrument carries all five rather than only the
          three the 2024 framework names.</div>
      </div></div>

    <div class="panel-grid">
      <div class="card"><div class="card-head"><h3>Where teachers sit after round 2</h3>
        <span style="font-size:11px;color:var(--ink-mute)">rounded overall score</span></div>
        <div class="chart-wrap"><canvas id="ch-dist"></canvas></div></div>

      <div class="card"><div class="card-head"><h3>How far this can be trusted</h3>
        ${chip('gap ' + esc(dq.id), 'warn')}</div>
        <div class="card-body">
          <p style="margin:0 0 12px;font-size:12.5px;line-height:1.65;color:var(--ink-soft)">
            Observation is the softest data this system holds, and the source documents say
            nothing about how to keep it honest. ${esc(dq.detail)}</p>
          <div class="watch">
            <div class="w-c">V</div>
            <div><div class="w-t"><strong>Validity</strong> — does the instrument measure
              instructional quality, or does it measure how a teacher behaves when watched?</div>
              <div class="w-s">Not addressed in any document.</div></div></div>
          <div class="watch">
            <div class="w-c">R</div>
            <div><div class="w-t"><strong>Reliability</strong> — would a second observer score the
              same lesson the same way?</div>
              <div class="w-s">No inter-observer check is described, and the system does not record
                who observed which round.</div></div></div>
          <div class="watch">
            <div class="w-c">P</div>
            <div><div class="w-t"><strong>Precision</strong> — a mean of five domains to two
              decimal places implies more accuracy than a four-point scale can carry.</div>
              <div class="w-s">Scores are shown to one decimal on screen for that reason.</div></div></div>
          <div style="font-size:12px;line-height:1.6;color:var(--ink-soft);margin-top:12px">
            <strong>${esc(dq.question)}</strong>
